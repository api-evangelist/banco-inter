openapi: 3.2.0
info:
  title: Banco Inter Solicitar Recorrência API
  version: ''
  description: 'Operations tagged Solicitar Recorrência across 2 of this provider''s published API definitions: swagger-api-pix-automatico-yaml.yaml, banco-inter-pix-automatico-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cdpj.partners.bancointer.com.br/pix/v2
  description: Servidor de Produção
- url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
  description: Servidor de Sandbox
tags:
- name: Solicitar Recorrência
  description: 'Esta seção apresenta os endpoints relacionados ao gerenciamento de solicitações de confirmação de recorrência,

    que equivalem às autorizações necessárias.


    Para que as recorrências tenham validade e possam gerar cobranças automaticamente, o cliente pagador precisa

    realizar o aceite.


    Por meio dessa autorização, o cliente confirma que concorda com a recorrência estabelecida.


    ---'
paths:
  /solicrec:
    post:
      tags:
      - Solicitar Recorrência
      summary: Criar solicitação de confirmação de recorrência
      operationId: postSolicRec
      description: 'Gera a solicitação de aceite via push para uma recorrência previamente criada.


        Requer o ID da recorrência, data de expiração e dados do destinatário.


        O aceite ou rejeição da solicitação refletirá no status da recorrência, e poderá ser acompanhado via webhook ou consulta da recorrência. Recorrência APROVADA quando a solicitação for aceita e REJEITADA quando não aceita.


        Código e descrição do motivo da rejeição ficarão disponíveis no objeto `encerramento` da recorrência.


        * Escopo requerido: solicrec.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj.partners.bancointer.com.br/pix/v2/solicrec


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/solicrec'
      requestBody:
        $ref: '#/components/requestBodies/SolicRecBody'
      responses:
        '201':
          description: Solicitação de recorrência criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicRecCompleta'
              examples:
                response1:
                  $ref: '#/components/examples/solicRecResponse1'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                requisicao1:
                  $ref: '#/components/examples/OperacaoInvalidaSolicRecExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /solicrec/{idSolicRec}:
    get:
      tags:
      - Solicitar Recorrência
      summary: Consultar solicitação de recorrência
      operationId: getSolicRec
      parameters:
      - $ref: '#/components/parameters/idSolicRec'
      description: 'Endpoint utilizado para consultar uma solicitação específica de recorrência.


        O objetivo é obter os dados da solicitação de confirmação, como: status, informações do beneficiário,

        histórico de atualizações, política de retentativa, entre outros.


        * Escopo requerido: solicrec.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj.partners.bancointer.com.br/pix/v2/solicrec/{idSolicRec}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/solicrec/{idSolicRec}'
      responses:
        '200':
          description: Dados da solicitação da recorrência.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicRecCompleta'
              examples:
                response1:
                  $ref: '#/components/examples/solicRecResponse1'
                response2:
                  $ref: '#/components/examples/solicRecResponse2'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    patch:
      tags:
      - Solicitar Recorrência
      summary: Revisar solicitação de recorrência
      operationId: patchSolicRec
      parameters:
      - $ref: '#/components/parameters/idSolicRec'
      description: 'Endpoint utilizado com o objetivo de cancelar uma solicitação de recorrência.

        * Escopo requerido: solicrec.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj.partners.bancointer.com.br/pix/v2/solicrec/{idSolicRec}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/solicrec/{idSolicRec}'
      requestBody:
        $ref: '#/components/requestBodies/SolicRecBodyRevisada'
      responses:
        '201':
          description: Solicitação de recorrência atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicRecCompleta'
              examples:
                response1:
                  $ref: '#/components/examples/solicRecResponse3'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                requisicao1:
                  $ref: '#/components/examples/OperacaoInvalidaSolicRecExample2'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /sandbox/solicrec/{idRec}/status:
    patch:
      tags:
      - Solicitar Recorrência
      summary: Alterar status da solicitação de recorrência (Sandbox)
      operationId: changeStatusSolicRec
      description: 'Endpoint exclusivo de sandbox, simula o aceite ou rejeição da solicitação pelo usuário pagador.


        Permite alterar o status de uma recorrência vinculada a uma solicitação de recorrência para:


        `ACEITA` ou `REJEITADA`


        A aceitação da solicitação de recorrência é necessária para prosseguir com a criação de cobranças recorrentes.


        (**Exclusivo para o ambiente Sandbox**)


        * Escopo requerido: solicrec.write

        * rate limit:


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/sandbox/solicrec/{idRec}/status'
      parameters:
      - $ref: '#/components/parameters/idRec'
      requestBody:
        $ref: '#/components/requestBodies/ChangeStatusSolicRecRequestBody'
      responses:
        '200':
          description: Status atualizado com sucesso.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
components:
  schemas:
    Problema:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI de referência que identifica o tipo de problema. De acordo com a RFC 7807.
          example: https://pix.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: Descrição resumida do problema.
          example: Not found
        status:
          type: integer
          description: Código HTTP do status retornado.
          example: 404
        detail:
          type: string
          description: Descrição completa do problema.
        correlationId:
          type: string
          description: Identificador de correlação do problema para fins de suporte
        violacoes:
          type: array
          items:
            $ref: '#/components/schemas/Violacao'
    SolicRecStatus:
      type: object
      title: Status da Solicitação de Recorrência
      required:
      - status
      properties:
        status:
          type: string
          title: Status do registro da solicitação de recorrência
          description: 'Status da solicitação de recorrência:

            - `CRIADA`: Solicitação criada, aguardando envio

            - `ENVIADA`: Solicitação enviada ao pagador

            - `RECEBIDA`: Solicitação recebida pelo pagador

            - `REJEITADA`: Solicitação rejeitada pelo pagador

            - `ACEITA`: Solicitação aceita pelo pagador

            - `EXPIRADA`: Solicitação expirou sem resposta

            - `CANCELADA`: Solicitação cancelada

            '
          enum:
          - CRIADA
          - ENVIADA
          - RECEBIDA
          - REJEITADA
          - ACEITA
          - EXPIRADA
          - CANCELADA
    RecBase:
      title: Recorrência Base
      type: object
      required:
      - calendario
      - vinculo
      description: Atributos de Configuração de Recorrência
      properties:
        vinculo:
          $ref: '#/components/schemas/RecBaseObjeto'
        calendario:
          $ref: '#/components/schemas/RecBaseCalendario'
        valor:
          type: object
          description: Contendo `valorRec`e `ValorMinimoRecebedor`
          properties:
            valorRec:
              type: string
              pattern: \d{1,10}\.\d{2}
              title: Valor da recorrência
              description: Campo opcional, deve ser preenchido apenas quando o valor dos pagamentos for fixo ou não for sujeito a alteração durante a vigência da autorização.
            valorMinimoRecebedor:
              type: string
              pattern: \d{1,10}\.\d{2}
              title: Valor mínimo da recorrência
              description: Campo opcional. Valor definido pelo usuário recebedor. Se o usuário pagador atribuir um valor máximo para os pagamentos daquela autorização, ele não poderá ser inferior ao piso definido pelo usuário recebedor. Não pode ser preenchido nas autorizações de valor fixo, ou seja, com campo valor preenchido.
    RecBaseObjeto:
      type: object
      title: Descrição do Objeto da Recorrência
      required:
      - contrato
      - devedor
      description: Contendo `objeto`, `devedor` e `contrato`.
      properties:
        objeto:
          type: string
          title: Identificador do objeto de vínculo
          description: Campo de texto livre para informações referentes ao contrato que permitam ao usuário pagador reconhecer o objeto dos pagamentos periódicos por meio do Pix Automático.
          maxLength: 35
          example:
          - Conta de energia Av. Paulista, 1804
          - Serviço de internet banda larga
          - Assinatura anual
        devedor:
          title: Informações sobre o devedor da recorrência
          description: Contendo `nome` e `cpf` ou `cnpj`
          required:
          - nome
          - cpf
          - cnpj
          oneOf:
          - type: object
            title: nome e CPF
            properties:
              nome:
                type: string
                title: Nome
                description: Nome do devedor.
                maxLength: 140
              cpf:
                type: string
                title: CPF
                pattern: \d{11}
                description: CPF do devedor.
          - type: object
            title: nome e CNPJ
            properties:
              nome:
                type: string
                title: Nome
                description: Nome do devedor.
                maxLength: 140
              cnpj:
                type: string
                title: CNPJ
                pattern: \d{14}
                description: CNPJ do devedor.
        contrato:
          type: string
          title: Objeto da autorização
          description: Número, identificador, ou código que representa o objeto da autorização (contrato, pedido etc.).
          maxLength: 35
    SolicRecId:
      type: object
      title: Id da Solicitação de recorrência
      required:
      - idSolicRec
      description: Dados criados ou alterados da cobrança recorrente via API Pix
      properties:
        idSolicRec:
          type: string
          title: ID Solicitação da Recorrência
          description: "# Identificador da Solicitação da Recorrência\n\nRegra de formação:\n- SCxxxxxxxxyyyyMMddzzzzzzzzzzz (29 caracteres; “case sensitive”, isso é, diferencia letras maiúsculas e minúsculas), sendo:\n  - SC - fixo (2 caracteres);\n  - xxxxxxxx – ISPB do agente que envia a mensagem pain.009 de\nsolicitação de confirmação da recorrência;\n  - yyyyMMdd – data (8 caracteres) de criação da mensagem pain.009\nde solicitação de confirmação da recorrência;\n  - zzzzzzzzzzz – sequencial criado pelo agente que gerou a\nmensagem de solicitação de confirmação da recorrência (11 caracteres alfanuméricos [a-z|A-Z|0-9]). Deve ser único dentro de cada “yyyyMMdd”.\n"
          pattern: '[a-zA-Z0-9]{29}'
          minLength: 29
          maxLength: 29
          example: SC1234567820240115abcdefghijk
    SolicRecCompleta:
      type: object
      title: Solicitação de Recorrência Completa
      required:
      - rec
      description: Dados criados ou alterados da solicitação da recorrência
      allOf:
      - $ref: '#/components/schemas/SolicRecBase'
      - $ref: '#/components/schemas/SolicRecId'
      - $ref: '#/components/schemas/SolicRecStatus'
      - $ref: '#/components/schemas/SolicRecAtualizacao'
      - type: object
        properties:
          recPayload:
            $ref: '#/components/schemas/RecPayload'
    DadosBancarios:
      type: object
      description: Contendo `conta`, `ìspbParticipante`, `agencia`  e `cpf` ou `cnpj` do pagador.
      required:
      - conta
      - ispbParticipante
      - cpf
      - cnpj
      properties:
        conta:
          type: string
          title: Conta do Usuário Pagador
          description: Número da conta do usuário pagador.
          maxLength: 20
        ispbParticipante:
          type: string
          title: ISPB do usuário pagador.
          description: ISPB do usuário pagador.
          pattern: \d{8}
        agencia:
          type: string
          title: Agência do Usuário Pagador
          description: Número da agência do usuário pagador.
          maxLength: 4
      oneOf:
      - type: object
        properties:
          cpf:
            $ref: '#/components/schemas/CPF'
      - type: object
        properties:
          cnpj:
            $ref: '#/components/schemas/CNPJ'
    CNPJ:
      type: string
      title: CNPJ
      pattern: \\d{14}
      description: CNPJ do usuário.
    RecBaseCalendario:
      type: object
      title: Informações sobre calendário da recorrência
      description: Contendo `dataInicial`, `dataFinal` e `periodicidade` da recorrência.
      required:
      - dataInicial
      - periodicidade
      properties:
        dataInicial:
          type: string
          format: date
          x-future-or-present: true
          title: Data estimada de primeiro pagamento.
          description: Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601. Data estimada de primeiro pagamento.
          example: '2023-04-01T00:00:00.000Z'
        dataFinal:
          type: string
          format: date
          x-future-or-present: true
          title: Data final da vigência.
          description: Campo opcional que deve ser preenchido para autorizações com vigência pré-definida, devendo ser compatível com os valores informados em tipoFrequencia e a dataInicialRecorrencia. Não deve ser preenchido para autorizações por tempo indeterminado. Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601.
          example: '2023-04-01T00:00:00.000Z'
        periodicidade:
          type: string
          title: Periodicidade das cobranças recorrentes.
          enum:
          - SEMANAL
          - MENSAL
          - TRIMESTRAL
          - SEMESTRAL
          - ANUAL
    SolicRecBase:
      type: object
      title: Solicitação de Recorrência Base
      required:
      - calendario
      - idRec
      - destinatario
      description: Dados criados ou alterados da cobrança recorrente via API Pix
      properties:
        idRec:
          $ref: '#/components/schemas/RecId'
        calendario:
          $ref: '#/components/schemas/SolicrecBaseCalendario'
        destinatario:
          $ref: '#/components/schemas/DadosBancarios'
    CPF:
      type: string
      title: CPF
      pattern: \\d{11}
      description: CPF do usuário.
    ChangeStatusSolicRec:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACEITA
          - REJEITADA
    SolicRecAtualizacao:
      type: object
      title: Histórico de Status da Solicitação de Recorrência
      required:
      - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status da Solicitação de Recorrência
          description: Contendo `status`e `data`
          items:
            type: object
            required:
            - status
            - data
            properties:
              status:
                type: string
                title: Status do registro da solicitação de recorrência
                description: 'Status da solicitação de recorrência:

                  - `CRIADA`: Solicitação criada, aguardando envio

                  - `ENVIADA`: Solicitação enviada ao pagador

                  - `RECEBIDA`: Solicitação recebida pelo pagador

                  - `REJEITADA`: Solicitação rejeitada pelo pagador

                  - `ACEITA`: Solicitação aceita pelo pagador

                  - `EXPIRADA`: Solicitação expirou sem resposta

                  - `CANCELADA`: Solicitação cancelada

                  '
                enum:
                - CRIADA
                - ENVIADA
                - RECEBIDA
                - REJEITADA
                - ACEITA
                - EXPIRADA
                - CANCELADA
              data:
                type: string
                format: date-time
                description: Data e hora do registro de status atualizado. Respeita RFC 3339.
    SolicRecSolicitada:
      type: object
      title: Solicitação de Recorrência
      description: Dados criados ou alterados da solicitação da recorrência
      allOf:
      - $ref: '#/components/schemas/SolicRecBase'
    SolicRecRevisada:
      type: object
      title: Solicitação de Recorrência
      description: Dados alterados da solicitação da recorrência
      required:
      - status
      properties:
        status:
          type: string
          title: Status do registro da solicitação de recorrência
          enum:
          - CANCELADA
    RecAtualizacao:
      type: object
      title: Histórico de atualização da recorrência.
      required:
      - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status
          description: Contendo `status`e `data`.
          items:
            type: object
            required:
            - status
            - data
            properties:
              status:
                type: string
                title: Status da recorrência
                description: 'Status da recorrência:

                  - `CRIADA`: Recorrência criada, aguardando aprovação do pagador

                  - `APROVADA`: Recorrência aprovada pelo pagador e ativa

                  - `REJEITADA`: Recorrência rejeitada pelo pagador

                  - `EXPIRADA`: Recorrência expirou sem aprovação

                  - `CANCELADA`: Recorrência cancelada pelo recebedor ou pagador

                  '
                enum:
                - CRIADA
                - APROVADA
                - REJEITADA
                - EXPIRADA
                - CANCELADA
              data:
                type: string
                format: date-time
                description: Data e hora do registro de status atualizado. Respeita RFC 3339.
    Violacao:
      type: object
      title: Violações
      properties:
        razao:
          type: string
          title: Descrição do erro
          description: Descrição do erro
          example: Valor da cobrança não pode ser 0.00
        propriedade:
          type: string
          title: Nome da propriedade
          description: Nome da propriedade
          example: cob.chave
        valor:
          type: string
          title: Valor da propriedade
          description: Valor da propriedade
          example: 61996671234
    RecId:
      type: string
      title: ID Recorrência
      description: "# Identificador da Recorrência\n\nRegra de formação:\n\n  - RAxxxxxxxxyyyyMMddzzzzzzzzzzz (29 caracteres; \"case sensitive\", isso\né, diferencia letras maiúsculas e minúsculas), sendo:\n  - \"R\":  fixo (1 caractere). \"R\" para a recorrência criada dentro do\nPix;\n  - \"A\": identificação da possibilidade de novas tentativas, sendo\npossíveis os valores \"R\" ou \"N\" (1 caractere). \"R\" caso a recorrência permita novas tentativas de pagamento pós vencimento, ou \"N\" caso não permita novas tentativas.\n  - \"xxxxxxxx\":  identificação do agente que presta serviço para o\nusuário recebedor que gerou o <Id>, podendo ser: o ISPB do participante direto, o ISPB do participante indireto ou os 8 primeiros dígitos do CNPJ do prestador de serviço de iniciação (8 caracteres numéricos [0-9]);\n  - \"yyyyMMdd\":  data (8 caracteres) de criação da recorrência;\n  - \"zzzzzzzzzzz\": sequencial criado pelo agente que gerou o <Id>\n(11 caracteres alfanuméricos [a-z|A-Z|0-9]). Deve ser único dentro de cada \"yyyyMMdd\".\nDessa forma, o ID da recorrência deve ser formado de acordo com um dos tipos a seguir:\n- \"RRxxxxxxxxyyyyMMddzzzzzzzzzzz\"; para recorrência criada dentro do Pix e que permite novas tentativas de pagamento pós vencimento; ou\n- \"RNxxxxxxxxyyyyMMddzzzzzzzzzzz\"; para recorrência criada dentro do Pix e que não permite novas tentativas de pagamento pós vencimento.\n"
      pattern: '[a-zA-Z0-9]{29}'
      minLength: 29
      maxLength: 29
      example: RR1234567820240115abcdefghijk
    SolicrecBaseCalendario:
      type: object
      title: Informações de calendário da solicitação da recorrência
      description: Contendo `dataExpiracaoSolicitacao` da solicitação de recorrência.
      required:
      - dataExpiracaoSolicitacao
      properties:
        dataExpiracaoSolicitacao:
          type: string
          format: date-time
          title: Data de expiração da solicitação
          description: Data de expiração da solicitação de recorrência. Respeita RFC 3339.
          example: '2023-04-01T00:00:00.000Z'
    RecPayload:
      type: object
      title: Payload da Recorrência
      required:
      - idRec
      - atualizacao
      - recebedor
      description: 'Atributos de Configuração de Recorrência:


        `vinculo`, `calendario`, `valor`, `idRec`, `recebedor`, `politicaRetentativa` e `atualizacao`'
      allOf:
      - $ref: '#/components/schemas/RecBase'
      - type: object
        properties:
          idRec:
            $ref: '#/components/schemas/RecId'
      - type: object
        properties:
          recebedor:
            type: object
            required:
            - nome
            - cnpj
            - ispbParticipante
            title: Recebedor
            description: Dados do recebedor `cnpj`, `nome` e `ispbParticipante`
            properties:
              cnpj:
                type: string
                title: CNPJ
                pattern: \d{14}
                description: CNPJ do usuário.
              nome:
                type: string
                title: Nome
                description: Nome do usuário.
                maxLength: 140
              ispbParticipante:
                type: string
                title: ISPB do usuário recebedor.
                description: ISPB do usuário recebedor.
                pattern: \d{8}
      - $ref: '#/components/schemas/RecConfiguracao'
      - $ref: '#/components/schemas/RecAtualizacao'
    RecConfiguracao:
      type: object
      title: Configuração da Recorrência
      required:
      - politicaRetentativa
      properties:
        politicaRetentativa:
          type: string
          title: Política de retentativa pós vencimento da recorrência
