openapi: 3.2.0
info:
  title: Banco Inter Webhook API
  version: ''
  description: 'Operations tagged Webhook across 6 of this provider''s published API definitions: swagger-banking-yaml.yaml, swagger-cobranca-bolepix-yaml.yaml, swagger-cobranca-yaml.yaml, banco-inter-banking-openapi.yml, banco-inter-cobranca-bolepix-openapi.yml, banco-inter-cobranca-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cdpj.partners.bancointer.com.br/banking/v2
  description: Servidor de Produção
- url: https://cdpj-sandbox.partners.uatinter.co/banking/v2
  description: Servidor de Sandbox
- url: https://cdpj.partners.bancointer.com.br/cobranca/v3
  description: Servidor de Produção
- url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
  description: Servidor de Sandbox
- url: https://cdpj.partners.bancointer.com.br/cobranca/v2
  description: Servidor de Produção
tags:
- name: Webhook
paths:
  /webhooks/{tipoWebhook}:
    put:
      summary: Criar webhook
      description: 'Método destinado a criar um webhook para receber notificações (callbacks). O tipo de notificação recebida depende do "tipo webhook" (sessão PATH PARAMS)

        selecionado no cadastro. Para cada tipo será necessário um cadastro em separado.


        Caso o servidor de webhook retorne erro de recebimento do callback, serão realizadas até 4 tentativas com intervalos de 5, 10, 30 e 60 minutos.


        * Escopo requerido: webhook-banking.write

        * 10 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        Validar webhook


        https://cdpj.partners.bancointer.com.br/banking/v2/webhooks/{tipoWebhook}


        https://cdpj-sandbox.partners.uatinter.co/banking/v2/webhooks/{tipoWebhook}'
      operationId: putWebhookBanking
      tags:
      - Webhook
      parameters:
      - $ref: '#/components/parameters/tipoWebhookPath'
      - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        $ref: '#/components/requestBodies/WebhookRequestBody'
      callbacks:
        pixPagamentoList:
          '{$request.body#/webhookUrl/pix-pagamento}':
            summary: Retorno de callbacks para o tipoWebhook pix-pagamento.
            post:
              parameters:
              - in: header
                name: x-conta-corrente
                schema:
                  type: string
                  pattern: ^[1-9][0-9]*$
                  example: '13525622'
                description: Conta corrente relacionada ao callback. Enviar apenas números(incluindo o dígito), e não enviar zeros a esquerda.
              requestBody:
                content:
                  application/json:
                    schema:
                      type: array
                      items:
                        $ref: '#/components/schemas/CallbackPixPagamentoModel'
                    examples:
                      CallbackPixPagamentoChave:
                        $ref: '#/components/examples/CallbackPixPagamentoChave'
                      CallbackPixPagamentoDadosBancarios:
                        $ref: '#/components/examples/CallbackPixPagamentoDadosBancarios'
              responses:
                '200':
                  description: Notificação recebida com sucesso
        pagamentoBoletoList:
          '{$request.body#/webhookUrl/boleto-pagamento}':
            summary: Retorno de callbacks para o tipoWebhook boleto-pagamento.
            post:
              parameters:
              - in: header
                name: x-conta-corrente
                schema:
                  type: string
                  pattern: ^[1-9][0-9]*$
                  example: '13525622'
                description: Conta corrente relacionada ao callback. Enviar apenas números(incluindo o dígito), e não enviar zeros a esquerda.
              requestBody:
                content:
                  application/json:
                    schema:
                      type: array
                      items:
                        $ref: '#/components/schemas/CallbackPagamentoBoletoModel'
                    examples:
                      CallbackPagamentoBoletoRealizado:
                        $ref: '#/components/examples/CallbackPagamentoBoletoRealizado'
                      CallbackPagamentoBoletoAgendado:
                        $ref: '#/components/examples/CallbackPagamentoBoletoAgendado'
                      CallbackPagamentoBoletoComErro:
                        $ref: '#/components/examples/CallbackPagamentoBoletoComErro'
                      CallbackPagamentoBoletoCancelado:
                        $ref: '#/components/examples/CallbackPagamentoBoletoCancelado'
              responses:
                '200':
                  description: Notificação recebida com sucesso
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/RequisicaoInvalidaIncluirWebhook'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    get:
      summary: Obter webhook cadastrado
      description: 'Obtém o webhook cadastrado, caso exista.


        * Escopo requerido: webhook-banking.read

        * 10 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/banking/v2/webhooks/{tipoWebhook}


        https://cdpj-sandbox.partners.uatinter.co/banking/v2/webhooks/{tipoWebhook}'
      tags:
      - Webhook
      operationId: getWebhookBanking
      parameters:
      - $ref: '#/components/parameters/tipoWebhookPath'
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '200':
          description: Objeto de retorno do webhoo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookModel'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    delete:
      summary: Excluir webhook
      description: 'Exclui o webhook.


        * Escopo requerido: webhook-banking.write

        * 10 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/banking/v2/webhooks/{tipoWebhook}


        https://cdpj-sandbox.partners.uatinter.co/banking/v2/webhooks/{tipoWebhook}'
      operationId: deleteWebhookBanking
      tags:
      - Webhook
      parameters:
      - $ref: '#/components/parameters/tipoWebhookPath'
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '204':
          description: Sucesso
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/banking/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/banking/v2
      description: Servidor de Sandbox
  /webhooks/{tipoWebhook}/callbacks:
    get:
      summary: Consultar callbacks
      description: 'Retorna as requisições de callbacks ordenadas pela data de disparo (decrescente).

        Permite consultar erros no envio de callbacks.


        * Escopo requerido: webhook-banking.read

        * 10 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/banking/v2/webhooks/{tipoWebhook}/callbacks


        https://cdpj-sandbox.partners.uatinter.co/banking/v2/webhooks/{tipoWebhook}/callbacks'
      tags:
      - Webhook
      operationId: callbacksFilter
      parameters:
      - $ref: '#/components/parameters/tipoWebhookPath'
      - $ref: '#/components/parameters/xContaCorrente'
      - name: dataHoraInicio
        in: query
        required: true
        description: 'Formato aceito: yyyy-MM-dd''T''HH:mm[:ss][.SSS]XXX'
        example: 2023-06-01T00:00Z ou 2023-06-01T00:00:00.000Z
        x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm[:ss][.SSS]XXX
        schema:
          type: string
          format: date-time
      - name: dataHoraFim
        description: 'Formato aceito: yyyy-MM-dd''T''HH:mm[:ss][.SSS]XXX'
        in: query
        example: 2023-06-01T00:00Z ou 2023-06-01T00:00:00.000Z
        required: true
        x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm[:ss][.SSS]XXX
        schema:
          type: string
          format: date-time
      - name: pagina
        in: query
        schema:
          type: integer
          description: Posição da página na lista de dados
          default: 0
      - name: tamanhoPagina
        in: query
        schema:
          type: integer
          description: Tamanho da página
          default: 20
          maximum: 50
          minimum: 10
      - name: endToEnd
        in: query
        schema:
          type: string
          description: EndToEnd do callback, caso queira filtrar as notificações de algum Pix Pagamento específico. **Exclusivo para o PATH PARAMETERS pix-pagamento**.
      - name: codigoTransacao
        in: query
        schema:
          type: string
          description: CodigoTransacao do callback, caso queira filtrar as notificações de algum Pagamento Boleto específico. **Exclusivo para o PATH PARAMETERS boleto-pagamento**.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAttemptPage'
        '400':
          $ref: '#/components/responses/RequisicaoInvalidaConsultarCallback'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/banking/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/banking/v2
      description: Servidor de Sandbox
  /webhooks/{tipoWebhook}/callbacks/retry:
    post:
      tags:
      - Webhook
      summary: Reenviar callbacks
      description: 'Método utilizado para reenviar uma mensagem de callback de um pagamento de boleto ou pagamento pix, através de seu código identificador:

        * boleto-pagamento - codigoTransacao

        * pix-pagamento - codigoSolicitacao


        A funcionalidade permite o envio de até 50 codigos identificadores, por tipo de webhook, para o reenvio de seus respectivos callbacks.


        * Escopo requerido: webhook-banking.write

        * rate limit:


        * 5 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/banking/v2/webhooks/{tipoWebhook}/callbacks/retry'
      operationId: retryCallback
      servers:
      - url: https://cdpj.partners.bancointer.com.br/banking/v2
        description: Servidor de Produção
      parameters:
      - $ref: '#/components/parameters/tipoWebhookPath'
      - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        $ref: '#/components/requestBodies/RetryCallbacksRequest'
      responses:
        '200':
          description: Sucesso
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/RetryCallbackResponse'
              examples:
                exemplo1:
                  $ref: '#/components/examples/ExemploRetryCallbackResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalidaRetryCallback'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/banking/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/banking/v2
      description: Servidor de Sandbox
  /cobrancas/webhook:
    put:
      tags:
      - Webhook
      description: 'Método destinado a criar um webhook para receber notificações (callbacks) de cobranças pagas, canceladas e expiradas.


        Caso o servidor de webhook retorne erro de recebimento do callback, serão realizadas até 4 tentativas com intervalos de 20, 30, 60 e 120 minutos.


        * Escopo requerido: boleto-cobranca.write

        * rate limit:


        * 5 chamadas por minuto


        * 5 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        Validar webhook


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/webhook


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/webhook'
      summary: Criar ou editar um webhook
      operationId: webhookPut
      requestBody:
        $ref: '#/components/requestBodies/WebhookConfigBody'
      parameters:
      - $ref: '#/components/parameters/xContaCorrente_2'
      responses:
        '204':
          description: Sucesso
          content: {}
        '500':
          $ref: '#/components/responses/ServicoIndisponivel_2'
      callbacks:
        listaCobrancas:
          '{$request.body#/webhookUrl}':
            post:
              parameters:
              - in: header
                name: x-conta-corrente
                schema:
                  type: string
                  pattern: ^[1-9][0-9]*$
                  example: '13525622'
                description: Conta corrente relacionada ao callback. Enviar apenas números(incluindo o dígito), e não enviar zeros a esquerda.
              requestBody:
                $ref: '#/components/requestBodies/WebhookCobrancaCallbackBody'
              responses:
                '200':
                  description: Notificação recebida com sucesso
    get:
      tags:
      - Webhook
      description: 'Obtém o webhook cadastrado, caso exista.


        * Escopo requerido: boleto-cobranca.read

        * rate limit:


        * 5 chamadas por minuto


        * 5 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/webhook


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/webhook'
      summary: Obter webhook cadastrado
      operationId: webhookGet
      parameters:
      - $ref: '#/components/parameters/xContaCorrente_2'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCompleto'
        '404':
          $ref: '#/components/responses/NaoEncontrado_2'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel_2'
    delete:
      tags:
      - Webhook
      description: 'Exclui o webhook.


        * Escopo requerido: boleto-cobranca.write

        * rate limit:


        * 5 chamadas por minuto


        * 5 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/webhook


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/webhook'
      summary: Excluir webhook
      operationId: webhookDelete
      parameters:
      - $ref: '#/components/parameters/xContaCorrente_2'
      responses:
        '204':
          description: Sucesso
          content: {}
        '404':
          $ref: '#/components/responses/NaoEncontrado_2'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel_2'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
  /cobrancas/webhook/callbacks:
    get:
      tags:
      - Webhook
      summary: Consulta de callbacks enviados
      description: 'Retorna as requisições de callbacks ordenado pela data de disparo (decrescente)


        * Escopo requerido: boleto-cobranca.read

        * rate limit:


        * 10 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/webhook/callbacks


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/webhook/callbacks'
      operationId: getCobrancasWebhookCallbacks
      parameters:
      - $ref: '#/components/parameters/xContaCorrente_2'
      - name: dataHoraInicio
        in: query
        required: true
        description: 'Formato aceito: yyyy-MM-dd''T''HH:mm[:ss][.SSS]XXX'
        example: 2023-06-01T00:00Z ou 2023-06-01T00:00:00.000Z
        x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm[:ss][.SSS]XXX
        schema:
          type: string
          format: date-time
      - name: dataHoraFim
        description: 'Formato aceito: yyyy-MM-dd''T''HH:mm[:ss][.SSS]XXX'
        in: query
        example: 2023-06-01T00:00Z ou 2023-06-01T00:00:00.000Z
        required: true
        x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm[:ss][.SSS]XXX
        schema:
          type: string
          format: date-time
      - name: pagina
        in: query
        schema:
          type: integer
          description: Posição da página na lista de dados
          default: 0
      - name: tamanhoPagina
        in: query
        schema:
          type: integer
          description: Tamanho da página
          default: 20
          maximum: 50
          minimum: 10
      - name: codigoSolicitacao
        in: query
        schema:
          type: string
          format: uuid
          description: Codigo único da cobrança
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAttemptPage_2'
              examples:
                exemplo1:
                  $ref: '#/components/examples/exemploListaCallback'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel_2'
      x-operation-id-source: normalized
      x-operation-id-original: callbacksFilter
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
  /webhook/callbacks/retry:
    post:
      tags:
      - Webhook
      summary: Reenviar callbacks
      description: 'Método utilizado para reenviar uma mensagem de callback de uma cobrança através de seu código identificador(codigoSolicitacao).


        A funcionalidade permite o envio de até 50 codigos identificadores, para o reenvio de seus respectivos callbacks.


        * Escopo requerido: boleto-cobranca.write

        * rate limit:


        * 5 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/webhook/callbacks/retry'
      operationId: postWebhookCallbacksRetry
      servers:
      - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
        description: Servidor de Produção
      parameters:
      - $ref: '#/components/parameters/xContaCorrente_2'
      requestBody:
        $ref: '#/components/requestBodies/RetryCallbacksRequest'
      responses:
        '200':
          description: Sucesso
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/RetryCallbackResponse_2'
              examples:
                exemplo1:
                  $ref: '#/components/examples/exemploRetryCallbackResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalidaRetryCallback'
        '403':
          $ref: '#/components/responses/AcessoNegado_2'
        '404':
          $ref: '#/components/responses/NaoEncontrado_2'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel_2'
      x-operation-id-source: normalized
      x-operation-id-original: retryCallback
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
  /boletos/webhook:
    put:
      summary: Criar webhook
      description: 'Método destinado a criar um webhook para receber notificações (callbacks) de boletos pagos, cancelados e expirados.


        Caso o servidor de webhook retorne erro de recebimento do callback, serão realizadas até 4 tentativas com intervalos de 20, 30, 60 e 120 minutos.


        * Escopo requerido: boleto-cobranca.write

        * rate limit: 10 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v2/boletos/webhook'
      tags:
      - Webhook
      operationId: putBoletosWebhook
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        $ref: '#/components/requestBodies/WebhookConfigBody_2'
      responses:
        '204':
          description: Sucesso
          content: {}
      callbacks:
        listaBoletoCobranca:
          '{$request.body#/webhookUrl/boleto}':
            post:
              parameters:
              - in: header
                name: x-conta-corrente
                schema:
                  type: string
                  pattern: ^[1-9][0-9]*$
                  example: '13525622'
                description: Conta corrente relacionada ao callback. Enviar apenas números(incluindo o dígito), e não enviar zeros a esquerda.
              requestBody:
                $ref: '#/components/requestBodies/WebhookBoletoBody'
              responses:
                '200':
                  description: Notificação recebida com sucesso
      x-operation-id-source: normalized
      x-operation-id-original: webhookPut
    get:
      summary: Obter webhook cadastrado
      description: 'Obtém o webhook cadastrado, caso exista.


        * Escopo requerido: boleto-cobranca.read

        * rate limit: 10 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v2/boletos/webhook'
      tags:
      - Webhook
      operationId: getBoletosWebhook
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCompleto_2'
      x-operation-id-source: normalized
      x-operation-id-original: webhookGet
    delete:
      summary: Excluir webhook
      description: 'Exclui o webhook.


        * Escopo requerido: boleto-cobranca.write

        * rate limit: 10 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v2/boletos/webhook'
      tags:
      - Webhook
      operationId: deleteBoletosWebhook
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '204':
          description: Sucesso
          content: {}
      x-operation-id-source: normalized
      x-operation-id-original: webhookDelete
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v2
      description: Servidor de Produção
  /boletos/webhook/callbacks:
    get:
      summary: Consultar callbacks
      description: 'Retorna as requisições de callbacks ordenadas pela data de disparo (decrescente).

        Permite consultar erros no envio de callbacks.


        * Escopo requerido: boleto-cobranca.read

        * rate limit: 10 chamadas por minuto


        Exemplos de código


