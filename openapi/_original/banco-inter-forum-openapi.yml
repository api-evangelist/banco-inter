components:
  parameters:
    id:
      name: id
      in: header
      required: true
      description: ID da publicação
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      description: Número da página
      schema:
        type: integer
        default: 0
    size:
      name: size
      in: query
      required: false
      description: Número de itens por página
      schema:
        type: integer
        default: 100
    searchKey:
      name: searchKey
      in: query
      required: false
      description: Chave de busca
      schema:
        type: string
    startDate:
      name: startDate
      description: Data de início
      in: query
      required: false
      schema:
        type: string
        format: date
        example: '2025-01-01'
    endDate:
      name: endDate
      in: query
      description: Data de fim
      required: false
      schema:
        type: string
        format: date
        example: '2025-01-02'
    types:
      name: types
      in: query
      required: false
      description: 'Tipos de publicações. Default: POST, POLL'
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PostType'
  schemas:
    ErrorResponse:
      type: object
      properties:
        alias:
          type: string
        message:
          type: string
    ProblemResponse:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
          description: Descrição resumida do problema
          example: Not found
        detail:
          type: string
          description: Descrição completa do problema
        timestamp:
          type: string
          format: date-time
        violacoes:
          type: array
          items:
            $ref: '#/components/schemas/Violacao'
    Violacao:
      type: object
      properties:
        propriedade:
          type: string
          description: Nome da propriedade
        razao:
          type: string
          description: Descrição do erro
        valor:
          type: string
          description: Valor da propriedade
    PublicationRequestBody:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PostType'
        text:
          type: string
          description: Conteúdo da publicação
        mediasInformation:
          $ref: '#/components/schemas/MediasInformationUpdate'
        mediaFiles:
          type: array
          items:
            $ref: '#/components/schemas/MediaFile'
          description: Arquivos de mídia para adicionar na publicação
        poll:
          $ref: '#/components/schemas/PollRequestBody'
        createdAt:
          type: string
          format: date-time
          description: >-
            Data e hora da publicação (Aceita datas futuras para criar
            publicações agendadas)
    UpdatePublicationRequestBody:
      type: object
      properties:
        text:
          type: string
          description: Conteúdo da publicação
        mediasInformation:
          $ref: '#/components/schemas/MediasInformationUpdate'
        mediaFiles:
          type: array
          items:
            $ref: '#/components/schemas/MediaFile'
          description: Arquivos para adicionar na publicação
    PublicationResponse:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PostType'
        id:
          type: string
          description: ID da publicação
        text:
          type: string
          description: Conteúdo da publicação
        mediasInformation:
          $ref: '#/components/schemas/MediasInformationUpdate'
        card:
          $ref: '#/components/schemas/CardInfo'
        poll:
          $ref: '#/components/schemas/PollResponse'
        likes:
          type: integer
          format: int64
          default: 0
          description: Quantidade de curtidas
        comments:
          type: integer
          format: int64
          default: 0
          description: Quantidade de comentários
        reposts:
          type: integer
          format: int64
          default: 0
          description: Quantidade de reposts
        quotes:
          type: integer
          format: int64
          default: 0
          description: Quantidade de citações
        answers:
          type: integer
          format: int64
          default: 0
          description: Quantidade de respostas
        createdAt:
          type: string
          format: date-time
          description: Data e hora da publicação
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última atualização
    PostType:
      type: string
      enum:
        - POST
        - POLL
      default: POST
      description: Tipo da publicação
    PublicationPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PublicationResponse'
          description: Lista de publicações
        totalPages:
          type: integer
          format: int32
          description: Total de páginas
        totalElements:
          type: integer
          format: int32
          description: Total de itens
      required:
        - content
        - totalPages
        - totalElements
    PollRequestBody:
      type: object
      description: Enquete
      properties:
        durationInDays:
          $ref: '#/components/schemas/DurationPoll'
        multipleChoice:
          type: boolean
          description: Se a enquete permite múltiplas escolhas
        options:
          type: array
          description: As opções da enquete
          items:
            type: string
          minItems: 2
    DurationPoll:
      type: string
      description: Duração da enquete em dias
      enum:
        - ONE_DAY
        - TWO_DAYS
        - THREE_DAYS
        - FOUR_DAYS
        - FIVE_DAYS
    PollResponse:
      type: object
      description: Enquete
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Data e hora da expiração da enquete
        multipleChoice:
          type: boolean
          description: Se a enquete permite múltiplas escolhas
        optionsPoll:
          type: array
          items:
            $ref: '#/components/schemas/OptionPoll'
          description: As opções da enquete
    OptionPoll:
      type: object
      description: Opção da enquete
      properties:
        label:
          type: string
          description: A label da opção
        totalAnswer:
          type: integer
          description: O total de votos para esta opção
    MediaFormat:
      type: string
      enum:
        - PORTRAIT
        - LANDSCAPE
        - SQUARE
      description: Formato da mídia
    MediasInformation:
      type: object
      description: Arquivos de mídia
      properties:
        images:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/MediaInformation'
        videos:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/MediaInformation'
        documents:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/MediaInformation'
    MediaInformation:
      type: object
      description: Arquivo de mídia
      properties:
        url:
          type: string
        tags:
          type: array
          items:
            type: string
        format:
          $ref: '#/components/schemas/MediaFormat'
    MediasInformationUpdate:
      type: object
      description: Arquivos de mídia para manter na publicação
      properties:
        images:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/MediaInformationUpdate'
          description: Imagens para manter na publicação
        videos:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/MediaInformationUpdate'
          description: Vídeos para manter na publicação
        documents:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/MediaInformationUpdate'
          description: Documentos para manter na publicação
    MediaInformationUpdate:
      type: object
      description: Arquivo de mídia para atualizar na publicação
      properties:
        url:
          type: string
          description: A url do arquivo
        position:
          type: integer
          description: A posição do arquivo na publicação
          default: 0
    MediaFile:
      type: object
      description: Arquivo de mídia para adicionar na publicação
      properties:
        file:
          type: string
          format: byte
          description: Imagem, vídeo ou documento
        extension:
          $ref: '#/components/schemas/FileExtension'
        position:
          type: integer
          description: A posição do arquivo na publicação
          default: 0
    FileExtension:
      type: string
      enum:
        - PNG
        - JPG
        - MOV
        - MP4
        - QUICKTIME
        - PDF
      description: Extensão do arquivo
    GenerateUploadUrlRequest:
      type: object
      required:
        - contentType
      properties:
        contentType:
          type: string
          example: image/jpeg
          description: >-
            MIME type of the file to be uploaded. Allowed types: image/jpeg,
            image/png, video/mp4, video/quicktime, application/pdf.
    GenerateUploadUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          description: URL pré-assinada para upload do arquivo
          example: >-
            https://s3.amazonaws.com/bucket?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=EXAMPLEACCESSKEY%2F20251218%2Fuse-east-1%2Fs3%2Faws4_request&X-Amz-Date=20251218T120000Z&X-Amz-Expires=900&X-Amz-SignedHeaders=host&X-Amz-Signature=12345567899
        publicationUrl:
          type: string
          description: URL para ser usada na criação da publicação após o upload
          example: https://s3.amazonaws.com/bucket
    CardInfo:
      type: object
      description: Card Genérico
      nullable: true
      properties:
        type:
          $ref: '#/components/schemas/CardTypeInfo'
        header:
          $ref: '#/components/schemas/CardHeaderInfo'
        body:
          $ref: '#/components/schemas/CardBodyInfo'
        footer:
          $ref: '#/components/schemas/CardFooterInfo'
        action:
          $ref: '#/components/schemas/CardButtonActionInfo'
        metadata:
          type: object
          additionalProperties:
            type: object
    CardTypeInfo:
      type: string
      enum:
        - ASSET
        - SHOPPING
        - GENERIC
        - BASIC
      description: Tipo de card
    CardHeaderInfo:
      type: object
      description: Cabeçalho do card
      properties:
        tag:
          $ref: '#/components/schemas/CardTagInfo'
        title:
          type: string
    CardBodyInfo:
      type: object
      description: Corpo do card
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/CardTagInfo'
        title:
          type: string
        text:
          type: string
        price:
          type: string
        oldPrice:
          type: string
        installment:
          type: string
        cashback:
          type: string
        images:
          type: array
          items:
            type: string
        button:
          $ref: '#/components/schemas/CardButtonInfo'
        grid:
          type: array
          items:
            $ref: '#/components/schemas/CardGridCellInfo'
        table:
          type: array
          items:
            $ref: '#/components/schemas/CardTableCellInfo'
        chart:
          $ref: '#/components/schemas/CardChartInfo'
    CardFooterInfo:
      type: object
      description: Rodapé do card
      properties:
        text:
          type: string
    CardChartInfo:
      type: object
      description: Gráfico do card
      properties:
        description:
          type: string
        variations:
          type: array
          items:
            $ref: '#/components/schemas/CardChartVariationInfo'
        lineColor:
          type: string
        labelCount:
          type: integer
        forceLabelCount:
          type: boolean
        typeOfCurrency:
          type: string
    CardChartVariationInfo:
      type: object
      description: Variação do gráfico
      properties:
        value:
          type: number
          format: double
        label:
          type: string
    CardTagInfo:
      type: object
      description: Tag do card
      properties:
        title:
          type: string
        textColor:
          type: string
          description: Código hexadecimal da cor do texto
        backgroundColor:
          type: string
          description: Código hexadecimal da cor do fundo
    CardGridCellInfo:
      type: object
      description: Célula do grid do card
      properties:
        title:
          type: string
        text:
          type: string
        textColor:
          type: string
          description: Código hexadecimal da cor do texto
        icon:
          $ref: '#/components/schemas/CardIconInfo'
    CardButtonInfo:
      type: object
      description: Botão do card
      properties:
        title:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        isEnable:
          type: boolean
          default: true
        icon:
          $ref: '#/components/schemas/CardIconInfo'
        action:
          $ref: '#/components/schemas/CardButtonActionInfo'
    CardButtonActionInfo:
      type: object
      description: Ação do botão do card
      properties:
        route:
          type: string
        value:
          type: string
    CardIconInfo:
      type: object
      description: Ícone do card
      properties:
        value:
          type: string
    CardTableCellAlignInfo:
      description: Alinhamento da célula da tabela do card
      type: string
      enum:
        - LEFT
        - RIGHT
    CardTableCellInfo:
      type: object
      description: Célula da tabela do card
      properties:
        align:
          $ref: '#/components/schemas/CardTableCellAlignInfo'
        title:
          type: string
        icon:
          $ref: '#/components/schemas/CardIconInfo'
        text:
          type: string
        textColor:
          type: string
          description: Código hexadecimal da cor do texto
    Style:
      type: string
      description: Estilo do botão do card
      enum:
        - PRIMARY
        - SECONDARY
        - GHOST
