info:
  title: API Forum (Gerenciamento de publicações no Forum)
  version: ''
  description: |

    # Pré-requisitos

      Para utilizar as APIs do Forum em **ambiente de produção**, os seguintes pré-requisitos devem ser atendidos:

      **1. Criação de perfil de usuário:**
      - O perfil é criado automaticamente no primeiro acesso ao Forum pelo SuperApp.
      - O Forum pode ser encontrado no widget dedicado ou pela barra de navegação na página inicial do SuperApp, conforme exemplo abaixo.

      **2. Aceite dos termos de uso e condições do Forum:**
      - Os termos de uso e condições do Forum são apresentados ao interagir com qualquer funcionalidade do Forum no SuperApp.
      - O aceite é obrigatório para habilitação completa dos recursos das APIs e precisa ser realizado apenas uma vez por usuário.
      - Após a leitura dos termos de uso e condições, basta selecionar o checkbox e clicar em "Continuar" para finalizar o processo, conforme exemplo abaixo.

      <div style="display: flex; justify-content: center; gap: 5%; margin: 2em 0; flex-wrap: wrap;">
        <img src="/media/acessar_forum.png" alt="Acessar o Forum pelo SuperApp" style="width: 40%; height: auto;">
        <img src="/media/termos_uso_forum.jpg" alt="Tela de termos de uso do Forum" style="width: 40%; height: auto;">
      </div>

    ---
    # Informações gerais

      A API Forum é a solução que permite o gerenciamento de publicações no Forum do Inter.
      Os tipos de publicações aceitos são: POST e POLL.
      * **POST**: Publicação simples
      * **POLL**: Enquete

      O tipo de uma publicação não pode ser alterado após a criação.

      **Recursos disponíveis nas publicações:**

      * **Menções**: Para mencionar usuários, utilize o formato `@username` no texto da publicação.
      * **Hashtags**: Para mencionar hashtags, utilize o formato `#hashtag` no texto da publicação.
      * **Ativos financeiros**: Para referenciar ativos, use o formato `$ticker` no texto e um card informativo será gerado automaticamente.
      * **Produtos do shopping do Inter**: Para postar um produto do shopping do Inter, adicione o link do produto no texto da publicação e o card será gerado automaticamente.
      * **Arquivos de mídia**: Apenas publicações do tipo POST podem conter mídia. Atualmente, há suporte para imagens, vídeos e documentos pdf. Há duas formas de postar arquivos de mídia, que serão melhor explicadas na seção [Upload de arquivos de mídia](#upload-de-arquivos-de-mídia).
      * **Enquetes**: Para criar enquetes, informe o tipo POLL e as opções da enquete.

      As interações que as publicações podem receber de outros usuários são: curtidas (likes), comentários (comments), repost sem texto (reposts), repost com texto ou citação (quotes) e respostas de enquete (answers).

    ---
    # Upload de arquivos de mídia

      Para adicionar arquivos de mídia em publicações do tipo POST, existem duas formas de realizar o upload: através de **URLs** ou via **binário (base64)**.

      **Regras gerais para upload de mídia:**
      * Máximo de **4 arquivos** por publicação
      * Apenas **um tipo de arquivo** por publicação (somente imagens **OU** vídeos **OU** documentos)
      * Os tipos de arquivos aceitos são: imagens (PNG, JPG), vídeos (MOV, MP4, QUICKTIME) e documentos (PDF)
      * Imagens: até 20 MB por arquivo
      * Vídeos e documentos: até 2.000 MB por arquivo

      ## Upload via URLs

      Este método é o mais recomendado por permitir maior controle sobre o processo de upload. O processo é realizado em três etapas:

      1. **Gerar URL de upload**: Para cada arquivo que deseja enviar, faça uma requisição ao endpoint `/media/upload-url` informando o tipo MIME (`image/jpeg`, `image/png`, `video/mp4`, `video/quicktime`, `application/pdf`).

         A API retornará:
         * `uploadUrl` - URL temporária e exclusiva para upload do arquivo
         * `publicationUrl` - mesma url, porém no formato esperado na criação/edição de publicação

         **Observações:** A URL é válida por tempo limitado (usar imediatamente) e cada URL serve para apenas um arquivo. Para múltiplos arquivos, gere uma URL para cada um.

      2. **Fazer upload do arquivo**: Faça uma requisição **PUT** diretamente para a `uploadUrl` retornada no passo anterior, enviando o arquivo no corpo da requisição.

      3. **Criar publicação com mídia**: Após o upload bem-sucedido, utilize a `publicationUrl` no campo `mediasInformation` ao criar ou editar uma publicação.

      ## Upload via Binário (Base64)

      Este método permite enviar os arquivos diretamente no corpo da requisição de criação da publicação, codificados em base64. É ideal para arquivos menores e quando você deseja realizar tudo em uma única requisição.

      **Como utilizar:**
      - Encode o arquivo em base64
      - Inclua o arquivo codificado no campo `mediaFiles` do corpo da requisição
      - Informe a extensão do arquivo no campo `extension`
      - Opcionalmente, defina a posição do arquivo na publicação através do campo `position`

      **Limitações:**
      - Tamanho máximo do arquivo pode ser limitado pelo tamanho da requisição HTTP
      - Pode ter impacto na performance para arquivos grandes

