  schemas:
    BoletosPageResponse:
      type: object
      title: Boletos Consultados
      required:
        - content
      properties:
        totalPages:
          $ref: '#/components/schemas/totalPages'
        totalElements:
          $ref: '#/components/schemas/totalElements'
        last:
          $ref: '#/components/schemas/last'
        first:
          $ref: '#/components/schemas/first'
        size:
          $ref: '#/components/schemas/size'
        numberOfElements:
          $ref: '#/components/schemas/numberOfElements'
        content:
          type: array
          title: Lista de Boletos consultados
          items:
            $ref: '#/components/schemas/boletoResponse'
    totalPages:
      type: integer
      title: Quantidade total de páginas
      description: Quantidade total de páginas disponíveis para consulta.
      minimum: 1
      example: 1
    totalElements:
      type: integer
      format: int32
      title: Quantidade total de itens
      description: >-
        Quantidade total de itens disponíveis de acordo com os parâmetros
        informados.
      minimum: 0
    last:
      type: boolean
      description: Última página
      example: true
    first:
      type: boolean
      description: Primeira página
      example: true
    size:
      type: integer
      title: Quantidade de itens por página
      description: Quantidade de registros por página, configurado na requisição.
      minimum: 1
      example: 20
    numberOfElements:
      type: integer
      title: Quantidade de itens na página atual
      description: Quantidade de registros retornado na página atual.
      minimum: 1
    descontoResponse:
      properties:
        codigo:
          type: string
        data:
          type: string
        taxa:
          type: number
        valor:
          type: number
    multaResponse:
      properties:
        codigo:
          type: string
        data:
          type: string
        taxa:
          type: number
        valor:
          type: number
    moraResponse:
      properties:
        codigo:
          type: string
        data:
          type: string
        taxa:
          type: number
        valor:
          type: number
    beneficiarioFinal:
      required:
        - nome
        - cpfCnpj
        - tipoPessoa
        - cep
        - endereco
        - bairro
        - cidade
        - uf
      type: object
      properties:
        nome:
          type: string
          description: Nome do beneficiário final
          maxLength: 100
        cpfCnpj:
          type: string
          description: |
            CPF/CNPJ do beneficiário final do título
            CNPJ: NNNNNNNNNFFFFCC
            CPF : 0000NNNNNNNNNCC,
            onde
            __NNNNNNNNN__ é a raiz do CNPJ/CPF
            __FFFF__ = filial do CNPJ
            __CC__ = dígitos de controle
        tipoPessoa:
          type: string
          description: |
            Tipo do beneficiário final:
            * FISICA - Pessoa Física
            * JURIDICA - Pessoa Jurídica
        cep:
          type: string
          description: CEP do beneficiário final
          example: '30110000'
        endereco:
          type: string
          description: Endereço (logradouro) do beneficiário final
          maxLength: 100
          example: Avenida Brasil
        bairro:
          type: string
          description: Bairro do beneficiário final
          example: Centro
          maxLength: 60
          default: ''
        cidade:
          type: string
          description: Cidade do beneficiário final
          maxLength: 60
          example: Belo Horizonte
        uf:
          $ref: '#/components/schemas/enumUF'
    incluiBoletoRequest:
      type: object
      required:
        - seuNumero
        - dataVencimento
        - valorNominal
        - pagador
        - numDiasAgenda
      properties:
        seuNumero:
          type: string
          description: Campo Seu Número do título
          example: '123456'
          maxLength: 15
        valorNominal:
          type: number
          description: |
            Valor Nominal do título

            O valor nominal deve ser maior ou igual à R$2.50
          minimum: 2.5
          maximum: 99999999.99
        dataVencimento:
          type: string
          description: |
            Data de vencimento do título

            Formato aceito: YYYY-MM-DD
          example: '2018-07-27'
        numDiasAgenda:
          type: integer
          description: >-
            Número de dias corridos após o vencimento para o cancelamento
            efetivo automático do boleto. (de 0 até 60)
        pagador:
          $ref: '#/components/schemas/pagador'
        mensagem:
          $ref: '#/components/schemas/mensagem'
        desconto1:
          $ref: '#/components/schemas/desconto'
        desconto2:
          $ref: '#/components/schemas/desconto'
        desconto3:
          $ref: '#/components/schemas/desconto'
        multa:
          $ref: '#/components/schemas/multa'
        mora:
          $ref: '#/components/schemas/mora'
        beneficiarioFinal:
          $ref: '#/components/schemas/beneficiarioFinal'
      xml:
        name: Boleto
    incluiBoletoResponse:
      type: object
      properties:
        seuNumero:
          type: string
          description: Seu Número, enviado na requisição para inclusão do título.
          maxLength: 11
        nossoNumero:
          type: string
          description: >-
            Nosso Número, atribuído automaticamente pelo banco na emissão do
            título.
          maxLength: 11
        codigoBarras:
          type: string
          description: >-
            Representação numérica do código de barras do título emitido. (44
            dígitos)
          maxLength: 44
        linhaDigitavel:
          type: string
          description: >-
            Contém os mesmos dados do código de barras dispostos em ordem
            diferente e acrescido de dígitos verificadores. (47 dígitos)
          maxLength: 47
    pagador:
      type: object
      required:
        - cpfCnpj
        - nome
        - tipoPessoa
        - cep
        - endereco
        - cidade
        - uf
      properties:
        cpfCnpj:
          type: string
          description: |
            CPF/CNPJ do pagador do título

            CNPJ: NNNNNNNNNFFFFCC

            CPF : 0000NNNNNNNNNCC,

            onde

            __NNNNNNNNN__ é a raiz do CNPJ/CPF

            __FFFF__ = filial do CNPJ

            __CC__ = dígitos de controle
          minLength: 11
          maxLength: 14
        tipoPessoa:
          type: string
          description: |
            Tipo do pagador:
            * `FISICA` - Pessoa Física
            * `JURIDICA` - Pessoa Jurídica
        nome:
          type: string
          description: Nome do pagador
          maxLength: 100
          minLength: 1
        endereco:
          type: string
          description: Endereço do pagador
          maxLength: 100
          minLength: 1
          example: Avenida Brasil
        numero:
          type: string
          description: Número no logradouro do pagador
          maxLength: 10
          example: '3456'
          default: ''
        complemento:
          type: string
          description: Complemento do endereço do pagador
          maxLength: 30
          example: apartamento 3 bloco 4
          default: ''
        bairro:
          type: string
          description: Bairro do pagador
          maxLength: 60
          example: Centro
          default: ''
        cidade:
          type: string
          description: Cidade do pagador
          maxLength: 60
          minLength: 1
          example: Belo Horizonte
        uf:
          type: string
          description: UF do pagador
          minLength: 2
          maxLength: 2
          example: MG
        cep:
          type: string
          description: CEP do pagador
          minLength: 8
          maxLength: 8
          example: '30110000'
        email:
          type: string
          default: ''
          description: E-mail do pagador
          maxLength: 50
        ddd:
          type: string
          default: ''
          description: DDD do telefone do pagador
          maxLength: 2
          example: '31'
        telefone:
          type: string
          default: ''
          description: Telefone do pagador
          maxLength: 9
    enumUF:
      type: string
      enum:
        - AC
        - AL
        - AP
        - AM
        - BA
        - CE
        - DF
        - ES
        - GO
        - MA
        - MT
        - MS
        - MG
        - PA
        - PB
        - PR
        - PE
        - PI
        - RJ
        - RN
        - RS
        - RO
        - RR
        - SC
        - SP
        - SE
        - TO
      description: UF
      example: MG
    mensagem:
      properties:
        linha1:
          type: string
          description: Linha 1 do campo de texto do título
          maxLength: 78
        linha2:
          type: string
          description: Linha 2 do campo de texto do título
          maxLength: 78
        linha3:
          type: string
          description: Linha 3 do campo de texto do título
          maxLength: 78
        linha4:
          type: string
          description: Linha 4 do campo de texto do título
          maxLength: 78
        linha5:
          type: string
          description: Linha 5 do campo de texto do título
          maxLength: 78
    desconto:
      required:
        - codigoDesconto
        - valor
        - taxa
      properties:
        codigoDesconto:
          type: string
          description: |
            Código de Desconto do título.
            * `NAOTEMDESCONTO` - Não tem desconto.
            * `VALORFIXODATAINFORMADA` - Valor fixo até a data informada.
            * `PERCENTUALDATAINFORMADA` - Percentual até a data informada.
        data:
          type: string
          description: >
            Data de Desconto do título.


            Obrigatório para códigos de desconto VALORFIXODATAINFORMADA e
            PERCENTUALDATAINFORMADA. Não informar para os

            demais.


            Formato aceito: YYYY-MM-DD
          example: '2018-07-27'
        taxa:
          type: number
          description: |
            Taxa Percentual de Desconto do título.

            Obrigatório para o código de desconto PERCENTUALDATAINFORMADA.
            Para os demais informar 0.
        valor:
          type: number
          description: |
            Valor de Desconto, expresso na moeda do título.

            Obrigatório para o código de desconto VALORFIXODATAINFORMADA.
            Para os demais informar 0.
    multa:
      required:
        - codigoMulta
      properties:
        codigoMulta:
          type: string
          description: |
            Código de Multa do título.
            * `NAOTEMMULTA` - Não tem multa
            * `VALORFIXO` – Valor fixo
            * `PERCENTUAL` - Percentual
        data:
          type: string
          description: |
            Data da Multa do título.

            Obrigatório se informado código de multa VALORFIXO ou PERCENTUAL.

            Deve ser maior que o vencimento e marca a data de início de cobrança
            de multa (incluindo essa data)

            Formato aceito: YYYY-MM-DD
        taxa:
          type: number
          description: |
            Taxa Percentual de Multa do título. Obrigatória se informado código
            de multa PERCENTUAL

            Deve ser 0 para código de multa NAOTEMMULTA
        valor:
          type: number
          description: |
            Valor de Multa expresso na moeda do título.

            Obrigatório se informado código de multa VALORFIXO

            Deve ser 0 para código de multa NAOTEMMULTA
    mora:
      required:
        - codigoMora
      properties:
        codigoMora:
          type: string
          example: ISENTO
          description: |
            Código de Mora do título.
            * `VALORDIA` - Valor ao dia
            * `TAXAMENSAL` - Taxa mensal
            * `ISENTO` - Isento
        data:
          type: string
          description: |
            Data da Mora do título.

            Obrigatório se informado código de mora VALORDIA, TAXAMENSAL.

            Deve ser maior que o vencimento e marca a data de início de cobrança
            de mora (incluindo essa data)

            Formato aceito: YYYY-MM-DD
          example: '2018-07-27'
        taxa:
          type: number
          description: |
            Percentual de Mora do título.

            Obrigatória se informado código de mora TAXAMENSAL
          example: 0
        valor:
          type: number
          description: |
            Valor de Mora expresso na moeda do título.

            Obrigatório se informado código de mora TAXAMENSAL

            Deve ser 0 para código de mora ISENTO
          example: 0
