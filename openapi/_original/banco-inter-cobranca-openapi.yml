  /boletos/webhook:
    put:
      summary: Criar webhook
      description: >
        Método destinado a criar um webhook para receber notificações
        (callbacks) de boletos pagos, cancelados e expirados.


        Caso o servidor de webhook retorne erro de recebimento do callback,
