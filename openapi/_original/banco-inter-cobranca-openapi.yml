  /boletos/webhook/callbacks:
    get:
      summary: Consultar callbacks
      description: >-
        Retorna as requisições de callbacks ordenadas pela data de disparo
        (decrescente).

        Permite consultar erros no envio de callbacks.


        * Escopo requerido: boleto-cobranca.read

        * rate limit: 10 chamadas por minuto


        <div class="button-div"> 
          <button class="button-yaml" data-category="CODE_EXAMPLE" data-value="consultarCallbacksBoleto">
            <img src="/img/icons/recipes.svg" alt="Ícone" width="24" height="24" />
            Exemplos de código
          </button>
        </div>


        <div class="swagger-link-container">
          <div class="url-container">
              <img src="https://img.shields.io/badge/GET-green"/>
            <span class="span-container">
              <span class="server">https://cdpj.partners.bancointer.com.br/cobranca/v2<span class="url">/boletos/webhook/callbacks</span></span>
            </span>
          </div>
          <img src="/img/icons/copy.svg" alt="Ícone" width="24" height="24" class="copy-icon" />
        </div>
      tags:
        - Webhook
      operationId: callbacksFilter
      parameters:
        - $ref: '#/components/parameters/xContaCorrente'
        - name: dataHoraInicio
          in: query
          required: true
          description: 'Formato aceito: yyyy-MM-dd''T''HH:mm[:ss][.SSS]XXX'
          example: 2023-06-01T00:00Z ou 2023-06-01T00:00:00.000Z
          x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm[:ss][.SSS]XXX
          schema:
            type: string
            format: date-time
            nullable: false
        - name: dataHoraFim
          description: 'Formato aceito: yyyy-MM-dd''T''HH:mm[:ss][.SSS]XXX'
          in: query
          example: 2023-06-01T00:00Z ou 2023-06-01T00:00:00.000Z
          required: true
          x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm[:ss][.SSS]XXX
          schema:
            type: string
            format: date-time
            nullable: false
        - name: pagina
          in: query
          schema:
            type: integer
            description: Posição da página na lista de dados
            default: 0
            nullable: false
        - name: tamanhoPagina
          in: query
          schema:
            type: integer
            description: Tamanho da página
            default: 20
            maximum: 50
            minimum: 10
            nullable: false
        - name: nossoNumero
          in: query
          schema:
            type: string
            description: Nosso número a ser filtrado
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAttemptPage'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
servers:
  - url: https://cdpj.partners.bancointer.com.br/cobranca/v2
    description: Servidor de Produção
components:
  parameters:
    situacao:
      name: situacao
      in: query
      required: false
      schema:
        type: string
      description: >
        Filtro pela situação da cobrança.

        * `EXPIRADO `

        * `VENCIDO`

        * `EMABERTO`

        * `PAGO`

        * `CANCELADO`

        * `EMPROCESSAMENTO`

        * `FALHAEMISSAO`

        OBS: No caso de filtrar por mais de uma situação, as situações devem ser
        separadas por vírgula (PAGO,EMABERTO,VENCIDO)
      example: EMABERTO
    nome:
      name: nome
      description: Filtro pelo nome do pagador
      in: query
      required: false
      schema:
        type: string
    email:
      name: email
      description: Filtro pelo email do pagador
      in: query
      required: false
      schema:
        type: string
    cpfCnpj:
      name: cpfCnpj
      description: Campo para informar o cpf ou cnpj do pagador
      in: query
      required: false
      schema:
        type: string
    filtrarDataPor:
      name: filtrarDataPor
      in: query
      required: false
      schema:
        type: string
        default: VENCIMENTO
      description: >
        Os filtros de data inicial e data final se aplicarão a:

        * `VENCIMENTO` - Filtro de data pelo vencimento. (Default)

        * `EMISSAO` - Filtro de data pela emissão.

        * `SITUACAO` - Filtro de data pela mudança de situação.


        Caso o campo situacao seja:


        `EXPIRADO` as datas corresponderão a data de expiração dos boletos;


        `VENCIDO` as datas corresponderão a data de vencimento dos boletos;


        `EMABERTO` as datas corresponderão a data de emissão dos boletos;


        `PAGO` as datas corresponderão a data de pagamento dos boletos;


        `CANCELADO` as datas corresponderão a data de cancelamento dos boletos;


        `EMPROCESSAMENTO` as datas corresponderão a data de boletos que se
        encontram em processamento;


        `FALHAEMISSAO` as datas corresponderão a data de boletos que se
        encontram com falha na emissão;


        Obs: o default é `VENCIMENTO`
    dataInicial:
      name: dataInicial
      in: query
      required: true
      schema:
        type: string
      description: |
        Data inicial, em acordo com o campo "filtrarDataPor"

        Formato aceito: YYYY-MM-DD
    dataFinal:
      name: dataFinal
      in: query
      required: true
      schema:
        type: string
      description: |
        Data final, em acordo com o campo "filtrarDataPor"

        Formato aceito: YYYY-MM-DD
    itensPorPagina:
      name: itensPorPagina
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 1000
      description: >
        Quantidade máxima de registros retornados em cada página. Apenas a
        última página pode conter uma quantidade menor de registros.


        Valor mínimo: 1

        Valor máximo: 1000

        Valor default: 100
    paginaAtual:
      name: paginaAtual
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
      description: |
        Página a ser retornada pela consulta.
        Valor default: 0
    ordenarPor:
      name: ordenarPor
      in: query
      required: false
      schema:
        type: string
        default: PAGADOR
      description: |
        Ordenar resultado por:
          * `PAGADOR` (Default)
          * `NOSSONUMERO`
          * `SEUNUMERO`
          * `DATASITUACAO`
          * `DATAVENCIMENTO`
          * `VALOR`
          * `STATUS`
    tipoOrdenacao:
      name: tipoOrdenacao
      in: query
      required: false
      schema:
        type: string
        default: ASC
      description: |
        Ordenação em ordem:
          * `ASC` - Crescente (Default)
          * `DESC` - Decrescente
    nossoNumero:
      name: nossoNumero
      in: path
      required: true
      schema:
        type: string
      description: Nosso número associado ao boleto
    xContaCorrente:
      name: x-conta-corrente
      in: header
      description: >-
        Conta corrente que será utilizada na operação. Necessário somente quando
        a aplicação estiver associada a mais de uma conta corrente. Enviar
        apenas números(incluindo o dígito), e não enviar zeros a esquerda.
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
