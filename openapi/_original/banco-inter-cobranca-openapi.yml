    WebhookSolicitado:
      type: object
      required:
        - webhookUrl
      title: Webhook
      properties:
        webhookUrl:
          type: string
          pattern: ^https://[^\s]*$
          format: uri
          example: https://boleto.example.com/api/webhook/
          description: >-
            URL de configuração do webhook. Deve iniciar obrigatoriamente com
            **https://**
    WebhookCompleto:
      type: object
      required:
        - webhookUrl
        - criacao
      title: Webhook
      properties:
        webhookUrl:
          type: string
          format: uri
          example: https://boleto.example.com/api/webhook/
        criacao:
          type: string
          format: date-time
          title: Data de Criação
          description: Data e hora em que o webhook foi cadastrado. Respeita RFC 3339.
          readOnly: true
    Violacao:
      type: object
      title: Violação
      properties:
        razao:
          type: string
          title: Descrição do erro
          description: Descrição do erro
          example: Valor da cobrança não pode ser 0.00
        propriedade:
          type: string
          title: Nome da propriedade
          description: Nome da propriedade
          example: cob.chave
        valor:
          type: string
          title: Valor da propriedade
          description: Valor da propriedade
          example: '061996671234'
    ProblemaViolacao:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: >-
            URI de referência que identifica o tipo de problema. De acordo com a
            RFC 7807.
          example: https://boleto.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: Descrição resumida do problema.
          example: Not found
        status:
          type: integer
          description: Código HTTP do status retornado.
          example: 404
        detail:
          type: string
          description: Descrição completa do problema.
        violacoes:
          type: array
          items:
            $ref: '#/components/schemas/Violacao'
    Problema:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: >-
            URI de referência que identifica o tipo de problema. De acordo com a
            RFC 7807.
          example: https://boleto.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: Descrição resumida do problema.
          example: Not found
        status:
          type: integer
          description: Código HTTP do status retornado.
          example: 404
        detail:
          type: string
          description: Descrição completa do problema.
    CallbackAttemptPage:
      type: object
      required:
        - data
      properties:
        totalElementos:
          type: integer
          format: int64
          description: >-
            Quantidade total de itens disponíveis de acordo com os parâmetros
            informados
        totalPaginas:
          type: integer
          description: Quantidade total de páginas disponíveis para consulta.
        primeiraPagina:
          description: Informa se é a primeira página
          type: boolean
        ultimaPagina:
          description: Informa se é a última página
          type: boolean
        data:
          description: Dados de cada notificação de callback.
          type: array
          items:
            $ref: '#/components/schemas/CallbackAttemptPageItem'
    CallbackAttemptPageItem:
      type: object
      required:
        - payload
        - numeroTentativa
        - dataEnvio
        - sucesso
      properties:
        webhookUrl:
          type: string
          description: URL do webhook no momento do disparo.
          format: uri
        payload:
          description: Corpo enviado na requisição.
          type: object
        numeroTentativa:
          description: Qual o índice da tentativa de disparo.
          type: integer
        dataHoraDisparo:
          description: Data/hora da tentativa de disparo do callback.
          type: string
          format: date-time
        sucesso:
          type: boolean
          description: Informa se obteve sucesso no disparo do callback.
        httpStatus:
          description: Resposta da chamada ao endpoint do webhook.
          type: integer
        mensagemErro:
          description: Mensagem de erro em caso de falha no dispardo do callback.
          type: string
    SituacaoBoletoEnum:
      type: string
      enum:
        - EMABERTO
        - PAGO
        - CANCELADO
        - VENCIDO
        - EXPIRADO
        - FALHAEMISSAO
        - EMPROCESSAMENTO
      description: Possíveis situações de um boleto.
  responses:
    RequisicaoInvalida:
      description: Requisição com formato inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemaViolacao'
          examples:
            exemplos1:
              $ref: '#/components/examples/BadRequestExample1'
    NaoEncontrado:
      description: Recurso solicitado não foi encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/NaoEncontradoExample1'
    AcessoNegado:
      description: >-
        Requisição de participante autenticado que viola alguma regra de
