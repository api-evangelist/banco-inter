            </span>
          </div>
          <img src="/img/icons/copy.svg" alt="Ícone" width="24" height="24" class="copy-icon" />
        </div>
      tags:
        - Webhook
      operationId: webhookPut
      parameters:
        - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        $ref: '#/components/requestBodies/WebhookConfigBody'
      responses:
        '204':
          description: Sucesso
          content: {}
      callbacks:
        listaBoletoCobranca:
          '{$request.body#/webhookUrl/boleto}':
            post:
              parameters:
                - in: header
                  name: x-conta-corrente
                  schema:
                    type: string
                    pattern: ^[1-9][0-9]*$
                    example: '13525622'
                  description: >-
                    Conta corrente relacionada ao callback. Enviar apenas
                    números(incluindo o dígito), e não enviar zeros a esquerda.
              requestBody:
                $ref: '#/components/requestBodies/WebhookBoletoBody'
              responses:
                '200':
                  description: Notificação recebida com sucesso
