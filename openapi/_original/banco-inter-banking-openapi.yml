openapi: 3.0.3
info:
  title: API Banking
  version: ''
  description: >-
    ## Gerais


    Esta seção reúne erros que poderiam ser retornados por quaisquer endpoints
    listados na API Banking.


    ### `RequisicaoInvalida`


    * __Significado__: Requisição inválida.

    * __HTTP Status Code__: [ 400 Bad Request
    ](https://tools.ietf.org/html/rfc7231#section-6.5.1).


    ### `AcessoNegado`


    * __Significado__: Requisição de participante autenticado que viola alguma
    regra de autorização.

    * __HTTP Status Code__: [ 403 Forbidden
    ](https://tools.ietf.org/html/rfc7231#section-6.5.3).


    ### `NaoEncontrado`


    * __Significado__: Entidade não encontrada.

    * __HTTP Status Code__: [ 404 Not Found
    ](https://tools.ietf.org/html/rfc7231#section-6.5.4).


    ### `PermanentementeRemovido`


    * __Significado__: Indica que a entidade existia, mas foi permanentemente
    removida.

    * __HTTP Status Code__: [ 410 Gone
    ](https://tools.ietf.org/html/rfc7231#section-6.5.9).


    ### `ErroInternoDoServidor`


    * __Significado__: Condição inesperada ao processar requisição.

    * __HTTP Status Code__: [ 500 Internal Server Error
    ](https://tools.ietf.org/html/rfc7231#section-6.6.1).


    ### `ServicoIndisponivel`


    * __Significado__: Serviço não está disponível no momento. Serviço
    solicitado pode estar em manutenção ou fora da janela de funcionamento.

    * __HTTP Status Code__: [ 503 Service Unavailable
    ](https://tools.ietf.org/html/rfc7231#section-6.6.4).


    ### `IndisponibilidadePorTempoEsgotado`


    * __Significado__: Indica que o serviço demorou além do esperado para
    retornar.

    * __HTTP Status Code__: [ 504 Gateway Timeout
    ](https://tools.ietf.org/html/rfc7231#section-6.6.5).
