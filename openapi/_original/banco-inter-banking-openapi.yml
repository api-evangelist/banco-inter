        mensagemDetalhe:
          type: string
          example: Movimentação concluída com sucesso.
          description: Mensagem de sucesso detalhada
        codigo:
          type: integer
          example: 1
          description: Identificador do Pagamento ou Agendamento de DARF
        autenticacao:
          type: string
          example: '12345678910433'
          description: Autenticação da transação
        dataPagamento:
          type: string
          example: 23/01/2022
          description: Data de pagamento
    DarfResponse:
      type: object
      properties:
        quantidadeAprovadores:
          type: integer
          example: 4
        autenticacao:
          description: Autenticação da transação
          example: '12345678910433'
          type: string
        dataPagamento:
          description: Data de pagamento
          example: 23/01/2022
          type: string
        tipoRetorno:
          $ref: '#/components/schemas/TipoRetornoEnum'
        codigoSolicitacao:
          example: 8bbdede4-35db-4ec9-b652-e176841e62c8
          type: string
    TipoRetornoEnum:
      type: string
      enum:
        - PAGAMENTO
        - AGENDAMENTO
        - APROVACAO_PAGAMENTO
        - APROVACAO_AGENDAMENTO
    TipoRetornoPagamentoPixEnum:
      type: string
      enum:
        - APROVACAO
        - PROCESSADO
        - AGENDADO
    PagarLoteRequest:
      type: object
      required:
        - pagamentos
      properties:
        meuIdentificador:
          type: string
          maxLength: 30
          description: Identificador do lote para o cliente.
        pagamentos:
          type: array
          maxItems: 150
          minItems: 2
          items:
            oneOf:
              - $ref: '#/components/schemas/RequestBoletoLote'
              - $ref: '#/components/schemas/RequestDarfLote'
            discriminator:
              propertyName: tipoPagamento
              mapping:
                BOLETO: '#/components/schemas/RequestBoletoLote'
                DARF: '#/components/schemas/RequestDarfLote'
          description: Pagamentos a serem efetuado.
    PagamentoRequestModelBase:
      type: object
      required:
        - tipoPagamento
      discriminator:
        propertyName: tipoPagamento
      properties:
        tipoPagamento:
          $ref: '#/components/schemas/TipoPagamentoEnum'
    PagamentoResponseModelBase:
      type: object
      discriminator:
        propertyName: tipoPagamento
      required:
        - seqId
      properties:
        tipoPagamento:
          $ref: '#/components/schemas/TipoPagamentoEnum'
        detalhe:
          type: string
    RequestBoletoLote:
      allOf:
        - $ref: '#/components/schemas/PagamentoRequestModelBase'
      type: object
      required:
        - codBarraLinhaDigitavel
        - valorPagar
        - dataVencimento
      properties:
        codBarraLinhaDigitavel:
          type: string
          minLength: 44
          maxLength: 48
          description: Código de barras ou linha digitável
          example: '07797000000000000004501008460019310001802680'
        valorPagar:
          type: number
          minimum: 0.01
          description: |
            Valor a ser pago.
          example: '26.80'
        dataPagamento:
          type: string
          format: date
          description: |
            Data em que será pago o título.
            Formato aceito: YYYY-MM-DD
          example: '2023-08-18'
        dataVencimento:
          type: string
          format: date
          description: |
            Data de vencimento do título.
            Formato aceito: YYYY-MM-DD
          example: '2018-07-27'
        cpfCnpjBeneficiario:
          type: string
          pattern: ^[0-9]{11}$|^[0-9]{14}$
          description: >
            CPF/CNPJ do beneficiário! Caso informado, será realizada a validação
            do campo em questão. Formato aceito: 12345678912345
          example: '12345678912345'
    PagamentoPixRequestBody:
      type: object
      required:
        - valor
        - destinatario
      properties:
        valor:
          type: number
          format: double
          description: Valor do pagamento PIX
          example: 234.56
        dataPagamento:
          type: string
          format: date
          description: >
            Data solicitada para efetivação do pagamento do Pix (String
            formatada)


            Se não for informada, será a data atual.


            Format aceito: YYYY-MM-DD
          example: '2025-02-24'
        descricao:
          type: string
          maxLength: 140
        destinatario:
          oneOf:
            - $ref: '#/components/schemas/DestinatarioDadosBancarios'
            - $ref: '#/components/schemas/DestinatarioChave'
            - $ref: '#/components/schemas/DestinatarioPixCopiaECola'
          discriminator:
            propertyName: tipo
            mapping:
              DADOS_BANCARIOS: '#/components/schemas/DestinatarioDadosBancarios'
              CHAVE: '#/components/schemas/DestinatarioChave'
              PIX_COPIA_E_COLA: '#/components/schemas/DestinatarioPixCopiaECola'
      example:
        dadosBancarios:
          valor: 1.23
          dataPagamento: '2022-10-10'
          descricao: Pix dados bancários teste
          destinatario:
            tipo: DADOS_BANCARIOS
            nome: Teste dados bancários
            contaCorrente: '0000000'
            tipoConta: CONTA_CORRENTE
            cpfCnpj: '00000000000'
            agencia: '0019'
            instituicaoFinanceira:
              ispb: '00416968'
        chavePix:
          valor: 1.23
          dataPagamento: '2022-10-10'
          descricao: Pix com chave Pix teste
          destinatario:
            tipo: CHAVE
            chave: chavepix@teste.com
        pixCopiaECola:
          valor: 1.23
          dataPagamento: '2022-10-10'
          descricao: Pix com código Copia e Cola
          destinatario:
            tipo: PIX_COPIA_E_COLA
            pixCopiaECola: <Código Copia E Cola>
