    DarfRequest:
      type: object
      required:
        - cnpjCpf
        - codigoReceita
        - dataVencimento
        - descricao
        - nomeEmpresa
        - periodoApuracao
        - valorPrincipal
        - referencia
      properties:
        cnpjCpf:
          type: string
          description: Campo para informar o cpf ou cnpj do pagador
          minLength: 11
          maxLength: 20
          example: '90022400664'
        codigoReceita:
          type: string
          description: Campo para informar o código da receita
          minLength: 4
          maxLength: 4
          example: '0220'
        dataVencimento:
          type: string
          format: date
          description: |
            Campo para informar a data de vencimento da DARF

            Formato aceito: YYYY-MM-DD
          example: '2022-01-30'
        descricao:
          type: string
          description: Campo para informar a descrição
          maxLength: 1000
          example: Pagamento DARF Janeiro
        nomeEmpresa:
          type: string
          description: Campo para informar o nome da empresa
          maxLength: 100
          example: Minha Empresa
        telefoneEmpresa:
          type: string
          description: Campo para informar o telefone da empresa
          maxLength: 50
          example: '031999911111'
        periodoApuracao:
          type: string
          format: date
          description: |
            Campo para informar o período de apuração da DARF

            Formato aceito: YYYY-MM-DD
          example: '2020-01-31'
        valorPrincipal:
          type: number
          description: Campo para informar o valor principal
          example: 47.14
        valorMulta:
          type: number
          description: Campo para informar o valor da multa
          example: 27.48
        valorJuros:
          type: number
          description: Campo para informar o valor do juros
          example: 10.11
        referencia:
          type: string
          description: Campo para informar a referência da DARF
          maxLength: 30
          pattern: '[0-9]'
          example: '13609400849201739'
    ResponseError:
      description: Objeto para retorno do detalhamento do erro
      type: object
      properties:
        erro:
          $ref: '#/components/schemas/ErrorModel'
    ErrorModel:
      type: object
      description: Objeto para retorno do detalhamento do erro
      properties:
        mensagem:
          type: string
          example: (Requisição inválida, Erro interno do servidor, ...)
          description: Mensagem de erro.
          maxLength: 200
        mensagemDetalhe:
          type: string
          example: (Tipo não informado, CPF/CNPJ não pode ser nulo, ...)
          description: Mensagem de erro detalhada.
          maxLength: 200
        codigo:
          type: integer
          example: (51002, 51001, ...)
          description: Código da mensagem.
        status:
          type: integer
          example: (400, 422, ...)
          description: Status da Resposta.
    SucessoDarfResponse:
      type: object
