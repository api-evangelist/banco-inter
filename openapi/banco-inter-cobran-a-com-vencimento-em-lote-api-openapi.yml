    CobBase:
      type: object
      title: Cobrança Base
      description: Atributos comuns a todas entidades de Cobrança
      properties:
        chave:
          type: string
          title: Chave DICT do recebedor
          description: '* O campo chave determina a chave Pix do recebedor que será utilizada para a cobrança.

            * Os tipos de chave podem ser: telefone, e-mail, cpf/cnpj ou EVP.

            * O formato das chaves pode ser encontrado na seção "Formatação das chaves do DICT no BR Code" do [Manual de Padrões para iniciação do Pix](https://www.bcb.gov.br/estabilidadefinanceira/pagamentosinstantaneos).

            '
          maxLength: 77
          minLength: 1
        solicitacaoPagador:
          type: string
          title: Solicitação ao pagador
          description: O campo solicitacaoPagador determina um texto a ser apresentado ao pagador para que ele possa digitar uma informação correlata, em formato livre, a ser enviada ao recebedor. Esse texto está limitado a 140 caracteres.
          maxLength: 140
          minLength: 1
        infoAdicionais:
          type: array
          title: Informações adicionais
          description: Cada respectiva informação adicional contida na lista (nome e valor) deve ser apresentada ao pagador.
          maximum: 50
          items:
            type: object
            required:
            - nome
            - valor
            properties:
              nome:
                type: string
                title: Nome
                description: Nome do campo.
                maxLength: 50
                minLength: 1
              valor:
                type: string
                title: Valor
                description: Dados do campo.
                maxLength: 200
                minLength: 1
