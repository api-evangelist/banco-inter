    CobVValor:
      type: object
      title: Valor da cobrança com vencimento
      description: Valores monetários.
      allOf:
      - type: object
        properties:
          original:
            type: string
            title: Valor
            description: Valor original da cobrança.
          multa:
            type: object
            title: Multa
            description: Multa aplicada à cobrança
            properties:
              modalidade:
                type: integer
                format: int32
                title: Modalidade da multa
                minimum: 1
                maximum: 2
                description: '##### Modalidade da multa, conforme tabela de domínios.

                  <table><tr><th>Descrição</th><th>Domínio</th></tr><tr><td>Valor Fixo</td><td>1</td></tr><tr><td>Percentual</td><td>2</td></tr></table>

                  '
              valorPerc:
                type: string
                title: Valor da multa absoluta
                description: Multa do documento em valor absoluto ou percentual, conforme "valor.multa.modalidade".
                pattern: \d{1,10}\.\d{2}
          juros:
            type: object
            title: Juro
            description: Juro aplicado à cobrança
            properties:
              modalidade:
                type: integer
                format: int32
                minimum: 1
                maximum: 8
                title: Modalidade de juros
                description: '##### Modalidade de juros, conforme tabela de domínios.

                  <table><tr><th>Descrição</th><th>Domínio</th></tr><tr><td>Valor (dias corridos)</td><td>1</td></tr><tr><td>Percentual ao dia (dias corridos)</td><td>2</td></tr><tr><td>Percentual ao mês (dias corridos)</td><td>3</td></tr><tr><td>Percentual ao ano (dias corridos)</td><td>4</td></tr><tr><td>Valor (dias úteis)</td><td>5</td></tr><tr><td>Percentual ao dia (dias úteis)</td><td>6</td></tr><tr><td>Percentual ao mês (dias úteis)</td><td>7</td></tr><tr><td>Percentual ao ano (dias úteis)</td><td>8</td></tr></table>

                  '
              valorPerc:
                type: string
                title: Valor
                pattern: \d{1,10}\.\d{2}
          abatimento:
            title: Abatimento
            required:
            - modalidade
            - valorPerc
            description: Abatimento aplicado à cobrança
            properties:
              modalidade:
                type: integer
                format: int32
                minimum: 1
                maximum: 2
                title: Modalidade de abatimentos
                description: '##### Modalidade de abatimentos, conforme tabela de domínios.

                  <table><tr><th>Descrição</th><th>Domínio</th></tr><tr><td>Valor Fixo</td><td>1</td></tr><tr><td>Percentual</td><td>2</td></tr></table>

                  '
              valorPerc:
                type: string
                title: Abatimentos
                description: Abatimentos ou outras deduções aplicadas ao documento, em valor absoluto ou percentual do valor original do documento.
                pattern: \d{1,10}\.\d{2}
      - type: object
        properties:
          desconto:
            title: Desconto
            required:
            - modalidade
            description: Descontos aplicados à cobrança
            properties:
              modalidade:
                type: string
                title: Modalidade de descontos
                description: '##### Modalidade de desconto, conforme tabela de domínios.

                  <table><tr><th>Descrição</th><th>Domínio</th></tr><tr><td>Valor Fixo até a[s] data[s] informada[s]</td><td>1</td></tr><tr><td>Percentual até a[s] data[s] informada[s]</td><td>2</td></tr><tr><td>Valor por antecipação dia corrido</td><td>3</td></tr><tr><td>Valor por antecipação dia útil</td><td>4</td></tr><tr><td>Percentual por antecipação dia corrido</td><td>5</td></tr><tr><td>Percentual por antecipação dia útil</td><td>6</td></tr></table>

                  '
            oneOf:
            - $ref: '#/components/schemas/ValorPerc'
            - $ref: '#/components/schemas/DescontoDataFixa'
    CobVDevedor:
