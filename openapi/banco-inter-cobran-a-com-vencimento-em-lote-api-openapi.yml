openapi: 3.2.0
info:
  title: Banco Inter Cobrança com Vencimento em Lote API
  version: ''
  description: 'Operations tagged Cobrança com Vencimento em Lote across 2 of this provider''s published API definitions: swagger-api-pix-yaml.yaml, banco-inter-pix-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cdpj.partners.bancointer.com.br/pix/v2
  description: Servidor de Produção
- url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
  description: Servidor de Sandbox
tags:
- name: Cobrança com Vencimento em Lote
paths:
  /lotecobv/{id}:
    put:
      summary: Criar/Alterar lote de cobranças com vencimento
      description: 'Endpoint utilizado para criar ou alterar um lote de cobranças com vencimento.


        Para o caso de uso de alteração de cobranças, o array a ser atribuído na requisição

        deve ser composto pelas exatas requisições de criação de cobranças que

        constaram no array atribuído na requisição originária.


        Não se pode utilizar este endpoint para _alterar_ um lote de cobranças com vencimento

        agregando ou removendo cobranças já existentes dentro do conjunto de cobranças

        criadas na requisição originária do lote (requisição de criação do lote).


        Em outras palavras, se originalmente criou-se um lote, por exemplo, com as cobranças

        [`a`, `b` e `c`], não se pode _alterar_ esse conjunto de cobranças original que o

        lote representa para [`a`, `b`, `c`, `d`], ou para [`a`, `b`].

        Por outro lado, pode-se alterar, _em lote_ as cobranças [`a`, `b`, `c`],

        conforme originalmente constam na requisição originária do lote.


        Uma solicitação de __criação__ de cobrança com status "EM_PROCESSAMENTO" ou "NEGADA"

        está associada a uma cobrança que não _existe_ de fato, portanto não será

        listada em `GET /cobv` ou `GET /cobv/{txid}`.


        Uma cobrança, uma vez criada via `PUT /cobv/{txid}`, não pode ser associada a um lote posteriormente.


        Uma cobrança, uma vez criada via `PUT /lotecobv/{id}`, não pode ser associada a um novo lote posteriormente.


        * Escopo requerido: lotecobv.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/lotecobv/{id}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/lotecobv/{id}'
      tags:
      - Cobrança com Vencimento em Lote
      operationId: lotecobvIdPut
      parameters:
      - $ref: '#/components/parameters/IdLote'
      - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        $ref: '#/components/requestBodies/LoteCobVBody'
      responses:
        '202':
          description: Lote de cobranças com vencimento solicitado para criação.
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                exemplo1:
                  $ref: '#/components/examples/RequisicaoInvalidaLoteCobVExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    patch:
      summary: Revisar cobranças específicas dentro de um lote
      description: 'Endpoint para revisar cobranças específicas dentro de um lote de cobranças com vencimento.


        A diferença deste endpoint para o endpoint PUT correlato é que este endpoint admite um array

        `cobsv` com menos solicitações de alteração de cobranças do que o array atribuído

        na requisição originária do lote.


        Não se pode, entretanto, utilizar esse endpoint para agregar ou remover solicitações de

        alteração ou criação de cobranças conforme constam na requisição originária do lote.


        * Escopo requerido: lotecobv.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/lotecobv/{id}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/lotecobv/{id}'
      tags:
      - Cobrança com Vencimento em Lote
      operationId: lotecobvIdPatch
      parameters:
      - $ref: '#/components/parameters/IdLote'
      - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        $ref: '#/components/requestBodies/LoteCobVBodyRevisado'
      responses:
        '202':
          description: Solicitação de revisão do Lote de cobranças encaminhada para processamento.
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                exemplo1:
                  $ref: '#/components/examples/OperacaoInvalidaCobVExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    get:
      summary: Consultar um lote de cobranças com vencimento
      description: 'Endpoint para consultar um lote de cobranças com vencimento.


        * Escopo requerido: lotecobv.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/lotecobv/{id}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/lotecobv/{id}'
      tags:
      - Cobrança com Vencimento em Lote
      operationId: lotecobvIdGet
      parameters:
      - $ref: '#/components/parameters/IdLote'
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '200':
          description: Lote de cobranças com vencimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoteCobVConsultado'
              examples:
                exemplo1:
                  $ref: '#/components/examples/loteCobVResponse1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /lotecobv/{id}/sumario:
    get:
      summary: Sumário de um lote de cobranças com vencimento
      description: 'Endpoint para consultar o sumário de um lote de cobranças com vencimento.


        * Escopo requerido: lotecobv.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/lotecobv/{id}/sumario


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/lotecobv/{id}/sumario'
      tags:
      - Cobrança com Vencimento em Lote
      operationId: lotecobvIdSumarioGet
      parameters:
      - $ref: '#/components/parameters/IdLote'
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '200':
          description: Sumário de um Lote de cobranças com vencimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryLoteCobV'
              examples:
                exemplo1:
                  $ref: '#/components/examples/SummaryloteCobVResponse1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /lotecobv/{id}/situacao/{situacao}:
    get:
      summary: Consultar cobranças de um lote por situação
      description: 'Endpoint para consultar os Pix Cobrança com vencimento de um lote pelo id e situação.


        * Escopo requerido: lotecobv.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/lotecobv/{id}/situacao/{situacao}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/lotecobv/{id}/situacao/{situacao}'
      tags:
      - Cobrança com Vencimento em Lote
      operationId: lotecobvIdSituacaoSituacaoGet
      parameters:
      - $ref: '#/components/parameters/IdLote'
      - in: path
        name: situacao
        required: true
        schema:
          $ref: '#/components/schemas/SituacaoCobranca'
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '200':
          description: Sumário de um Lote de cobranças com vencimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoteCobVConsultado'
              examples:
                exemplo1:
                  $ref: '#/components/examples/loteCobVByIdStatusResponse1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /lotecobv:
    get:
      summary: Consultar lotes de cobranças com vencimento
      description: 'Endpoint para consultar lista de lotes de cobranças com vencimento.


        * Escopo requerido: lotecobv.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/lotecobv


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/lotecobv'
      tags:
      - Cobrança com Vencimento em Lote
      operationId: lotecobvGet
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - in: query
        name: inicio
        required: true
        schema:
          $ref: '#/components/schemas/Inicio'
      - in: query
        name: fim
        required: true
        schema:
          $ref: '#/components/schemas/Fim'
      - $ref: '#/components/parameters/paginaAtual'
      - $ref: '#/components/parameters/itensPorPagina'
      responses:
        '200':
          description: Lotes de cobranças com vencimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotesCobVConsultados'
              examples:
                exemplo1:
                  $ref: '#/components/examples/getLotesCobsV'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
components:
  schemas:
    Problema:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI de referência que identifica o tipo de problema. De acordo com a RFC 7807.
          example: https://pix.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: Descrição resumida do problema.
          example: Not found
        status:
          type: integer
          description: Código HTTP do status retornado.
          example: 404
        detail:
          type: string
          description: Descrição completa do problema.
        correlationId:
          type: string
          description: Identificador de correlação do problema para fins de suporte
        violacoes:
          type: array
          items:
            $ref: '#/components/schemas/Violacao'
    ValorPerc:
      type: object
      required:
      - valorPerc
      properties:
        valorPerc:
          type: string
          title: Abatimentos
          description: Abatimentos ou outras deduções aplicadas ao documento, em valor absoluto ou percentual do valor original do documento.
          pattern: \d{1,10}\.\d{2}
    ParametrosConsultaLote:
      type: object
      title: Parâmetros de consulta de lotes de cobrança com vencimento.
      description: Parâmetros utilizados para a realização de uma consulta de lote de cobranças com vencimento.
      properties:
        inicio:
          type: string
          title: Data de Início
          description: Data inicial utilizada na consulta. Respeita RFC 3339.
          example: '2020-04-01T00:00:00Z'
        fim:
          type: string
          title: Data de Fim
          description: Data de fim utilizada na consulta. Respeita RFC 3339.
          example: '2020-04-01T17:00:00Z'
        paginacao:
          $ref: '#/components/schemas/Paginacao'
    LotesCobVConsultados:
      title: Lotes de solicitações de cobranças com vencimento
      type: object
      required:
      - parametros
      - lotes
      properties:
        parametros:
          $ref: '#/components/schemas/ParametrosConsultaLote'
        lotes:
          type: array
          title: Lotes de solicitações de criação/alteração de cobranças com vencimento
          items:
            allOf:
            - $ref: '#/components/schemas/LoteCobVConsultado'
    Paginacao:
      type: object
      title: Paginação
      required:
      - paginaAtual
      - itensPorPagina
      - quantidadeDePaginas
      - quantidadeTotalDeItens
      properties:
        paginaAtual:
          type: integer
          title: Página atual
          description: Número da página recuperada.
          minimum: 0
        itensPorPagina:
          type: integer
          title: Itens por página
          description: Quantidade de registros retornado na página.
          minimum: 1
        quantidadeDePaginas:
          type: integer
          title: Quantidade de páginas
          description: Quantidade de páginas disponíveis para consulta.
          minimum: 1
        quantidadeTotalDeItens:
          type: integer
          title: Quantidade total de itens
          description: Quantidade total de itens disponíveis de acordo com os parâmetros informados.
          minimum: 0
    TxId:
      type: string
      title: Id da Transação
      description: '# Identificador da transação


        O campo txid determina o identificador da transação.

        O objetivo desse campo é ser um elemento que possibilite ao PSP do recebedor apresentar ao usuário recebedor a funcionalidade de conciliação de pagamentos.


        O txid é criado exclusivamente pelo usuário recebedor e está sob sua responsabilidade.

        O txid, no contexto de representação de uma cobrança, é único por CPF/CNPJ do usuário recebedor.

        '
      pattern: '[a-zA-Z0-9]{26,35}'
    Fim:
      type: string
      format: date-time
      title: Data de fim
      description: Filtra os registros cuja data de criação seja menor ou igual que a data de fim. Respeita RFC 3339.
    Inicio:
      type: string
      format: date-time
      title: Data de início
      description: Filtra os registros cuja data de criação seja maior ou igual que a data de início. Respeita RFC 3339.
    CobVRevisadaItem:
      type: object
      allOf:
      - type: object
        required:
        - txid
        properties:
          txid:
            type: string
            pattern: '[a-zA-Z0-9]{26,35}'
          calendario:
            title: Calendário
            description: Os campos aninhados sob o identificador calendário organizam informações a respeito de controle de tempo da cobrança.
            allOf:
            - $ref: '#/components/schemas/CobDataDeVencimento'
          devedor:
            description: 'Não é permitido que o campo devedor.cpf e campo devedor.cnpj estejam preenchidos ao mesmo tempo. Se o campo devedor.nome está preenchido, então deve existir ou um devedor.cpf ou um campo devedor.cnpj preenchido.


              Os campos aninhados sob o objeto devedor são opcionais e identificam a pessoa ou a instituição a quem a cobrança está endereçada. Não identifica, necessariamente, quem irá efetivamente realizar o pagamento.'
            oneOf:
            - $ref: '#/components/schemas/PessoaFisica'
            - $ref: '#/components/schemas/PessoaJuridica'
            allOf:
            - type: object
              properties:
                email:
                  type: string
                  title: Email
                  description: Email do usuário.
                logradouro:
                  type: string
                  title: Logradouro
                  description: Logradouro do usuário.
                  maxLength: 200
                cidade:
                  type: string
                  title: Cidade
                  description: Cidade do usuário.
                  maxLength: 200
                uf:
                  type: string
                  title: UF
                  description: UF do usuário.
                  enum:
                  - AC
                  - AL
                  - AP
                  - AM
                  - BA
                  - CE
                  - DF
                  - ES
                  - GO
                  - MA
                  - MT
                  - MS
                  - MG
                  - PA
                  - PB
                  - PR
                  - PE
                  - PI
                  - RJ
                  - RN
                  - RS
                  - RO
                  - RR
                  - SC
                  - SP
                  - SE
                  - TO
                cep:
                  type: string
                  title: CEP
                  description: CEP do usuário.
                  pattern: '[0-9]{1,8}'
          loc:
            allOf:
            - $ref: '#/components/schemas/PayloadLocationCob'
          status:
            type: string
            title: Status da Cobrança
            enum:
            - REMOVIDA_PELO_USUARIO_RECEBEDOR
          valor:
            $ref: '#/components/schemas/CobVValor'
      - $ref: '#/components/schemas/CobBase'
    PessoaFisica:
      type: object
      required:
      - cpf
      - nome
      title: Pessoa Física
      properties:
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 200
        cpf:
          type: string
          title: CPF
          pattern: \d{11}
          description: CPF do usuário.
    PessoaJuridica:
      type: object
      required:
      - cnpj
      - nome
      title: Pessoa Jurídica
      properties:
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 200
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: CNPJ do usuário.
    SituacaoCobranca:
      type: string
      enum:
      - EM_PROCESSAMENTO
      - CRIADA
      - NEGADA
    CobVDataVencimento:
      type: object
      title: Data de Vencimento
      required:
      - dataDeVencimento
      properties:
        dataDeVencimento:
          type: string
          title: Data de vencimento da cobrança
          format: date
          description: Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601. É a data de vencimento da cobrança. A cobrança pode ser honrada até esse dia, inclusive, em qualquer horário do dia.
          example: '2020-04-01'
        validadeAposVencimento:
          type: integer
          format: int32
          title: Validade após vencimento
          description: 'Trata-se da quantidade de dias corridos após calendario.dataDeVencimento,

            em que a cobrança poderá ser paga.


            Aplica-se este campo sobre o vencimento original da cobrança acrescentando-se o

            número de dias corridos nos quais a cobrança ainda poderá ser paga, após vencida.

            Este valor não se sobrepõe à possibilidade de pagamento em data posterior ao vencimento

            original por [força de lei](http://www.planalto.gov.br/ccivil_03/LEIS/L7089.htm).

            Nesse sentido, um vencimento determinado para um dia não útil deverá ser acatado

            no primeiro dia útil subsequente mesmo que exceda o número de dias definido neste campo.


            Para ilustrar o funcionamento, seguem alguns exemplos:


            Exemplo A:


            ```txt

            dataDeVencimento: 2020-10-20, terça-feira.

            validadeAposVencimento: 4


            Tenta-se pagar no dia 2020-10-23, sexta: aceito.

            Tenta-se pagar no dia 2020-10-24, sábado: aceito.

            Tenta-se pagar no dia 2020-10-25, domingo: negado.

            ```


            Exemplo B:


            ```txt

            dataDeVencimento: 2020-12-25, sexta-feira, feriado.

            validadeAposVencimento: 0


            Tenta-se pagar no dia 2020-12-25, sexta: aceito.

            Tenta-se pagar no dia 2020-12-26, sábado: aceito.

            Tenta-se pagar no dia 2020-12-27, domingo: aceito.

            Tenta-se pagar no dia 2020-12-28, segunda: aceito.

            Tenta-se pagar no dia 2020-12-29, terça: negado.

            ```


            Exemplo C:


            ```txt

            dataDeVencimento: 2020-12-25, sexta-feira, feriado.

            validadeAposVencimento: 1


            Tenta-se pagar no dia 2020-12-25, sexta: aceito.

            Tenta-se pagar no dia 2020-12-26, sábado: aceito.

            Tenta-se pagar no dia 2020-12-27, domingo: aceito.

            Tenta-se pagar no dia 2020-12-28, segunda: aceito.

            Tenta-se pagar no dia 2020-12-29, terça: negado.

            ```


            Exemplo D:


            ```txt

            dataDeVencimento: 2020-12-25, sexta-feira, feriado.

            validadeAposVencimento: 3


            Tenta-se pagar no dia 2020-12-25, sexta: aceito.

            Tenta-se pagar no dia 2020-12-26, sábado: aceito.

            Tenta-se pagar no dia 2020-12-27, domingo: aceito.

            Tenta-se pagar no dia 2020-12-28, segunda: aceito.

            Tenta-se pagar no dia 2020-12-29, terça: negado.

            ```


            Exemplo E:



            ```txt

            dataDeVencimento: 2020-12-25, sexta-feira, feriado.

            validadeAposVencimento: 4


            Tenta-se pagar no dia 2020-12-25, sexta: aceito.

            Tenta-se pagar no dia 2020-12-26, sábado: aceito.

            Tenta-se pagar no dia 2020-12-27, domingo: aceito.

            Tenta-se pagar no dia 2020-12-28, segunda: aceito.

            Tenta-se pagar no dia 2020-12-29, terça: aceito.

            Tenta-se pagar no dia 2020-12-30, quarta: negado.

            ```

            '
    LoteCobVConsultado:
      title: Lote de solicitações de alteração ou criação de cobranças com vencimento
      type: object
      required:
      - id
      - descricao
      - criacao
      - cobsv
      properties:
        id:
          type: integer
          format: int64
          title: Id do lote
        descricao:
          type: string
          title: Descrição do lote
        criacao:
          type: string
          format: date-time
          title: Data de criação do lote
          description: Timestamp que indica o momento em que foi criado o lote. Respeita o formato definido na RFC 3339.
        cobsv:
          type: array
          items:
            type: object
            required:
            - txid
            - status
            properties:
              txid:
                type: string
                pattern: '[a-zA-Z0-9]{26,35}'
              status:
                type: string
