        boleto:
          description: 'Objeto com os dados da Cobrança gerada para pagamento via código de barras/linha digitável.


            <strong>Caso a cobrança esteja com a situação EM_PROCESSAMENTO, essa propriedade poderá não ser retornada.</strong>

            '
