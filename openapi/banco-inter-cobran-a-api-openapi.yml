openapi: 3.2.0
info:
  title: Banco Inter Cobrança API
  version: ''
  description: 'Operations tagged Cobrança across 2 of this provider''s published API definitions: swagger-cobranca-bolepix-yaml.yaml, banco-inter-cobranca-bolepix-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cdpj.partners.bancointer.com.br/cobranca/v3
  description: Servidor de Produção
- url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
  description: Servidor de Sandbox
tags:
- name: Cobrança
paths:
  /cobrancas:
    get:
      tags:
      - Cobrança
      summary: Recuperar coleção de cobranças
      description: 'Recuperar coleção de cobranças


        * Escopo requerido: boleto-cobranca.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas'
      operationId: pesquisaCobranca
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/dataInicial'
      - $ref: '#/components/parameters/dataFinal'
      - $ref: '#/components/parameters/filtrarDataPor'
      - $ref: '#/components/parameters/situacao'
      - $ref: '#/components/parameters/pessoaPagadora'
      - $ref: '#/components/parameters/cpfCnpjPessoaPagadora'
      - $ref: '#/components/parameters/seuNumero'
      - $ref: '#/components/parameters/tipoCobranca'
      - $ref: '#/components/parameters/itensPorPagina'
      - $ref: '#/components/parameters/paginaAtual'
      - $ref: '#/components/parameters/ordenarPor'
      - $ref: '#/components/parameters/tipoOrdenacao'
      responses:
        '200':
          description: Solicitação realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobrancasResponse'
              examples:
                exemplo1:
                  $ref: '#/components/examples/exemploRetornoListaCobrancas'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    post:
      tags:
      - Cobrança
      description: 'Método utilizado para emitir uma cobrança com código de barras e QRCode

        de forma assíncrona.


        Após a emissão, será disparado um callback com os dados da cobrança

        gerada para seu webhook cadastrado.

        Você também poderá buscar atualizações da cobrança de forma ativa

        utilizando o Código identificador(codigoSolicitacao) único retornado na

        chamada de inclusão.


        Sua chave Pix será automaticamente selecionada para emissão do QR Code

        no boleto de cobrança. Caso nenhuma chave seja encontrada, o boleto

        será emitido sem o QR Code. Cadastre uma chave Pix via aplicativo ou

        Internet Banking para aproveitar todos os benefícios do produto.


        Atenção:


        **Horário limite para vencimento no dia corrente:**


        Cobranças com vencimento para o mesmo dia só podem ser emitidas até às

        19h59.


        **Controle de duplicidade:**


        Para evitar emissão de cobranças em duplicidade, utilizamos os campos

        seuNumero, valorNominal, dataVencimento e cpfCnpj do pagador para

        montar uma chave de idempotência, com duração de 30min. Portanto, não

        será possível emitir mais de uma cobrança com todos estes campos

        idênticos em um intervalo de 30 minutos entre as chamadas.


        * Escopo requerido: boleto-cobranca.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas'
      summary: Emitir cobrança
      operationId: emitirCobrancaAsync
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        $ref: '#/components/requestBodies/EmitirCobrancaAsyncRequest'
      responses:
        '200':
          description: Retorno do inserir boleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitirCobrancaAsyncResponse'
              examples:
                exemplo1:
                  $ref: '#/components/examples/exemploRetornoEmitirCobranca'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
  /cobrancas/{codigoSolicitacao}:
    get:
      tags:
      - Cobrança
      description: 'Retorna os dados da cobrança de acordo com codigoSolicitacao informado.


        * Escopo requerido: boleto-cobranca.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/{codigoSolicitacao}


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/{codigoSolicitacao}'
      summary: Recuperar cobrança
      operationId: recuperarCobrancaDetalhada
      parameters:
      - $ref: '#/components/parameters/codigoSolicitacao'
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobrancaDetalhadaResponseBody'
              examples:
                example1:
                  $ref: '#/components/examples/exemploRetornoRecuperarCobranca'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    patch:
      tags:
      - Cobrança
      description: 'Editar os dados da cobrança de acordo com codigoSolicitacao informado.


        * Escopo requerido: boleto-cobranca.write

        * rate limit:


        * 10 chamadas por minuto


        * 10 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/{codigoSolicitacao}


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/{codigoSolicitacao}


        * Observações:


        * O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.


        * Após editar uma cobrança, seu valor pode levar até **30 minutos** para ser atualizado.'
      summary: Editar cobrança
      operationId: editarCobranca
      parameters:
      - $ref: '#/components/parameters/codigoSolicitacao'
      - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        $ref: '#/components/requestBodies/UpdateCobrancaRequest'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCobrancaResponseBody'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
  /cobrancas/edicao/{codigoEdicao}:
    get:
      tags:
      - Cobrança
      description: 'Consultar edição da cobrança de acordo com codigoEdicao informado.


        * Escopo requerido: boleto-cobranca.read

        * rate limit:


        * 10 chamadas por minuto


        * 10 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/edicao/{codigoEdicao}


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/edicao/{codigoEdicao}


        * Observações:


        * O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.


        * Após editar uma cobrança, seu valor pode levar até **30 minutos** para ser atualizado.'
      summary: Consultar status da edição da cobrança
      operationId: consultarAtualizacaoCobranca
      parameters:
      - $ref: '#/components/parameters/codigoEdicao'
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStatusUpdateResponseBody'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
  /cobrancas/{codigoSolicitacao}/pdf:
    get:
      tags:
      - Cobrança
      description: 'Recupera uma cobrança com código de barras e QRCode em PDF.


        * Escopo requerido: boleto-cobranca.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/{codigoSolicitacao}/pdf


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/{codigoSolicitacao}/pdf'
      summary: Recuperar cobrança em PDF
      operationId: obterPdfCobranca
      parameters:
      - $ref: '#/components/parameters/codigoSolicitacao'
      - $ref: '#/components/parameters/xContaCorrente'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfResponse'
              examples:
                exemplo1:
                  $ref: '#/components/examples/exemploResponsePdf'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
  /cobrancas/{codigoSolicitacao}/cancelar:
    post:
      tags:
      - Cobrança
      description: 'Cancelar cobrança com o codigoSolicitacao informado.


        * Escopo requerido: boleto-cobranca.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/{codigoSolicitacao}/cancelar


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/{codigoSolicitacao}/cancelar'
      summary: Cancelar cobrança
      operationId: cancelarCobranca
      parameters:
      - $ref: '#/components/parameters/codigoSolicitacao'
      - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        $ref: '#/components/requestBodies/CancelarCobrancaRequest'
      responses:
        '202':
          description: Sucesso
          content: {}
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
  /cobrancas/sumario:
    get:
      tags:
      - Cobrança
      description: 'Utilizado para recuperar o sumário de uma coleção de Cobranças por um período

        específico, de acordo com os parâmetros informados.


        * Escopo requerido: boleto-cobranca.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v3/cobrancas/sumario


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/sumario'
      summary: Recuperar sumário de cobranças
      operationId: consultarSumario
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/dataInicial'
      - $ref: '#/components/parameters/dataFinal'
      - $ref: '#/components/parameters/filtrarDataPor'
      - $ref: '#/components/parameters/situacao'
      - $ref: '#/components/parameters/tipoCobranca'
      - $ref: '#/components/parameters/seuNumero'
      - $ref: '#/components/parameters/pessoaPagadora'
      - $ref: '#/components/parameters/cpfCnpjPessoaPagadora'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/itemSumarioCobrancas'
              examples:
                exemploe1:
                  $ref: '#/components/examples/exemploRetornoSumario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
  /cobrancas/{codigoSolicitacao}/pagar:
    post:
      tags:
      - Cobrança
      description: 'Pagamento de uma cobrança com código de barras ou QRCode(**Exclusivo para o ambiente Sandbox**).


        Após o pagamento, será disparado um callback com os dados da cobrança atualizados para seu webhook cadastrado.


        * Escopo requerido: boleto-cobranca.write

        * rate limit:


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj-sandbox.partners.uatinter.co/cobranca/v3/cobrancas/{codigoSolicitacao}/pagar'
      summary: Pagar cobrança (Sandbox)
      operationId: pagarCobranca
      servers:
      - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
        description: Servidor de Sandbox
      parameters:
      - $ref: '#/components/parameters/codigoSolicitacao'
      requestBody:
        $ref: '#/components/requestBodies/PagarCobrancaRequest'
      responses:
        '204':
          description: Sucesso no Pagamento
          content: {}
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v3
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/cobranca/v3
      description: Servidor de Sandbox
components:
  parameters:
    dataFinal:
      name: dataFinal
      in: query
      required: true
      schema:
        type: string
        format: date
        description: 'Data de fim do filtro


          Formato aceito: YYYY-MM-DD

          '
    situacao:
      in: query
      name: situacao
      required: false
      schema:
        $ref: '#/components/schemas/SituacaoCobrancaEnum'
    ordenarPor:
      name: ordenarPor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrdenarCobrancasPorEnum'
    cpfCnpjPessoaPagadora:
      name: cpfCnpjPessoaPagadora
      in: query
      required: false
      schema:
        type: string
        title: cpfCnpj da pessoa pagadora
        description: Filtro pelo cpf/cnpj do pagador
        minLength: 1
        maxLength: 18
    codigoSolicitacao:
      name: codigoSolicitacao
      in: path
      description: Código único da cobrança
      required: true
      schema:
        type: string
        format: uuid
    tipoOrdenacao:
      name: tipoOrdenacao
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TipoOrdenacaoCobrancasEnum'
    dataInicial:
      name: dataInicial
      in: query
      required: true
      schema:
        type: string
        format: date
        description: 'Data de vencimento do título


          Formato aceito: YYYY-MM-DD

          '
    xContaCorrente:
      name: x-conta-corrente
      in: header
      description: Conta corrente que será utilizada na operação, caso faça parte da lista de contas correntes da aplicação. Enviar apenas números(incluindo o dígito), e não enviar zeros a esquerda.
      required: false
      schema:
        type: string
        pattern: '[1-9][0-9]*'
    tipoCobranca:
      name: tipoCobranca
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TipoCobrancaEnum'
    paginaAtual:
      in: query
      name: paginacao.paginaAtual
      required: false
      schema:
        type: integer
        format: int32
        title: Página atual
        default: 0
        description: Página a ser retornada pela consulta. Se não for informada, assumirá que será 0.
    filtrarDataPor:
      name: filtrarDataPor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FiltrarDataPorEnum'
    seuNumero:
      name: seuNumero
      in: query
      required: false
      schema:
        type: string
        title: Seu código da cobrança
        description: Filtro pelo código "seu número"
        maxLength: 15
    codigoEdicao:
      name: codigoEdicao
      in: path
      description: Identificador para consultar a edição da cobrança (UUID)
      required: true
      schema:
        type: string
        format: uuid
    itensPorPagina:
      in: query
      name: paginacao.itensPorPagina
      required: false
      schema:
        type: integer
        format: int32
        title: Itens por Página
        maximum: 1000
        default: 100
        description: Quantidade máxima de registros retornados em cada página. Apenas a última página pode conter uma quantidade menor de registros.
    pessoaPagadora:
      name: pessoaPagadora
      in: query
      required: false
      schema:
        type: string
        title: Nome da pessoa pagadora
        description: Filtro pelo nome do pagador
  schemas:
    SituacaoCobrancaEnum:
      type: string
      enum:
      - RECEBIDO
      - A_RECEBER
      - MARCADO_RECEBIDO
      - ATRASADO
      - CANCELADO
      - EXPIRADO
      - FALHA_EMISSAO
      - EM_PROCESSAMENTO
      - PROTESTO
      description: Possíveis situações de uma cobranca.
    MultaTaxa:
      type: object
      required:
      - taxa
      allOf:
      - $ref: '#/components/schemas/Multa'
      properties:
        taxa:
          type: number
          description: 'Taxa Percentual de Multa do título.<br/>

            Máximo de duas casas decimais, valores excedentes são arredondados.<br/>

            Ex: 0.033 -> 0.03 | 0.049 -> 0.05 | 0.335 -> 0.34

            '
    OrigemRecebimentoEnum:
      type: string
      title: Origem do recebimento da cobrança
      enum:
      - BOLETO
      - PIX
    GetStatusUpdateResponseBody:
      type: object
      properties:
        status:
          type: string
          enum:
          - PROCESSANDO
          - SUCESSO
          - FALHA
    TipoCobrancaEnum:
      type: string
      description: Tipos de cobranças existentes.
      enum:
      - SIMPLES
      - PARCELADO
      - RECORRENTE
    OrdenarCobrancasPorEnum:
      type: string
      default: PESSOA_PAGADORA
      enum:
      - PESSOA_PAGADORA
      - TIPO_COBRANCA
      - CODIGO_COBRANCA
      - IDENTIFICADOR
      - DATA_EMISSAO
      - DATA_VENCIMENTO
      - VALOR
      - STATUS
    PagadorBase:
      type: object
      required:
      - cpfCnpj
      - nome
      - tipoPessoa
      - cep
      - endereco
      - cidade
      - uf
      properties:
        cpfCnpj:
          type: string
          description: 'CPF/CNPJ do pagador do título

            '
          minLength: 11
          maxLength: 18
        tipoPessoa:
          type: string
          enum:
          - FISICA
          - JURIDICA
          description: 'Tipo do pagador:

            * `FISICA` - Pessoa Física

            * `JURIDICA` - Pessoa Jurídica

            '
        nome:
          type: string
          description: Nome do pagador
          maxLength: 100
          minLength: 1
        endereco:
          type: string
          description: Endereço do pagador
          maxLength: 100
          minLength: 1
          example: Avenida Brasil
        bairro:
          type: string
          description: Bairro do pagador
          maxLength: 60
          example: Centro
          default: ''
        cidade:
          type: string
          description: Cidade do pagador
          maxLength: 60
          minLength: 1
          example: Belo Horizonte
        uf:
          $ref: '#/components/schemas/EnumUF'
        cep:
          type: string
          description: CEP do pagador
          minLength: 8
          maxLength: 8
          example: '30110000'
    BeneficiarioBase:
