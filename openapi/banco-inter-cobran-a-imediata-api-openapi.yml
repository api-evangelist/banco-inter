    PagarCobrancaPixResponse:
      type: object
      required:
      - e2e
      properties:
        e2e:
          type: string
    Retirada:
      description: "É uma estrutura opcional relacionada ao conceito de recebimento de numerário. Apenas um agrupamento por vez é permitido, quando há `saque` não há `troco` e vice-versa.\n\nQuando uma cobrança imediata tem uma estrutura de `retirada` ela deixa de ser considerada Pix comum e passa à categoria de Pix Saque ou Pix Troco.\n\nPara que o preenchimento do objeto `retirada` seja considerado válido as seguintes regras se aplicam:\n- os campos `modalidadeAgente` e `prestadorDoServicoDeSaque` são de **preenchimento obrigatório**;\n- quando o `saque` estiver presente a cobrança deve respeitar as seguintes condições:\n  - O campo `valor.original` deve ser preenchido com **valor igual a 0.00 (zero)**;\n  - O campo `valor.modalidadeAlteracao` deve possuir o valor 0 (zero) explicitamente, ou implicitamente (pelo não preenchimento).\n- quando o `troco` estiver presente a cobrança deve respeitar as seguintes condições:\n  - O campo `valor.original` deve ser preenchido com **valor maior que 0.00 (zero)**;\n  - O campo `valor.modalidadeAlteracao` deve possuir o valor 0 (zero) explicitamente, ou implicitamente (pelo não preenchimento).\n\n**IMPORTANTE**: Quando usados o `saque` ou `troco` não será permitida a alteração do `valor.original` recebido. Na presença de `saque` ou `troco` o recebimento do campo `valor.modalidadeAlteracao` com valor 1 (um) é considerado erro.\n"
      title: Informações de retirada
      type: object
      properties:
        saque:
          $ref: '#/components/schemas/Saque'
        troco:
          $ref: '#/components/schemas/Troco'
    MakePaymentCobCobv:
      required:
      - qrCode
      - valor
      properties:
        qrCode:
          type: string
          description: URL do pixCopiaECola.
          example: 000201010200661010014BR.GOV.BCB.PIX2009url-exemplo.qrcode.sandbox.co/pj-s/v2/cob/f5c23856e5694ed48607ab0bd0172496520400005309863540550.005802BR5901*6013BELO HORIZONT61089999999962070503***801000014BR.GOV.BCB.PIX2578cdpj-sandbox.partners.uatinter.co/pj-s/v2/rec/60eb10961d744397903cdc376c3ae8a56300288A
        valor:
          type: number
          description: Valor a ser pago.
          example: 100
    PixValorOriginal:
      type: object
      properties:
        original:
          type: object
          required:
          - valor
          properties:
            valor:
              type: string
              title: Valor original
              description: Valor original do Pix.
              pattern: \d{1,10}\.\d{2}
    CobsConsultadas:
      type: object
      title: Cobranças imediatas consultadas
      required:
      - parametros
      - cobs
      properties:
        parametros:
          $ref: '#/components/schemas/ParametrosConsultaCob'
        cobs:
          type: array
          title: Lista de cobranças
          items:
            allOf:
            - $ref: '#/components/schemas/CobCompleta'
            - required:
              - status
              - txid
              - idCob
    Revisao:
      type: integer
      format: int32
      title: Revisão
      description: '# O campo `revisao`


        Denota a revisão da cobrança.  Sempre começa em zero. Sempre varia em acréscimos de 1.


        O incremento em uma cobrança deve ocorrer sempre que um objeto da cobrança em questão for alterado.

        O campo `loc` é uma exceção a esta regra.


        Se em uma determinada alteração em uma cobrança, o único campo alterado for o campo `loc`,

        então esta operação não incrementa a revisão da cobrança.


        O campo `loc` não ocasiona uma alteração na cobrança em si.

        Não é necessário armazenar histórico das alterações do campo `loc` para uma determinada cobrança.

        Para os outros campos da cobrança, registra-se histórico.

        '
      readOnly: true
    PixValorTroco:
      type: object
      properties:
        troco:
          type: object
          required:
          - valor
          - modalidadeAgente
          - prestadorDoServicoDeSaque
          properties:
            valor:
              type: string
              title: Valor do Troco Pix
              description: Valor do Troco Pix.
              pattern: \d{1,10}\.\d{2}
            modalidadeAgente:
              type: string
              title: Modalidade do Agente
              description: '##### Modalidade do Agente

                <table><tr><th>SIGLA</th><th>Descrição</th></tr><tr><td>AGTEC</td><td>Agente Estabelecimento Comercial</td></tr><tr><td>AGTOT</td><td>Agente Outra Espécie de Pessoa Jurídica ou Correspondente no País</td></tr></table>

                '
              enum:
              - AGTEC
              - AGTOT
            prestadorDoServicoDeSaque:
              type: string
              title: Facilitador de Serviço de Saque
              pattern: \d{8}
              description: ISPB do Facilitador de Serviço de Saque
    CobGerada:
      type: object
      title: Cobrança imediata gerada
      description: Dados criados ou alterados da cobrança imediata via API Pix
      required:
      - txid
      - calendario
      - revisao
      - status
      - valor
      - chave
      allOf:
      - type: object
        properties:
          devedor:
            description: 'Não é permitido que o campo devedor.cpf e campo devedor.cnpj estejam preenchidos ao mesmo tempo. Se o campo devedor.nome está preenchido, então deve existir ou um devedor.cpf ou um campo devedor.cnpj preenchido.


              Os campos aninhados sob o objeto devedor são opcionais e identificam a pessoa ou a instituição a quem a cobrança está endereçada. Não identifica, necessariamente, quem irá efetivamente realizar o pagamento.'
            oneOf:
            - $ref: '#/components/schemas/PessoaFisica'
            - $ref: '#/components/schemas/PessoaJuridica'
      - type: object
        properties:
          loc:
            required:
            - id
            - txid
            - tipoCob
            - criacao
            allOf:
            - $ref: '#/components/schemas/PayloadLocation'
      - type: object
        properties:
          location:
            type: string
            title: Localização do payload
            description: Localização do Payload a ser informada na criação da cobrança.
            maxLength: 77
            format: uri
            example: pix.example.com/qr/v2/2353c790eefb11eaadc10242ac120002
            readOnly: true
      - type: object
        properties:
          status:
            type: string
            title: Status da Cobrança
            enum:
            - ATIVA
            - CONCLUIDA
            - REMOVIDA_PELO_USUARIO_RECEBEDOR
            - REMOVIDA_PELO_PSP
      - type: object
        properties:
          valor:
            required:
            - original
            allOf:
            - $ref: '#/components/schemas/CobValor'
      - type: object
        properties:
          calendario:
            required:
            - expiracao
            title: Calendario
            description: Os campos aninhados sob o identificador calendário organizam informações a respeito de controle de tempo da cobrança.
            properties:
              expiracao:
                type: integer
                format: int32
                title: Tempo de vida da cobrança, especificado em segundos.
                description: Tempo de vida da cobrança, especificado em segundos a partir da data de criação (Calendario.criacao)
                default: '86400'
                example: '3600'
              criacao:
                type: string
                format: date-time
                title: Data de Criação
          txid:
            type: string
            pattern: '[a-zA-Z0-9]{26,35}'
          revisao:
            $ref: '#/components/schemas/Revisao'
      - $ref: '#/components/schemas/CobBaseCopiaCola'
    Saque:
      type: object
      title: Saque
      description: Informações relacionadas ao saque
      required:
