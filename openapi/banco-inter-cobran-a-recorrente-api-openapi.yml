openapi: 3.2.0
info:
  title: Banco Inter Cobrança Recorrente API
  version: ''
  description: 'Operations tagged Cobrança Recorrente across 2 of this provider''s published API definitions: swagger-api-pix-automatico-yaml.yaml, banco-inter-pix-automatico-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cdpj.partners.bancointer.com.br/pix/v2
  description: Servidor de Produção
- url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
  description: Servidor de Sandbox
tags:
- name: Cobrança Recorrente
  description: 'Esta seção apresenta os endpoints relacionados ao gerenciamento de cobranças associadas a uma recorrência.


    As cobranças só poderão ser geradas utilizando este endpoint após a recorrência ser autorizada por meio da

    solicitação de recorrência (autorização).


    ---'
paths:
  /cobr:
    post:
      tags:
      - Cobrança Recorrente
      summary: Criar cobrança recorrente
      operationId: cobrPost
      description: 'Endpoint utilizado para gerar as cobranças recorrentes do Pix Automático.


        **Pré-requisitos para criação da cobrança:**

        * A recorrência deve ter sido **aceita pelo pagador**.

        * É permitido criar somente **uma cobrança por ciclo**.


        Um ciclo, é o período de cobrança no Pix Automático, determinado pela data de início e periodicidade (`SEMANAL`, `MENSAL`, `TRIMESTRAL`, `SEMESTRAL` ou `ANUAL`) definidos da recorrência.


        Os ciclos sempre se repetem baseados na data de início da recorrência:


        * Semanal: Mantém o mesmo dia da semana.

        Se começou numa segunda-feira → sempre reinicia às segundas.


        * Mensal, trimestral, semestral e anual: Mantém o mesmo dia do mês.

        Se iniciou no dia 15 → sempre reinicia no dia 15 do próximo ciclo.


        Regra para datas inexistentes: Quando a data esperada não existir no mês, usa-se a data válida imediatamente anterior.

        Exemplo: Recorrência iniciada em 31/01 → próximo ciclo inicia em 28/02


        Exemplos de ciclos


        Semanal


        Ciclo iniciando 05/jan (segunda-feira) reinicia toda segunda-feira


        | Ciclos | Início | Fim |

        |--------|--------|-----|

        | 1º | 05/jan/2026 | 11/jan/2026 |

        | 2º | 12/jan/2026 | 18/jan/2026 |

        | 3º | 19/jan/2026 | 25/jan/2026 |

        | 4º | 26/jan/2026 | 01/fev/2026 |


        Mensal


        Ciclo iniciando todo dia 30 de cada mês


        | **Ciclos** | **Início** | **Fim** |

        |------------|------------|---------|

        | 1º | 30/dez/2025 | 29/jan/2026 |

        | 2º | 30/jan/2026 | 27/fev/2026 |

        | 3º | 28/fev/2026 | 29/mar/2026 |

        | 4º | 30/mar/2026 | 29/abr/2026 |


        Trimestral


        Ciclo iniciando todo dia 01 a cada 3 meses


        | Ciclos | Início | Fim |

        |--------|--------|-----|

        | 1º | 01/jan/2026 | 31/mar/2026 |

        | 2º | 01/abr/2026 | 30/jun/2026 |

        | 3º | 01/jul/2026 | 30/set/2026 |

        | 4º | 01/out/2026 | 31/dez/2026 |


        Semestral


        Ciclo iniciando todo dia 01 a cada 6 meses


        | Ciclos | Início | Fim |

        |--------|--------|-----|

        | 1º | 01/jan/2025 | 30/jun/2025 |

        | 2º | 01/jul/2025 | 31/dez/2025 |

        | 3º | 01/jan/2026 | 30/jun/2026 |

        | 4º | 01/jul/2026 | 31/dez/2026 |


        Anual


        Ciclo iniciando todo dia 01 de janeiro a cada ano


        | Ciclos | Início | Fim |

        |--------|--------|-----|

        | 1º | 01/jan/2025 | 31/dez/2025 |

        | 2º | 01/jan/2026 | 31/dez/2026 |

        | 3º | 01/jan/2027 | 31/dez/2027 |

        | 4º | 01/jan/2028 | 31/dez/2028 |


        * Escopo requerido: cobr.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj.partners.bancointer.com.br/pix/v2/cobr


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobr'
      requestBody:
        $ref: '#/components/requestBodies/CobRBody'
      responses:
        '201':
          description: Cobrança recorrente criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobRGerada'
              examples:
                response1:
                  $ref: '#/components/examples/cobRResponse1'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                requisicao1:
                  $ref: '#/components/examples/OperacaoInvalidaCobRExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    get:
      parameters:
      - $ref: '#/components/parameters/inicio'
      - $ref: '#/components/parameters/fim'
      - $ref: '#/components/parameters/idRecQuery'
      - $ref: '#/components/parameters/cpf'
      - $ref: '#/components/parameters/cnpj'
      - $ref: '#/components/parameters/statusCobr'
      - $ref: '#/components/parameters/paginaAtual'
      - $ref: '#/components/parameters/itensPorPagina'
      - name: convenio
        in: query
        schema:
          type: string
          title: Convênio
          maxLength: 60
          description: Filtro pelo convênio associado.
      tags:
      - Cobrança Recorrente
      summary: Consultar lista de cobranças recorrentes
      operationId: cobrGet
      description: 'Endpoint utilizado para consultar uma lista de cobranças recorrentes através de parâmetros como início, fim, idRec, cpf, cnpj e status.

        Endpoint utilizado para consultar várias cobranças recorrentes.


        Tem por objetivo consultar os dados das cobranças recorrentes como: idRec, txId, valor, status, pix, dentre outros.


        Pode ser chamado passando parâmetros, como: período, CPF, CNPJ, status.


        * Escopo requerido: cobr.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj.partners.bancointer.com.br/pix/v2/cobr


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobr'
      responses:
        '200':
          description: Lista de cobranças recorrentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobsRConsultadas'
              examples:
                retorno1:
                  $ref: '#/components/examples/getCobR1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /cobr/{txid}/retentativa/{data}:
    post:
      tags:
      - Cobrança Recorrente
      summary: Solicitar retentativa de cobrança
      operationId: cobrTxidRetentativaDataPost
      parameters:
      - $ref: '#/components/parameters/txid'
      - $ref: '#/components/parameters/dataLiquidacaoCobr'
      description: 'Endpoint utilizado para solicitar a retentativa de uma cobrança recorrente.


        Caso uma cobrança não seja liquidada na data esperada, e a Política de retentativas da recorrência permita, o recebedor poderá solicitar uma nova tentativa de liquidação.


        Para isso, ele precisa informar o TXID e a data prevista para liquidação da cobrança em questão.


        * Escopo requerido: cobr.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj.partners.bancointer.com.br/pix/v2/cobr/{txid}/retentativa/{data}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobr/{txid}/retentativa/{data}'
      responses:
        '201':
          description: Cobrança recorrente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobRCompleta'
              examples:
                response1:
                  $ref: '#/components/examples/cobRResponse3'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                exemplo1:
                  $ref: '#/components/examples/RequisicaoInvalidaCobRTentativaExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /cobr/{txid}:
    get:
      tags:
      - Cobrança Recorrente
      summary: Consultar cobrança recorrente
      operationId: cobrTxidGet
      parameters:
      - $ref: '#/components/parameters/txid'
      description: 'Endpoint utilizado para consultar uma cobrança recorrente específica.


        O objetivo é obter os dados da cobrança recorrente, como: status, histórico de atualizações, política de retentativa, entre outros.


        * Escopo requerido: cobr.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj.partners.bancointer.com.br/pix/v2/cobr/{txid}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobr/{txid}'
      responses:
        '200':
          description: Dados da cobrança recorrente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobRCompleta'
              examples:
                response1:
                  $ref: '#/components/examples/cobRResponse2'
                response2:
                  $ref: '#/components/examples/cobRResponse3'
                response3:
                  $ref: '#/components/examples/cobRResponse4'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    put:
      tags:
      - Cobrança Recorrente
      summary: Criar cobrança recorrente com TxId
      operationId: cobrTxidPut
      parameters:
      - $ref: '#/components/parameters/txid'
      description: 'Endpoint utilizado para gerar as cobranças recorrentes do Pix Automático, usando um txId específico.


        **Pré-requisitos para criação da cobrança:**

        * A recorrência deve ter sido **aceita pelo pagador**.

        * É permitido criar somente **uma cobrança por ciclo**.


        Um ciclo, é o período de cobrança no Pix Automático, determinado pela data de início e periodicidade (`SEMANAL`, `MENSAL`, `TRIMESTRAL`, `SEMESTRAL` ou `ANUAL`) definidos da recorrência.


        Os ciclos sempre se repetem baseados na data de início da recorrência:


        * Semanal: Mantém o mesmo dia da semana.

        Se começou numa segunda-feira → sempre reinicia às segundas.


        * Mensal, trimestral, semestral e anual: Mantém o mesmo dia do mês.

        Se iniciou no dia 15 → sempre reinicia no dia 15 do próximo ciclo.


        Regra para datas inexistentes: Quando a data esperada não existir

        no mês, usa-se a data válida imediatamente anterior.


        Exemplo: Recorrência iniciada em 31/01 → próximo ciclo inicia em 28/02


        Exemplos de ciclos


        Semanal


        Ciclo iniciando 05/jan (segunda-feira) reinicia toda segunda-feira


        | Ciclos | Início | Fim |

        |--------|--------|-----|

        | 1º | 05/jan/2026 | 11/jan/2026 |

        | 2º | 12/jan/2026 | 18/jan/2026 |

        | 3º | 19/jan/2026 | 25/jan/2026 |

        | 4º | 26/jan/2026 | 01/fev/2026 |


        Mensal


        Ciclo iniciando todo dia 30 de cada mês


        | **Ciclos** | **Início** | **Fim** |

        |------------|------------|---------|

        | 1º | 30/dez/2025 | 29/jan/2026 |

        | 2º | 30/jan/2026 | 27/fev/2026 |

        | 3º | 28/fev/2026 | 29/mar/2026 |

        | 4º | 30/mar/2026 | 29/abr/2026 |


        Trimestral


        Ciclo iniciando todo dia 01 a cada 3 meses


        | Ciclos | Início | Fim |

        |--------|--------|-----|

        | 1º | 01/jan/2026 | 31/mar/2026 |

        | 2º | 01/abr/2026 | 30/jun/2026 |

        | 3º | 01/jul/2026 | 30/set/2026 |

        | 4º | 01/out/2026 | 31/dez/2026 |


        Semestral


        Ciclo iniciando todo dia 01 a cada 6 meses


        | Ciclos | Início | Fim |

        |--------|--------|-----|

        | 1º | 01/jan/2025 | 30/jun/2025 |

        | 2º | 01/jul/2025 | 31/dez/2025 |

        | 3º | 01/jan/2026 | 30/jun/2026 |

        | 4º | 01/jul/2026 | 31/dez/2026 |


        Anual


        Ciclo iniciando todo dia 01 de janeiro a cada ano


        | Ciclos | Início | Fim |

        |--------|--------|-----|

        | 1º | 01/jan/2025 | 31/dez/2025 |

        | 2º | 01/jan/2026 | 31/dez/2026 |

        | 3º | 01/jan/2027 | 31/dez/2027 |

        | 4º | 01/jan/2028 | 31/dez/2028 |


        * Escopo requerido: cobr.write

        rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj.partners.bancointer.com.br/pix/v2/cobr/{txid}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobr/{txid}'
      requestBody:
        $ref: '#/components/requestBodies/CobRBody'
      responses:
        '201':
          description: Cobrança imediata recorrente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobRGerada'
              examples:
                response1:
                  $ref: '#/components/examples/cobRResponse2'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                requisicao1:
                  $ref: '#/components/examples/OperacaoInvalidaCobRExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    patch:
      tags:
      - Cobrança Recorrente
      summary: Cancelar cobrança recorrente
      operationId: cobrTxidPatch
      parameters:
      - $ref: '#/components/parameters/txid'
      description: 'Endpoint utilizado com o objetivo de cancelar uma cobrança recorrente.


        A solicitação de cancelamento de uma cobrança recorrente, de acordo com as diretrizes do Bacen, deve ocorrer antes das 22h00 do dia anterior à data da liquidação da cobrança.

        * Escopo requerido: cobr.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj.partners.bancointer.com.br/pix/v2/cobr/{txid}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobr/{txid}'
      requestBody:
        $ref: '#/components/requestBodies/CobRBodyRevisada'
      responses:
        '200':
          description: Cobrança recorrente revisada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobRGerada'
              examples:
                response1:
                  $ref: '#/components/examples/cobRResponse4'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                exemplo1:
                  $ref: '#/components/examples/OperacaoInvalidaCobRExample2'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /sandbox/cobr/{txId}/status:
    patch:
      tags:
      - Cobrança Recorrente
      summary: Cancelamento de uma cobrança recorrente através de estimulo externo (Sandbox)
      description: 'Endpoint responsável pela mudança de status de uma cobrança recorrente através de estimulo externo.


        (**Exclusivo para o ambiente Sandbox**)


        * Escopo requerido: cobr.write

        * rate limit:


        * 10 chamadas por minuto


        *Obs : O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/sandbox/cobr/{txid}/status'
      operationId: changeStatusCobr
      parameters:
      - $ref: '#/components/parameters/txid'
      requestBody:
        $ref: '#/components/requestBodies/ChangeStatusCobrRequestBody'
      responses:
        '200':
          description: Recorrência atualizada com sucesso.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /sandbox/cobr/pagamento:
    post:
      tags:
      - Cobrança Recorrente
      summary: Pagar cobrança recorrente (Sandbox)
      description: 'Endpoint para pagar uma cobrança recorrente.


        (**Exclusivo para o ambiente Sandbox**)


        * Escopo requerido: cobr.write

        * rate limit:


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/sandbox/cobr/pagamento'
      operationId: makePaymentCobr
      requestBody:
        $ref: '#/components/requestBodies/MakePaymentCobrRequestBody'
      responses:
        '200':
          description: pagamento realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MakePaymentCobrResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
components:
  schemas:
    Problema:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI de referência que identifica o tipo de problema. De acordo com a RFC 7807.
          example: https://pix.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: Descrição resumida do problema.
          example: Not found
        status:
          type: integer
          description: Código HTTP do status retornado.
          example: 404
        detail:
          type: string
          description: Descrição completa do problema.
        correlationId:
          type: string
          description: Identificador de correlação do problema para fins de suporte
        violacoes:
          type: array
          items:
            $ref: '#/components/schemas/Violacao'
    DevolucaoNaturezaPixAutomatico:
      type: string
      title: Natureza da Devolução
      description: "Indica qual é a natureza da devolução. Uma devolução pode ser relacionada a um Pix comum (com códigos possíveis: `MD06` e `FR01` da pacs.004 e `REFU` da pacs.008). Na ausência deste campo a natureza deve ser interpretada como\nsendo de um Pix comum (`ORIGINAL`).\n\nAs naturezas são assim definidas:\n  - `ORIGINAL`: quando a devolução é solicitada pelo usuário recebedor e se refere a um Pix comum (`MD06`);\n  - `MED_FRAUDE`: quando a devolução ocorre no âmbito do MED (Mecanismo Especial de Devolução) por fundada suspeita de fraude e se refere a um Pix comum (`FR01`).\n  - `MED_PIX_AUTOMATICO`: reembolso total ou parcial ao participante do usuário pagador no âmbito do MED (Mecanismo Especial de Devolução) para o Pix Automático pela utilização de recursos próprios para ressarcimento do usuário pagador.(`REFU`);\n\nOs valores de devoluções são sempre limitados aos valores máximos a seguir:\n- Pix comum: o valor da devolução é limitado ao valor do próprio Pix (a natureza nesse caso pode ser: ORIGINAL, MED_PIX_AUTOMATICO ou MED_FRAUDE);\n"
      enum:
      - ORIGINAL
      - MED_PIX_AUTOMATICO
      - MED_FRAUDE
    Paginacao:
      type: object
      title: Paginação
      required:
      - paginaAtual
      - itensPorPagina
      - quantidadeDePaginas
      - quantidadeTotalDeItens
      properties:
        paginaAtual:
          type: integer
          title: Página atual
          description: Número da página recuperada.
          minimum: 0
        itensPorPagina:
          type: integer
          title: Itens por página
          description: Quantidade de registros retornado na página.
          minimum: 1
        quantidadeDePaginas:
          type: integer
          title: Quantidade de páginas
          description: Quantidade de páginas disponíveis para consulta.
          minimum: 1
        quantidadeTotalDeItens:
          type: integer
          title: Quantidade total de itens
          description: Quantidade total de itens disponíveis de acordo com os parâmetros informados.
          minimum: 0
    TxId:
      type: string
      title: Id da Transação
      description: '# Identificador da transação


        O campo txid determina o identificador da transação.

        O objetivo desse campo é ser um elemento que possibilite ao PSP do recebedor apresentar ao usuário recebedor a funcionalidade de conciliação de pagamentos.


        O txid é criado exclusivamente pelo usuário recebedor e está sob sua responsabilidade.

        O txid, no contexto de representação de uma cobrança, é único por CPF/CNPJ do usuário recebedor.

        '
      pattern: '[a-zA-Z0-9]{26,35}'
    CobRRevisada:
      type: object
      title: Cobrança Recorrente Revisada
      description: Dados enviados para revisão da cobrança recorrente via API Pix
      allOf:
      - $ref: '#/components/schemas/CobRStatusRevisada'
    ParametrosConsultaCobR:
      type: object
      title: Parâmetros de Consulta de Cobrança
      description: Parâmetros utilizados para a realização de uma consulta de cobranças.
      required:
      - inicio
      - fim
      - paginacao
      properties:
        inicio:
          type: string
          format: date-time
          title: Data de Início
          description: Data inicial utilizada na consulta. Respeita RFC 3339.
          example: '2020-04-01T00:00:00.000Z'
        fim:
          type: string
          format: date-time
          title: Data de Fim
          description: Data de fim utilizada na consulta. Respeita RFC 3339.
          example: '2020-04-01T17:00:00.000Z'
        idRec:
          $ref: '#/components/schemas/RecId'
        cpf:
          type: string
          title: CPF
          pattern: \d{11}
          description: Filtro pelo CPF do devedor. Não pode ser utilizado ao mesmo tempo que o CNPJ.
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: Filtro pelo CNPJ do devedor. Não pode ser utilizado ao mesmo tempo que o CPF.
        status:
          type: string
          title: Status do registro da cobrança
          description: Filtro pelo status das cobranças.
        recebedor:
          type: object
          title: Recebedor
          properties:
            convenio:
              type: string
              title: Convênio
              description: Convênio entre usuário e participante recebedor.
              maxLength: 60
        paginacao:
          $ref: '#/components/schemas/Paginacao'
    CobREncerramento:
      type: object
      title: Detalhamento do encerramento da cobrança.
      description: Contendo `cancelamento` ou `rejeicao`
      properties:
        cancelamento:
          $ref: '#/components/schemas/CobRCancelamento'
        rejeicao:
          $ref: '#/components/schemas/CobRRejeicao'
    DevolucaoId:
      type: string
      title: Id da Devolução
      description: Id gerado pelo cliente para representar unicamente uma devolução.
      pattern: '[a-zA-Z0-9]{1,35}'
    CobRStatusRevisada:
      type: object
      title: Status da Cobrança Recorrente
      properties:
        status:
          type: string
          title: Status do registro da cobrança
          enum:
          - CANCELADA
    CobRCompleta:
      type: object
      title: Cobrança Recorrente Completa
      required:
      - idRec
      - txid
      - status
      - valor
      - recebedor
      - calendario
      description: Dados completos da cobrança recorrente via API Pix
      allOf:
      - type: object
        properties:
          idRec:
            $ref: '#/components/schemas/RecId'
      - type: object
        properties:
          txid:
            $ref: '#/components/schemas/TxId'
      - $ref: '#/components/schemas/CobRBase'
      - type: object
        properties:
          calendario:
            $ref: '#/components/schemas/CobrCalendario'
      - $ref: '#/components/schemas/CobRStatus'
      - $ref: '#/components/schemas/CobRConfiguracao'
      - $ref: '#/components/schemas/DadosDevedorRecorrencia'
      - type: object
        properties:
          pix:
            type: array
            title: Pix recebidos
            description: Contendo `endToEndId`, `txid`, `valor`, `horario`, `infoPagador` e `devolucoes`
            items:
              $ref: '#/components/schemas/PixAutomatico'
      - $ref: '#/components/schemas/CobRAtualizacao'
      - $ref: '#/components/schemas/CobRTentativas'
    CobRStatus:
      type: object
      title: Status da Cobrança Recorrente
      properties:
        status:
          type: string
          title: Status do registro da cobrança
          description: 'Status da cobrança recorrente:

            - `CRIADA`: A cobrança foi criada pelo usuário recebedor

            - `ATIVA`: O PSP Pagador recebeu e aceitou a cobrança, agendando o pagamento

            - `CONCLUIDA`: A cobrança foi paga com sucesso

            - `EXPIRADA`: A cobrança não foi liquidada após todas as tentativas de pagamento permitidas

            - `REJEITADA`: A cobrança foi rejeitada pelo PSP Pagador

            - `CANCELADA`: A cobrança foi cancelada com sucesso

            '
          enum:
          - CRIADA
          - ATIVA
          - CONCLUIDA
          - EXPIRADA
          - REJEITADA
          - CANCELADA
    MakePaymentCobrResponse:
      required:
      - endToEnd
      properties:
        endToEnd:
          type: string
          example: E00416968202406141552CmNRIqASznP
    CobRConfiguracao:
      type: object
      title: Configuração da Cobrança Recorrente
      required:
      - politicaRetentativa
      properties:
        politicaRetentativa:
          type: string
          title: Política de retentativa da cobrança recorrente
          description: 'NAO_PERMITE: Não permite retentativas.</br> PERMITE_3R_7D: Permite até 3 retentativas em dias diferentes no intervalo de até 7 dias corridos contados a partir da data de liquidação prevista na instrução de pagamento original.</br> As retentativas devem ser enviadas pelo recebedor. [Consulte a documentação](#tag/Cobranca-Recorrente/operation/cobrTxidRetentativaDataPost)'
          enum:
          - NAO_PERMITE
          - PERMITE_3R_7D
    CobRBaseCalendario:
      type: object
      title: Informações sobre calendário da cobrança
      description: Contendo `dataDeVencimento`
      required:
      - dataDeVencimento
      properties:
        dataDeVencimento:
          type: string
          format: date
          title: Data de vencimento da cobrança
          description: Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601. É a data de expiração da cobrança.
          example: '2023-04-01T00:00:00.000Z'
    PessoaJuridicaRecorrencia:
      type: object
      description: Contendo `nome`, `CNPJ` e `convenio` do recebedor.
      required:
      - nome
      - cnpj
      title: Pessoa Jurídica
      properties:
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: CNPJ do usuário.
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 140
    EndToEndId:
      type: string
      title: Id fim a fim da transação
      description: Id único para identificação do Pix Cobrança.
      pattern: '[a-zA-Z0-9]{32}'
    DadosDevedorRecorrencia:
      type: object
      properties:
        devedor:
          title: Dados do devedor
          description: Contendo `email`, `logradouro`, `cidade`, `uf` e `cep`
          properties:
            email:
              type: string
              title: Email
              description: Email do usuário.
            logradouro:
              type: string
              title: Logradouro
              description: Logradouro do usuário.
              maxLength: 200
            cidade:
              type: string
              title: Cidade
              description: Cidade do usuário.
              maxLength: 200
            uf:
              type: string
              title: UF
              description: UF do usuário.
              maxLength: 2
            cep:
              type: string
              title: CEP
              description: CEP do usuário.
              pattern: '[0-9]{8}'
    DadosBancariosRecebedor:
      type: object
      title: Dados bancários do recebedor
      description: Contendo `nome`, `cnpj`, `conta`, `tipoConta` e `agencia`
      required:
      - conta
      - tipoConta
      properties:
        conta:
          type: string
          description: Número da conta do usuário recebedor.
          maxLength: 20
        tipoConta:
          type: string
          title: Tipo da conta do usuário recebedor
          description: Tipo da conta do usuário recebedor.
          enum:
          - CORRENTE
          - POUPANCA
          - PAGAMENTO
        agencia:
          type: string
          description: Número da agência do usuário recebedor.
          maxLength: 4
    CobRCancelamento:
      type: object
      title: Informações sobre o cancelamento da cobrança
      required:
      - solicitante
      - codigo
      - descricao
      description: Informações sobre o cancelamento da cobrança
      properties:
        solicitante:
          type: string
          title: Solicitante do cancelamento
          description: 'Identifica quem solicitou o cancelamento:

            - `PSP_PAGADOR`: Cancelamento solicitado pelo PSP do pagador

            - `USUARIO_PAGADOR`: Cancelamento solicitado pelo usuário pagador

            - `PSP_RECEBEDOR`: Cancelamento solicitado pelo PSP do recebedor

            - `USUARIO_RECEBEDOR`: Cancelamento solicitado pelo usuário recebedor

            '
          enum:
          - PSP_PAGADOR
          - USUARIO_PAGADOR
          - PSP_RECEBEDOR
          - USUARIO_RECEBEDOR
        codigo:
          type: string
          title: Código do cancelamento
          description: 'Código do cancelamento. ACCT: Encerramento de uma conta transacional. BLCK: Bloqueio de uma conta transacional. CCLD: Cancelamento da autorização para pagamentos periódicos. FAIL: Cancelamento do agendamento por falha ou erro no fluxo de liquidação. OTHR: Cancelamento por outros motivos. SLBD: Solicitado pelo usuário pagador. SLCR: Solicitado pelo usuário destinatário.'
          maxLength: 4
          enum:
          - ACCT
          - BLCK
          - CCLD
          - FAIL
          - OTHR
          - SLBD
          - SLCR
        descricao:
          type: string
          title: Descricao do cancelamento
          description: Descricao da causa do cancelamento
          maxLength: 105
    CobsRConsultadas:
      type: object
      title: Cobranças recorrentes consultadas
      required:
      - parametros
      - cobsr
      properties:
        parametros:
          $ref: '#/components/schemas/ParametrosConsultaCobR'
        cobsr:
          type: array
          title: Lista de cobranças
          items:
            $ref: '#/components/schemas/CobRCompleta'
    MakePaymentCobr:
      required:
      - valor
      - cpfCnpj
      - txId
      - chave
      properties:
        valor:
          type: number
          example: 100
        cpfCnpj:
          type: string
          example: 9008007006
        txId:
          type: string
          example: 33beb661beda44a8928fef47dbeb2dc5
        chave:
          type: string
          example: '12345678901'
    CobRBaseValor:
      type: object
      title: Valor da cobrança recorrente
      required:
      - original
      description: Contendo `valorOriginal`
      properties:
        original:
          type: string
          title: Valor
          pattern: \d{1,10}\.\d{2}
          description: Valor original da cobrança.
    CobRRejeicao:
      type: object
      title: Informações sobre a rejeição da cobrança
      required:
      - codigo
      - descricao
      description: Informações sobre a rejeição da cobrança
      properties:
        codigo:
          type: string
          title: Código da rejeição
          description: 'Código da rejeição:<br> - **AB10**: Transação interrompida devido a erro no participante do usuário pagador.<br> - **AC05**: Conta transacional do usuário pagador encerrada.<br> - **AC06**: Conta transacional do usuário pagador bloqueada.<br> - **AG12**: Não é permitida solicitação de agendamento (pain.013) cujos recursos sejam transferidos de uma  conta transacional para outra em uma mesma instituição participante ou entre participantes que utilizem o serviço de liquidação de um mesmo participante liquidante no SPI.<br> - **AM02**: Valor da cobrança ultrapassa o valor máximo estabelecido pelo usuário pagador.<br> - **AM09**: Valor da cobrança não corresponde ao valor estabelecido na recorrência.<br> - **DENC**: CPF/CNPJ do usuário pagador não corresponde ao dado contido na recorrência/autorização.<br> - **DS27**: Participante não se encontra cadastrado ou ainda não iniciou a operação no SPI.<br> - **DTED**: Divergência entre a data de vencimento informada e a periodicidade da recorrência e/ou as regras do produto.<br> - **DTNT**: Novas tentativas de agendamento pós vencimento em desacordo com o limite de dias definido na  regra de negócio (a partir de D+8, considerando D0, a data do vencimento).<br> - **FBRD**: Pain.013 recebida fora do prazo para cumprimento das regras do negócio.<br> - **IRNT**: Cobrança recorrente não permite novas tentativas de agendamento pós vencimento (idRecorrencia  com característica que não permite novas tentativas).<br> - **MIDI**: idRecorrencia inexistente ou incorreto.<br> - **MSUC**: statusRecorrencia diferente de (CFDB - confirmado pelo usuário pagador).<br> - **NIEC**: Nova instrução de pagamento inválida pois a mesma cobrança já possui ordem de pagamento agendada ainda pendente de envio ao SPI para liquidação.<br> - **NIPA**: Nova instrução de pagamento inválida, pagamento já foi efetivado.<br> - **NITX**: Nova instrução de pagamento não corresponde a uma cobrança recorrente gerada anteriormente.<br> (IdConciliacaoDoRecebedor diferentes). Utilizada somente para as finalidades de agendamento ''NTAG'' e ''RIFL''.<br> - **QUNT**: Quantidade de novas tentativas de agendamento pós vencimento excede o limite definido pela regra de negócio (mais de 3 tentativas em intervalo de 7 dias após o vencimento, considerando D0, a data do vencimento).<br> - **RC09**: ISPB do participante do usuário pagador inválido ou inexistente.<br> - **UDEI**: CPF/CNPJ do devedor incorreto.'
          maxLength: 4
          enum:
          - AB10
          - AC05
          - AC06
          - AG12
          - AM02
          - AM09
          - DENC
          - DS27
          - DTED
          - DTNT
          - FBRD
          - IRNT
          - MIDI
          - MSUC
          - NIEC
          - NIPA
          - NITX
          - QUNT
          - RC09
          - UDEI
        descricao:
          type: string
          title: Descricao da rejeição
          description: Descricao da causa da rejeição
          maxLength: 105
    DevolucaoPixAutomatico:
      type: object
      title: Devolução
      required:
      - id
      - rtrId
      - valor
      - horario
      - status
      properties:
        id:
          $ref: '#/components/schemas/DevolucaoId'
        rtrId:
          type: string
          title: RtrId
          description: ReturnIdentification que transita na PACS004.
          example: D12345678202009091000abcde123456
          pattern: '[a-zA-Z0-9]{32}'
          minLength: 32
          maxLength: 32
        valor:
          type: string
          title: Valor a devolver.
          pattern: \d{1,10}\.\d{2}
          description: Valor a devolver.
        natureza:
          $ref: '#/components/schemas/DevolucaoNaturezaPixAutomatico'
        descricao:
          type: string
          title: Mensagem ao pagador relativa à devolução.
          maxLength: 140
          description: O campo `descricao`, opcional, determina um texto a ser apresentado ao pagador contendo informações sobre a devolução. Esse texto será preenchido, na pacs.004, pelo PSP do recebedor, no campo RemittanceInformation. O tamanho do campo na pacs.004 está limitado a 140 caracteres.
        horario:
          type: object
          title: Horário da devolução
          description: Contendo `solicitacao` e `liquidacao`
          properties:
            solicitacao:
              type: string
              format: date-time
              title: Horário de solicitação
              description: Horário no qual a devolução foi solicitada no PSP.
            liquidacao:
              type: string
              format: date-time
              title: Horário de liquidacao
              description: Horário no qual a devolução foi liquidada no PSP.
        status:
          type: string
          title: Status
          description: Status da devolução.
          enum:
          - EM_PROCESSAMENTO
          - DEVOLVIDO
          - NAO_REALIZADO
        motivo:
          type: string
          title: Descrição do status.
          description: '# Status da Devolução


            Campo opcional que pode ser utilizado pelo PSP recebedor para detalhar os motivos

            de a devolução ter atingido o status em questão.

            Pode ser utilizado, por exemplo, para detalhar o motivo de a devolução não ter sido realizada.

            '
          maxLength: 140
    CobRTentativas:
      type: object
      title: Histórico de Tentativas da Cobrança Recorrente
      properties:
        tentativas:
          type: array
          title: Histórico de Tentativas de Cobrança
          description: Histórico de Tentativas de Cobrança
          items:
            type: object
            required:
            - dataLiquidacao
            - tipo
            - endToEndId
            - status
            - atualizacao
            properties:
              dataLiquidacao:
                type: string
                format: date
                description: Data da liquidação da cobrança. Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601.
                example: '2023-04-01T00:00:00.000Z'
              tipo:
                type: string
                title: Tipo da Tentativa
                description: AGND - Agendamento do débito original.</br> NTAG - Agendamento de nova tentativa após o vencimento.</br> RIFL - Reenvio da instrução de pagamento devido a erro na liquidação.
                enum:
                - AGND
                - NTAG
                - RIFL
              status:
                type: string
                title: Status da Tentativa
                description: 'Status da tentativa da cobrança:

                  - `SOLICITADA`: Cobrança agendada mas não paga até a data de vencimento.

                  - `AGENDADA`: O PSP Pagador recebeu e aceitou a cobrança, agendando o pagamento.

                  - `PAGA`: A cobrança foi paga com sucesso.

                  - `CANCELADA`: A cobrança foi cancelada com sucesso.

                  - `REJEITADA`: A cobrança foi rejeitada pelo PSP Pagador.

                  - `EXPIRADA`: A cobrança não foi liquidada após todas as tentativas de pagamento permitidas.

                  '
                enum:
                - SOLICITADA
                - AGENDADA
                - PAGA
                - CANCELADA
                - REJEITADA
                - EXPIRADA
              endToEndId:
                $ref: '#/components/schemas/EndToEndId'
              atualizacao:
                type: array
                title: Histórico de Status da Tentativa
                description: Histórico das mudanças de status da tentativa de cobrança.
                items:
                  type: object
                  required:
                  - status
                  - data
                  properties:
                    status:
                      type: string
                      title: Status da Tentativa
                      description: 'Status da tentativa da cobrança:

                        - `SOLICITADA`: Cobrança agendada mas não paga até a data de vencimento.

                        - `AGENDADA`: O PSP Pagador recebeu e aceitou a cobrança, agendando o pagamento.

                        - `PAGA`: A cobrança foi paga com sucesso.

                        - `CANCELADA`: A cobrança foi cancelada com sucesso.

                        - `REJEITADA`: A cobrança foi rejeitada pelo PSP Pagador.

                        - `EXPIRADA`: A cobrança não foi liquidada após todas as tentativas de pagamento permitidas.

                        '
                      enum:
                      - SOLICITADA
                      - AGENDADA
                      - PAGA
                      - CANCELADA
                      - REJEITADA
                      - EXPIRADA
                    data:
                      type: string
                      format: date-time
                      description: Data e hora do registro de status atualizado. Respeita RFC 3339.
              rejeicao:
                type: object
                title: Informações sobre a rejeição da tentativa da cobrança
                required:
                - codigo
                - descricao
                description: Informações sobre a rejeição da tentativa da cobrança
                properties:
                  codigo:
                    type: string
                    title: Código da rejeição da tentativa
                    description: 'Código da rejeição:<br> - **AB10**: Transação interrompida devido a erro no participante do usuário pagador.<br> - **AC05**: Conta transacional do usuário pagador encerrada.<br> - **AC06**: Conta transacional do usuário pagador bloqueada.<br> - **AM02**: Valor da cobrança ultrapassa o valor máximo estabelecido pelo usuário pagador.<br> - **AM09**: Valor da cobrança não corresponde ao valor estabelecido na recorrência.<br> - **DENC**: CPF/CNPJ do usuário pagador não corresponde ao dado contido na recorrência/autorização.<br> - **DS27**: Participante não se encontra cadastrado ou ainda não iniciou a operação no SPI.<br> - **DTED**: Divergência entre a data de vencimento informada e a periodicidade da recorrência e/ou as regras do produto.<br> - **DTNT**: Novas tentativas de agendamento pós vencimento em desacordo com o limite de dias definido na  regra de negócio (a partir de D+8, considerando D0, a data do vencimento).<br> - **FBRD**: Pain.013 recebida fora do prazo para cumprimento das regras do negócio.<br> - **IRNT**: Cobrança recorrente não permite novas tentativas de agendamento pós vencimento (idRecorrencia  com característica que não permite novas tentativas).<br> - **MIDI**: idRecorrencia inexistente ou incorreto.<br> - **MSUC**: statusRecorrencia diferente de (CFDB - confirmado pelo usuário pagador).<br> - **NIEC**: Nova instrução de pagamento inválida pois a mesma cobrança já possui ordem de pagamento agendada ainda pendente de envio ao SPI para liquidação.<br> - **NIPA**: Nova instrução de pagamento inválida, pagamento já foi efetivado.<br> - **NITX**: Nova instrução de pagamento não corresponde a uma cobrança recorrente gerada anteriormente.<br> (IdConciliacaoDoRecebedor diferentes). Utilizada somente para as finalidades de agendamento ''NTAG'' e ''RIFL''.<br> - **QUNT**: Quantidade de novas tentativas de agendamento pós vencimento excede o limite definido pela regra de negócio (mais de 3 tentativas em intervalo de 7 dias após o vencimento, considerando D0, a data do vencimento).<br> - **RC09**: ISPB do participante do usuário pagador inválido ou inexistente.<br> - **UDEI**: CPF/CNPJ do devedor incorreto.'
                    maxLength: 4
                    enum:
                    - AB10
                    - AC05
                    - AC06
                    - AM02
                    - AM09
                    - DENC
                    - DS27
                    - DTED
                    - DTNT
                    - FBRD
                    - IRNT
                    - MIDI
                    - MSUC
                    - NIEC
                    - NIPA
                    - NITX
                    - QUNT
                    - RC09
                    - UDEI
                  descricao:
                    type: string
                    title: Descrição da rejeição
                    description: Descrição da causa da rejeição
                    maxLength: 105
    CobRSolicitada:
      type: object
      title: Cobrança Recorrente Solicitada
      required:
      - idRec
      - calendario
      - valor
      - recebedor
      description: Dados enviados para criação da cobrança recorrente via API Pix
      allOf:
      - type: object
        properties:
          idRec:
            $ref: '#/components/schemas/RecId'
      - $ref: '#/components/schemas/CobRBase'
      - $ref: '#/components/schemas/DadosDevedorRecorrencia'
      - type: object
        properties:
          devedor:
            title: Informações sobre o devedor da cobrança recorrente
            description: Contendo `email`, `logradouro`, `cidade`, `uf` e `cep`
    CobrCalendario:
      type: object
      required:
      - criacao
      allOf:
      - $ref: '#/components/schemas/CobRBaseCalendario'
      description: Contendo `dataDeVencimento` e `criacao`
      properties:
        criacao:
          type: string
          format: date
          title: Data de criação da cobrança
          description: Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601. É a data de criação da cobrança.
          example: '2023-04-01T00:00:00.000Z'
    Violacao:
      type: object
      title: Violações
      properties:
        razao:
          type: string
          title: Descrição do erro
          description: Descrição do erro
          example: Valor da cobrança não pode ser 0.00
        propriedade:
          type: string
          title: Nome da propriedade
          description: Nome da propriedade
          example: cob.chave
        valor:
          type: string
          title: Valor da propriedade
          description: Valor da propriedade
          example: 61996671234
    RecId:
      type: string
      title: ID Recorrência
      description: "# Identificador da Recorrência\n\nRegra de formação:\n\n  - RAxxxxxxxxyyyyMMddzzzzzzzzzzz (29 caracteres; \"case sensitive\", isso\né, diferencia letras maiúsculas e minúsculas), sendo:\n  - \"R\":  fixo (1 caractere). \"R\" para a recorrência criada dentro do\nPix;\n  - \"A\": identificação da possibilidade de novas tentativas, sendo\npossíveis os valores \"R\" ou \"N\" (1 caractere). \"R\" caso a recorrência permita novas tentativas de pagamento pós vencimento, ou \"N\" caso não permita novas tentativas.\n  - \"xxxxxxxx\":  identificação do agente que presta serviço para o\nusuário recebedor que gerou o <Id>, podendo ser: o ISPB do participante direto, o ISPB do participante indireto ou os 8 primeiros dígitos do CNPJ do prestador de serviço de iniciação (8 caracteres numéricos [0-9]);\n  - \"yyyyMMdd\":  data (8 caracteres) de criação da recorrência;\n  - \"zzzzzzzzzzz\": sequencial criado pelo agente que gerou o <Id>\n(11 caracteres alfanuméricos [a-z|A-Z|0-9]). Deve ser único dentro de cada \"yyyyMMdd\".\nDessa forma, o ID da recorrência deve ser formado de acordo com um dos tipos a seguir:\n- \"RRxxxxxxxxyyyyMMddzzzzzzzzzzz\"; para recorrência criada dentro do Pix e que permite novas tentativas de pagamento pós vencimento; ou\n- \"RNxxxxxxxxyyyyMMddzzzzzzzzzzz\"; para recorrência criada dentro do Pix e que não permite novas tentativas de pagamento pós vencimento.\n"
      pattern: '[a-zA-Z0-9]{29}'
      minLength: 29
      maxLength: 29
      example: RR1234567820240115abcdefghijk
