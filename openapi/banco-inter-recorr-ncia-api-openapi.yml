          description: Contendo `nome` e `cpf` ou `cnpj`
          required:
          - nome
          - cpf
          - cnpj
          oneOf:
          - type: object
            title: nome e CPF
            properties:
              nome:
                type: string
                title: Nome
                description: Nome do devedor.
                maxLength: 140
              cpf:
                type: string
                title: CPF
                pattern: \d{11}
                description: CPF do devedor.
          - type: object
            title: nome e CNPJ
            properties:
              nome:
                type: string
                title: Nome
                description: Nome do devedor.
                maxLength: 140
              cnpj:
                type: string
                title: CNPJ
                pattern: \d{14}
                description: CNPJ do devedor.
        contrato:
          type: string
          title: Objeto da autorização
          description: Número, identificador, ou código que representa o objeto da autorização (contrato, pedido etc.).
          maxLength: 35
    RecCompletaPesquisada:
