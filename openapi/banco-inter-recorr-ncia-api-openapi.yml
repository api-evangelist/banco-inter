            description: Solicitações vinculadas às recorrências.
            items:
              $ref: '#/components/schemas/SolicRecCompleta'
      - $ref: '#/components/schemas/RecAtivacao'
      - type: object
        properties:
          dadosQR:
            $ref: '#/components/schemas/DadosQRCode'
    RecSolicitada:
      type: object
      title: Recorrência Solicitada
      description: Atributos de Configuração de Recorrência
      allOf:
      - $ref: '#/components/schemas/RecBase'
      - $ref: '#/components/schemas/RecConfiguracao'
      - type: object
        properties:
          loc:
            $ref: '#/components/schemas/PayloadLocationRecId'
      - $ref: '#/components/schemas/RecAtivacaoSolicitada'
    CPF:
      type: string
      title: CPF
      pattern: \\d{11}
      description: CPF do usuário.
    RecAtualizacao:
      type: object
      title: Histórico de atualização da recorrência.
      required:
      - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status
          description: Contendo `status`e `data`.
          items:
            type: object
            required:
            - status
            - data
            properties:
              status:
                type: string
                title: Status da recorrência
                description: 'Status da recorrência:

                  - `CRIADA`: Recorrência criada, aguardando aprovação do pagador

                  - `APROVADA`: Recorrência aprovada pelo pagador e ativa

                  - `REJEITADA`: Recorrência rejeitada pelo pagador

                  - `EXPIRADA`: Recorrência expirou sem aprovação

                  - `CANCELADA`: Recorrência cancelada pelo recebedor ou pagador

                  '
                enum:
                - CRIADA
                - APROVADA
                - REJEITADA
                - EXPIRADA
                - CANCELADA
              data:
                type: string
                format: date-time
                description: Data e hora do registro de status atualizado. Respeita RFC 3339.
    RecPayload:
      type: object
      title: Payload da Recorrência
      required:
      - idRec
      - atualizacao
      - recebedor
      description: 'Atributos de Configuração de Recorrência:


        `vinculo`, `calendario`, `valor`, `idRec`, `recebedor`, `politicaRetentativa` e `atualizacao`'
      allOf:
      - $ref: '#/components/schemas/RecBase'
      - type: object
        properties:
          idRec:
            $ref: '#/components/schemas/RecId'
      - type: object
        properties:
          recebedor:
            type: object
            required:
            - nome
            - cnpj
            - ispbParticipante
            title: Recebedor
            description: Dados do recebedor `cnpj`, `nome` e `ispbParticipante`
            properties:
              cnpj:
                type: string
                title: CNPJ
                pattern: \d{14}
                description: CNPJ do usuário.
              nome:
                type: string
                title: Nome
                description: Nome do usuário.
                maxLength: 140
              ispbParticipante:
                type: string
                title: ISPB do usuário recebedor.
                description: ISPB do usuário recebedor.
                pattern: \d{8}
      - $ref: '#/components/schemas/RecConfiguracao'
      - $ref: '#/components/schemas/RecAtualizacao'
    RecConfiguracao:
      type: object
      title: Configuração da Recorrência
      required:
      - politicaRetentativa
      properties:
        politicaRetentativa:
          type: string
          title: Política de retentativa pós vencimento da recorrência
          description: 'NAO_PERMITE: Não permite retentativas.</br> PERMITE_3R_7D: Permite até 3 retentativas em dias diferentes no intervalo de até 7 dias corridos contados a partir da data de liquidação prevista na instrução de pagamento original.</br> As retentativas devem ser enviadas pelo recebedor. [Consulte a documentação](#tag/Cobranca-Recorrente/operation/cobrTxidRetentativaDataPost)'
          enum:
          - NAO_PERMITE
          - PERMITE_3R_7D
    Problema:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
