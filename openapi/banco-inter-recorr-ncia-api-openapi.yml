      description: Identificador da localização do payload completo.
      required:
      - id
      - location
      - tipo
      - criacao
      properties:
        id:
          $ref: '#/components/schemas/PayloadLocationRecId'
        location:
          type: string
          title: Localização do payload
          description: Localização do Payload a ser informada na criação da recorrência.
          maxLength: 77
          format: uri
          example: pix.example.com/qr/v2/rec/2353c790eefb11eaadc10242ac120002
          readOnly: true
        criacao:
          type: string
          format: date-time
          title: Data de Criação
          description: Data e hora em que a location foi criada. Respeita RFC 3339.
          readOnly: true
    SolicRecAtualizacao:
      type: object
      title: Histórico de Status da Solicitação de Recorrência
      required:
      - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status da Solicitação de Recorrência
          description: Contendo `status`e `data`
          items:
            type: object
            required:
            - status
            - data
            properties:
              status:
                type: string
                title: Status do registro da solicitação de recorrência
                description: 'Status da solicitação de recorrência:

                  - `CRIADA`: Solicitação criada, aguardando envio

                  - `ENVIADA`: Solicitação enviada ao pagador

                  - `RECEBIDA`: Solicitação recebida pelo pagador

                  - `REJEITADA`: Solicitação rejeitada pelo pagador

                  - `ACEITA`: Solicitação aceita pelo pagador

                  - `EXPIRADA`: Solicitação expirou sem resposta

                  - `CANCELADA`: Solicitação cancelada

                  '
                enum:
                - CRIADA
                - ENVIADA
                - RECEBIDA
                - REJEITADA
                - ACEITA
                - EXPIRADA
                - CANCELADA
              data:
                type: string
                format: date-time
                description: Data e hora do registro de status atualizado. Respeita RFC 3339.
    ParametrosConsultaRec:
      type: object
