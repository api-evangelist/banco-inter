              $ref: '#/components/schemas/SolicRecCompleta'
      - $ref: '#/components/schemas/RecAtivacao'
    SolicRecId:
      type: object
      title: Id da Solicitação de recorrência
      required:
      - idSolicRec
      description: Dados criados ou alterados da cobrança recorrente via API Pix
      properties:
        idSolicRec:
          type: string
          title: ID Solicitação da Recorrência
          description: "# Identificador da Solicitação da Recorrência\n\nRegra de formação:\n- SCxxxxxxxxyyyyMMddzzzzzzzzzzz (29 caracteres; “case sensitive”, isso é, diferencia letras maiúsculas e minúsculas), sendo:\n  - SC - fixo (2 caracteres);\n  - xxxxxxxx – ISPB do agente que envia a mensagem pain.009 de\nsolicitação de confirmação da recorrência;\n  - yyyyMMdd – data (8 caracteres) de criação da mensagem pain.009\nde solicitação de confirmação da recorrência;\n  - zzzzzzzzzzz – sequencial criado pelo agente que gerou a\nmensagem de solicitação de confirmação da recorrência (11 caracteres alfanuméricos [a-z|A-Z|0-9]). Deve ser único dentro de cada “yyyyMMdd”.\n"
          pattern: '[a-zA-Z0-9]{29}'
          minLength: 29
          maxLength: 29
          example: SC1234567820240115abcdefghijk
    SolicRecCompleta:
      type: object
      title: Solicitação de Recorrência Completa
      required:
      - rec
      description: Dados criados ou alterados da solicitação da recorrência
      allOf:
      - $ref: '#/components/schemas/SolicRecBase'
      - $ref: '#/components/schemas/SolicRecId'
      - $ref: '#/components/schemas/SolicRecStatus'
      - $ref: '#/components/schemas/SolicRecAtualizacao'
      - type: object
        properties:
          recPayload:
            $ref: '#/components/schemas/RecPayload'
    PayloadLocationRecGerada:
      type: object
