          example: '2020-04-01T17:00:00.000Z'
        cpf:
          type: string
          title: CPF
          pattern: \d{11}
          description: Filtro pelo CPF do devedor. Não pode ser utilizado ao mesmo tempo que o CNPJ.
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: Filtro pelo CNPJ do devedor. Não pode ser utilizado ao mesmo tempo que o CPF.
        locationPresente:
          type: boolean
          description: Filtro pela existência de location vinculada.
        status:
          type: string
          description: 'Filtro pelo status das recorrências:

            - `CRIADA`: Recorrência criada, aguardando aprovação do pagador

            - `APROVADA`: Recorrência aprovada pelo pagador e ativa

            - `REJEITADA`: Recorrência rejeitada pelo pagador

            - `EXPIRADA`: Recorrência expirou sem aprovação

            - `CANCELADA`: Recorrência cancelada pelo recebedor ou pagador

            '
          title: Status do registro da recorrência
          enum:
          - CRIADA
          - APROVADA
          - REJEITADA
          - EXPIRADA
          - CANCELADA
        recebedor:
          type: object
          title: Recebedor
          properties:
            convenio:
              type: string
              title: Convênio
              description: Convênio entre usuário e participante recebedor.
              maxLength: 60
        paginacao:
          $ref: '#/components/schemas/Paginacao'
    Violacao:
      type: object
