  parameters:
    locationPresente:
      name: locationPresente
      in: query
      schema:
        type: boolean
    txidQuery:
      name: txid
      in: query
      schema:
        $ref: '#/components/schemas/TxId'
    cpf:
      name: cpf
      in: query
      schema:
        type: string
        title: CPF
        description: Filtro pelo CPF do devedor. Não pode ser utilizado ao mesmo tempo que o CNPJ.
    statusRec:
      name: status
      in: query
      schema:
        type: string
        title: Status do registro da recorrência
        description: 'Filtro pelo status da recorrência:

          - `CRIADA`: Recorrência criada, aguardando aprovação do pagador

          - `APROVADA`: Recorrência aprovada pelo pagador e ativa

          - `REJEITADA`: Recorrência rejeitada pelo pagador

          - `EXPIRADA`: Recorrência expirou sem aprovação

          - `CANCELADA`: Recorrência cancelada pelo recebedor ou pagador

          '
        enum:
        - CRIADA
        - APROVADA
        - REJEITADA
        - EXPIRADA
        - CANCELADA
    fim:
      in: query
      name: fim
      required: true
      x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm:ss[.SSS]XXX
      example: '2023-03-30T12:09:00Z'
      description: 'Formato: yyyy-MM-dd''T''HH:mm:ss[.SSS]XXX'
      schema:
        type: string
        format: date-time
        title: Data de fim
        description: Filtra os registros cuja data de criação seja menor ou igual que a data de fim.
    xContaCorrente:
      name: x-conta-corrente
      in: header
      description: Conta corrente que será utilizada na operação. Necessário somente quando a aplicação estiver associada a mais de uma conta corrente. Enviar apenas números (incluindo o dígito), e não enviar zeros a esquerda.
      schema:
        type: string
        pattern: '[1-9][0-9]*'
    paginaAtual:
      in: query
      name: paginacao.paginaAtual
      required: false
      schema:
        type: integer
        format: int32
        title: Página atual
        default: 0
        description: Página a ser retornada pela consulta. Se não for informada, o PSP assumirá que será 0.
    cnpj:
      name: cnpj
      in: query
      schema:
        type: string
        title: CNPJ
        description: Filtro pelo CNPJ do devedor. Não pode ser utilizado ao mesmo tempo que o CPF.
    idRec:
      name: idRec
      in: path
      required: true
      schema:
        type: string
        title: Id Recorrência
    inicio:
      in: query
      name: inicio
      required: true
      x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm:ss[.SSS]XXX
      example: '2023-02-30T12:09:00Z'
      description: 'Formato: yyyy-MM-dd''T''HH:mm:ss[.SSS]XXX'
      schema:
        type: string
        format: date-time
        title: Data de início
        description: Filtra os registros cuja data de criação seja maior ou igual que a data de início.
    itensPorPagina:
      in: query
      name: paginacao.itensPorPagina
      required: false
      schema:
        type: integer
