  parameters:
    status:
      in: query
      name: status
      schema:
        type: string
        title: Situação da Cobrança
        enum:
        - ATIVA
        - CONCLUIDA
        - REMOVIDA_PELO_USUARIO_RECEBEDOR
        - REMOVIDA_PELO_PSP
      description: 'Estado do registro da cobrança. Não se confunde com o estado da cobrança em si, ou seja, não guarda relação com o fato de a cobrança encontrar-se vencida ou expirada, por exemplo.


        Os status são assim definidos:

        - `ATIVA`: indica que o registro se refere a uma cobrança que foi gerada mas ainda não foi paga nem removida;

        - `CONCLUIDA`: indica que o registro se refere a uma cobrança que já foi paga e, por conseguinte, não pode acolher outro pagamento;

        - `REMOVIDO_PELO_USUARIO_RECEBEDOR`: indica que o usuário recebedor solicitou a remoção do registro da cobrança; e

        - `REMOVIDO_PELO_PSP`: indica que o PSP Recebedor solicitou a remoção do registro da cobrança.

        '
    txid:
      name: txid
      in: path
      required: true
      description: 'O campo txid determina o identificador da transação.


        O txid é criado exclusivamente pelo usuário recebedor e está sob sua responsabilidade. O txid, no contexto de representação de uma cobrança, é único por CPF/CNPJ do usuário recebedor.'
      schema:
        type: string
        pattern: '[a-zA-Z0-9]{26,35}'
    locationPresente:
      name: locationPresente
      in: query
      schema:
        type: boolean
    cpf:
      name: cpf
      in: query
      schema:
        type: string
        title: CPF
        description: Filtro pelo CPF do devedor. Não pode ser utilizado ao mesmo tempo que o CNPJ.
    fim:
      in: query
      name: fim
      required: true
      x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm:ss[.SSS]XXX
      example: '2023-03-30T12:09:00Z'
      description: 'Formato: yyyy-MM-dd''T''HH:mm:ss[.SSS]XXX'
      schema:
        type: string
        format: date-time
        title: Data de fim
        description: Filtra os registros cuja data de criação seja menor ou igual que a data de fim.
    loteCobVId:
      in: query
      name: loteCobVId
      schema:
        type: integer
        format: int32
        title: Id do lote de cobrança com vencimento
        description: Id do lote de cobrança com vencimento.
    xContaCorrente:
      name: x-conta-corrente
      in: header
      description: Conta corrente que será utilizada na operação. Necessário somente quando a aplicação estiver associada a mais de uma conta corrente. Enviar apenas números (incluindo o dígito), e não enviar zeros a esquerda.
      schema:
        type: string
        pattern: '[1-9][0-9]*'
    paginaAtual:
      in: query
      name: paginacao.paginaAtual
      required: false
      schema:
        type: integer
        format: int32
        title: Página atual
        default: 0
        description: Página a ser retornada pela consulta. Se não for informada, o PSP assumirá que será 0.
    cnpj:
      name: cnpj
      in: query
      schema:
        type: string
        title: CNPJ
        description: Filtro pelo CNPJ do devedor. Não pode ser utilizado ao mesmo tempo que o CPF.
    inicio:
      in: query
      name: inicio
      required: true
      x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm:ss[.SSS]XXX
      example: '2023-02-30T12:09:00Z'
      description: 'Formato: yyyy-MM-dd''T''HH:mm:ss[.SSS]XXX'
      schema:
        type: string
        format: date-time
        title: Data de início
        description: Filtra os registros cuja data de criação seja maior ou igual que a data de início.
    itensPorPagina:
      in: query
      name: paginacao.itensPorPagina
      required: false
      schema:
        type: integer
        format: int32
        title: Itens por Página
        maximum: 1000
        default: 100
        description: Quantidade máxima de registros retornados em cada página. Apenas a última página pode conter uma quantidade menor de registros.
