openapi: 3.2.0
info:
  title: Banco Inter Cobrança com Vencimento API
  version: ''
  description: 'Operations tagged Cobrança com Vencimento across 2 of this provider''s published API definitions: swagger-api-pix-yaml.yaml, banco-inter-pix-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cdpj.partners.bancointer.com.br/pix/v2
  description: Servidor de Produção
- url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
  description: Servidor de Sandbox
tags:
- name: Cobrança com Vencimento
paths:
  /cobv/{txid}:
    put:
      summary: Criar cobrança com vencimento
      description: 'Endpoint para criar uma cobrança com vencimento.


        Na cobrança com vencimento é possível parametrizar uma data de vencimento e com isso o pagamento pode ser realizado em data futura,

        pode também incluir outras informações como juros, multas, outros acréscimos, descontos e outros abatimentos, semelhante ao boleto.


        * Escopo requerido: cobv.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/cobv/{txid}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobv/{txid}'
      tags:
      - Cobrança com Vencimento
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/txid'
      requestBody:
        $ref: '#/components/requestBodies/CobVBody'
      responses:
        '201':
          description: Cobrança com vencimento criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobVGerada'
              examples:
                retorno1:
                  $ref: '#/components/examples/cobResponse4'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                exemplo1:
                  $ref: '#/components/examples/RequisicaoInvalidaCobVExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      operationId: putCobvByTxid
      x-operation-id-source: derived
    patch:
      summary: Revisar cobrança com vencimento
      description: 'Endpoint para revisar uma cobrança com vencimento.


        * Escopo requerido: cobv.write

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/cobv/{txid}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobv/{txid}'
      tags:
      - Cobrança com Vencimento
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/txid'
      requestBody:
        $ref: '#/components/requestBodies/CobVBodyRevisada'
      responses:
        '200':
          description: Cobrança com vencimento revisada. A revisão deve ser incrementada em 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobVGerada'
              examples:
                retorno1:
                  $ref: '#/components/examples/cobResponse4'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                exemplo1:
                  $ref: '#/components/examples/OperacaoInvalidaCobVExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      operationId: patchCobvByTxid
      x-operation-id-source: derived
    get:
      summary: Consultar cobrança com vencimento
      description: 'Endpoint para consultar uma cobrança com vencimento através de um determinado txid.


        * Escopo requerido: cobv.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/cobv/{txid}


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobv/{txid}'
      tags:
      - Cobrança com Vencimento
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/txid'
      responses:
        '200':
          description: Dados da cobrança com vencimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobVCompleta'
              examples:
                retorno1:
                  $ref: '#/components/examples/cobResponse4'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      operationId: getCobvByTxid
      x-operation-id-source: derived
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /cobv:
    get:
      summary: Consultar lista de cobranças com vencimento
      description: 'Endpoint para consultar cobranças com vencimento através de parâmetros como início, fim, cpf, cnpj e status.


        * Escopo requerido: cobv.read

        * rate limit:


        * 120 chamadas por minuto


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/pix/v2/cobv


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobv'
      tags:
      - Cobrança com Vencimento
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/inicio'
      - $ref: '#/components/parameters/fim'
      - $ref: '#/components/parameters/cpf'
      - $ref: '#/components/parameters/cnpj'
      - $ref: '#/components/parameters/locationPresente'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/paginaAtual'
      - $ref: '#/components/parameters/itensPorPagina'
      - $ref: '#/components/parameters/loteCobVId'
      responses:
        '200':
          description: Lista de cobranças com vencimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobsVConsultadas'
              examples:
                getCobs1:
                  $ref: '#/components/examples/getCobsV1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      operationId: getCobv
      x-operation-id-source: derived
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  /cobv/pagar/{txid}:
    post:
      summary: Pagar Pix de cobrança com vencimento (Sandbox)
      description: 'Endpoint para pagar uma cobrança com vencimento via Pagamento Pix.


        (**Exclusivo para o ambiente Sandbox**)


        * Escopo requerido: pix.write

        * rate limit:


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/cobv/pagar/{txid}'
      tags:
      - Cobrança com Vencimento
      parameters:
      - $ref: '#/components/parameters/txid'
      requestBody:
        $ref: '#/components/requestBodies/PagarCobrancaPixBody'
      responses:
        '201':
          description: Cobrança com vencimento Pix paga com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarCobrancaPixResponse'
              examples:
                retorno1:
                  $ref: '#/components/examples/pagarPixCobResponse1'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      servers:
      - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
        description: Servidor de Sandbox
      operationId: postCobvPagarByTxid
      x-operation-id-source: derived
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
  / sandbox/cob/pagamento:
    post:
      tags:
      - Cobrança com Vencimento
      summary: Pagar cobrança com vencimento utilizando QRCode (Sandbox)
      description: 'Endpoint para pagar uma cobrança com vencimento utilizando QRCode.


        (**Exclusivo para o ambiente Sandbox**)


        * Escopo requerido: pix.write

        * rate limit:


        * 10 chamadas por minuto


        *Obs: O token tem validade de 60 minutos e deverá ser reutilizado nas requisições.*


        https://cdpj-sandbox.partners.uatinter.co/pix/v2/sandbox/cob/pagamento'
      operationId: makePaymentCobCobv
      requestBody:
        $ref: '#/components/requestBodies/MakePaymentCobCobvRequestBody'
      responses:
        '200':
          description: pagamento realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MakePaymentCobCobvResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/pix/v2
      description: Servidor de Produção
    - url: https://cdpj-sandbox.partners.uatinter.co/pix/v2
      description: Servidor de Sandbox
components:
  schemas:
    TxId:
      type: string
      title: Id da Transação
      description: '# Identificador da transação


        O campo txid determina o identificador da transação.

        O objetivo desse campo é ser um elemento que possibilite ao PSP do recebedor apresentar ao usuário recebedor a funcionalidade de conciliação de pagamentos.


        O txid é criado exclusivamente pelo usuário recebedor e está sob sua responsabilidade.

        O txid, no contexto de representação de uma cobrança, é único por CPF/CNPJ do usuário recebedor.

        '
      pattern: '[a-zA-Z0-9]{26,35}'
    PixValorJuros:
      type: object
      properties:
        juros:
          type: object
          required:
          - valor
          properties:
            valor:
              type: string
              title: Valor relativo aos juros.
              description: Valor dos juros.
              pattern: \d{1,10}\.\d{2}
    EndToEndId:
      type: string
      title: Id fim a fim da transação
      description: Id único para identificação do Pix Cobrança.
      pattern: '[a-zA-Z0-9]{32}'
    PixValorDesconto:
      type: object
      properties:
        desconto:
          type: object
          required:
          - valor
          properties:
            valor:
              type: string
              title: Valor relativo a desconto.
              description: Valor do desconto.
              pattern: \d{1,10}\.\d{2}
    PayloadLocationId:
      type: integer
      format: int64
      title: Id da location
      description: Identificador da location a ser informada na criação da cobrança .
    Pix:
      type: object
      title: Pix
      required:
      - endToEndId
      - valor
      - horario
      - pagador
      properties:
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        txid:
          allOf:
          - $ref: '#/components/schemas/TxId'
          - pattern: '[a-zA-Z0-9]{1,35}'
        valor:
          type: string
          title: Valor do Pix.
          pattern: \d{1,10}\.\d{2}
          description: Valor do Pix.
        componentesValor:
          type: object
          title: Informações sobre o valor do Pix
          description: "O objetivo dessa estrutura é explicar os elementos de composição do valor do Pix, incluindo informações sobre as multas, juros, descontos e abatimentos quando o Pix for relativo a cobranças com vencimento.\n\nRegras da estrutura:\n- O valor do Pix é igual a:\n  - (original.valor + saque.valor + troco.valor) + multa.valor + juros.valor – abatimento.valor – desconto.valor considerando-se apenas os campos que estiverem presentes para cada tipo de cobrança pago.\n- As estruturas saque e troco só serão retornadas quando o Pix for relativo a um Pix Saque ou Pix Troco, respectivamente, e as demais estruturas (juros, multa, abatimento e desconto) só serão pertinentes aos Pix de pagamentos das cobranças com vencimento.\n- Não pode haver simultaneamente uma subsestrutura do tipo saque e outra do tipo troco;\n- Não há restrição na ordem das subestruturas.\n\nPara o caso de um Pix Saque pode-se retornar original com valor=0.00 (zero) uma vez que a soma será respeitada, ou pode-se omitir a subestrutura original.\nNo caso de um Pix Troco ou de um pagamento de cobrança com vencimento a subsestrutura original vai sempre estar presente.\n\n#### Exemplos válidos:\nExemplo de preenchimentos válidos.\n\n- **Pix para pagamento de cobrança imediata (sem saque ou troco).**\n  ```\n  ...\n  \"componentesValor\": {\n    \"original\": {\n      \"valor\": \"100.00\"\n    }\n  }\n  ...\n  ```\n- **Pix Saque.**\n  ```\n  ...\n  \"componentesValor\": {\n    \"saque\": {\n      \"valor\": \"100.00\",\n      \"modalidadeAgente\": \"AGPSS\",\n      \"prestadorDeServicoDeSaque\": \"12345678\"\n    }\n  }\n  ...\n  ```\n- **Pix para pagamento de cobrança imediata com saque (pode vir original.valor=0.00).**\n  ```\n  ...\n  \"componentesValor\": {\n    \"original\": {\n      \"valor\": \"0.00\"\n    },\n    \"saque\": {\n      \"valor\": \"100.00\",\n      \"modalidadeAgente\": \"AGPSS\",\n      \"prestadorDeServicoDeSaque\": \"12345678\"\n    }\n  }\n  ...\n  ```\n- **Pix Troco.**\n  ```\n  ...\n  \"componentesValor\": {\n    \"original\": {\n      \"valor\": \"80.00\"\n    },\n    \"troco\": {\n      \"valor\": \"20.00\",\n      \"modalidadeAgente\": \"AGTEC\",\n      \"prestadorDeServicoDeSaque\": \"12345678\"\n    }\n  }\n  ...\n  ```\n- **Pix para pagamento de cobrança imediata com troco (ordem não importa).**\n  ```\n  ...\n  \"componentesValor\": {\n    \"troco\": {\n      \"valor\": \"20.00\",\n      \"modalidadeAgente\": \"AGTEC\",\n      \"prestadorDeServicoDeSaque\": \"12345678\"\n    },\n    \"original\": {\n      \"valor\": \"80.00\"\n    }\n  }\n  ...\n  ```\n- **Pix para pagamento de cobrança com vencimento de R$100,00 considerando-se um atraso de 2 dias a uma multa de 3% e juros de 1% ao dia. O valor do Pix será R$105,00.**\n  ```\n  ...\n  \"componentesValor\": {\n    \"original\": {\n      \"valor\": \"100.00\"\n    },\n    \"multa\": {\n      \"valor\": \"3.00\"\n    },\n    \"juros\": {\n      \"valor\": \"2.00\"\n    }\n  }\n  ...\n  ```\n#### Exemplos inválidos:\nExemplos, não exaustivos, de preenchimentos inválidos.\n- **`original.valor` maior que 0.00 (zero) e `saque` juntos**\n  ```\n  ...\n  \"componentesValor\": {\n    \"original\": {\n      \"valor\": \"80.00\"\n    },\n    \"saque\": {\n      \"valor\": \"20.00\",\n      \"modalidadeAgente\": \"AGPSS\",\n      \"prestadorDeServicoDeSaque\": \"12345678\"\n    }\n  }\n  ...\n  ```\n- **dois elementos de `saque`**\n  ```\n  ...\n  \"componentesValor\": [\n    \"saque\": {\n      \"valor\": \"20.00\",\n      \"modalidadeAgente\": \"AGPSS\",\n      \"prestadorDeServicoDeSaque\": \"12345678\"\n    },\n    \"saque\": {\n      \"valor\": \"10.00\",\n      \"modalidadeAgente\": \"AGPSS\",\n      \"prestadorDeServicoDeSaque\": \"12345678\"\n    }\n  ]\n  ...\n  ```\n- **saque e troco simultaneamente**\n  ```\n  ...\n  \"componentesValor\": {\n    \"original\": {\n      \"valor\": \"60.00\"\n    },\n    \"saque\": {\n      \"valor\": \"20.00\",\n      \"modalidadeAgente\": \"AGPSS\",\n      \"prestadorDeServicoDeSaque\": \"12345678\"\n    },\n    \"troco\": {\n      \"valor\": \"20.00\",\n      \"modalidadeAgente\": \"AGTEC\",\n      \"prestadorDeServicoDeSaque\": \"12345678\"\n    }\n  }\n  ...\n  ```"
          anyOf:
          - $ref: '#/components/schemas/PixValorOriginal'
          - $ref: '#/components/schemas/PixValorSaque'
          - $ref: '#/components/schemas/PixValorTroco'
          - $ref: '#/components/schemas/PixValorJuros'
          - $ref: '#/components/schemas/PixValorMulta'
          - $ref: '#/components/schemas/PixValorAbatimento'
          - $ref: '#/components/schemas/PixValorDesconto'
        chave:
          type: string
          title: Chave DICT do recebedor
          description: '# Formato do campo chave


            * Campo chave do recebedor conforme atribuído na respectiva PACS008.

            * Os tipos de chave podem ser: telefone, e-mail, cpf/cnpj ou EVP.

            * O formato das chaves pode ser encontrado na seção "Formatação das chaves do DICT no BR Code" do [Manual de Padrões para iniciação do Pix](https://www.bcb.gov.br/estabilidadefinanceira/pagamentosinstantaneos).

            '
          maxLength: 77
        horario:
          type: string
          format: date-time
          title: Horário
          description: Horário em que o Pix foi processado no PSP.
        infoPagador:
          type: string
          title: Informação livre do pagador
          maxLength: 140
        devolucoes:
          type: array
          title: Devoluções
          items:
            $ref: '#/components/schemas/Devolucao'
    TipoLocationCobEnum:
      type: string
      title: Tipo da cobrança
      enum:
      - cob
      - cobv
    CobVCompleta:
      title: Cobrança com vencimento completa
      required:
      - status
      allOf:
      - $ref: '#/components/schemas/CobVGerada'
      - $ref: '#/components/schemas/CobVSolicitada'
      - type: object
        properties:
          pix:
            type: array
            title: Pix recebidos
            items:
              $ref: '#/components/schemas/Pix'
      - type: object
        properties:
          status:
            type: string
            title: Status da Cobrança
            enum:
            - ATIVA
            - CONCLUIDA
            - REMOVIDA_PELO_USUARIO_RECEBEDOR
            - REMOVIDA_PELO_PSP
    MakePaymentCobCobvResponse:
      required:
      - endToEnd
      properties:
        endToEnd:
          type: string
          example: E00416968202406141552CmNRIqASznP
    PessoaJuridicaCobV:
      type: object
      required:
      - nome
      - cnpj
      title: Pessoa Jurídica
      properties:
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 200
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: CNPJ do usuário.
        email:
          type: string
          title: Email
          description: Email do usuário.
        logradouro:
          type: string
          title: Logradouro
          description: Logradouro do usuário.
          maxLength: 200
        cidade:
          type: string
          title: Cidade
          description: Cidade do usuário.
          maxLength: 200
        uf:
          type: string
          title: UF
          description: UF do usuário.
          maxLength: 2
        cep:
          type: string
          title: CEP
          description: CEP do usuário.
          pattern: '[0-9]{1,8}'
    Paginacao:
      type: object
      title: Paginação
      required:
      - paginaAtual
      - itensPorPagina
      - quantidadeDePaginas
      - quantidadeTotalDeItens
      properties:
        paginaAtual:
          type: integer
          title: Página atual
          description: Número da página recuperada.
          minimum: 0
        itensPorPagina:
          type: integer
          title: Itens por página
          description: Quantidade de registros retornado na página.
          minimum: 1
        quantidadeDePaginas:
          type: integer
          title: Quantidade de páginas
          description: Quantidade de páginas disponíveis para consulta.
          minimum: 1
        quantidadeTotalDeItens:
          type: integer
          title: Quantidade total de itens
          description: Quantidade total de itens disponíveis de acordo com os parâmetros informados.
          minimum: 0
    PessoaJuridica:
      type: object
      required:
      - cnpj
      - nome
      title: Pessoa Jurídica
      properties:
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 200
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: CNPJ do usuário.
    CobVDataVencimento:
      type: object
      title: Data de Vencimento
      required:
      - dataDeVencimento
      properties:
        dataDeVencimento:
          type: string
          title: Data de vencimento da cobrança
          format: date
          description: Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601. É a data de vencimento da cobrança. A cobrança pode ser honrada até esse dia, inclusive, em qualquer horário do dia.
          example: '2020-04-01'
        validadeAposVencimento:
          type: integer
          format: int32
          title: Validade após vencimento
          description: 'Trata-se da quantidade de dias corridos após calendario.dataDeVencimento,

            em que a cobrança poderá ser paga.


            Aplica-se este campo sobre o vencimento original da cobrança acrescentando-se o

            número de dias corridos nos quais a cobrança ainda poderá ser paga, após vencida.

            Este valor não se sobrepõe à possibilidade de pagamento em data posterior ao vencimento

            original por [força de lei](http://www.planalto.gov.br/ccivil_03/LEIS/L7089.htm).

            Nesse sentido, um vencimento determinado para um dia não útil deverá ser acatado

            no primeiro dia útil subsequente mesmo que exceda o número de dias definido neste campo.


            Para ilustrar o funcionamento, seguem alguns exemplos:


            Exemplo A:


            ```txt

            dataDeVencimento: 2020-10-20, terça-feira.

            validadeAposVencimento: 4


            Tenta-se pagar no dia 2020-10-23, sexta: aceito.

            Tenta-se pagar no dia 2020-10-24, sábado: aceito.

            Tenta-se pagar no dia 2020-10-25, domingo: negado.

            ```


            Exemplo B:


            ```txt

            dataDeVencimento: 2020-12-25, sexta-feira, feriado.

            validadeAposVencimento: 0


            Tenta-se pagar no dia 2020-12-25, sexta: aceito.

            Tenta-se pagar no dia 2020-12-26, sábado: aceito.

            Tenta-se pagar no dia 2020-12-27, domingo: aceito.

            Tenta-se pagar no dia 2020-12-28, segunda: aceito.

            Tenta-se pagar no dia 2020-12-29, terça: negado.

            ```


            Exemplo C:


            ```txt

            dataDeVencimento: 2020-12-25, sexta-feira, feriado.

            validadeAposVencimento: 1


            Tenta-se pagar no dia 2020-12-25, sexta: aceito.

            Tenta-se pagar no dia 2020-12-26, sábado: aceito.

