openapi: 3.2.0
info:
  title: Banco Inter Boletos API
  version: ''
  description: 'Operations tagged Boletos across 2 of this provider''s published API definitions: swagger-cobranca-yaml.yaml, banco-inter-cobranca-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cdpj.partners.bancointer.com.br/cobranca/v2
  description: Servidor de Produção
tags:
- name: Boletos
paths:
  /boletos:
    post:
      summary: Emitir boleto de cobrança
      description: 'Método utilizado para emitir um novo boleto registrado.


        O boleto emitido estará disponível para consulta e pagamento, após um tempo apróximado de 5 minutos da sua inclusão. Esse tempo é necessário para o registro do boleto na CIP.


        * Escopo requerido: boleto-cobranca.write

        * rate limit: 120 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v2/boletos'
      tags:
      - Boletos
      operationId: incluirBoleto
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      requestBody:
        description: Corpo do boleto
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/incluiBoletoRequest'
            examples:
              exemplo1:
                $ref: '#/components/examples/incluiBoletoRequestExample'
        required: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/incluiBoletoResponse'
              examples:
                exemplo1:
                  $ref: '#/components/examples/incluiBoletoResponseExample'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      x-codegen-request-body-name: body
    get:
      summary: Recuperar coleção de boletos
      description: 'Método utilizado para recuperar uma coleção de Boletos por um período

        específico, de acordo com os parâmetros informados.


        * Escopo requerido: boleto-cobranca.read

        * rate limit: 120 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v2/boletos'
      tags:
      - Boletos
      operationId: pesquisarBoletos
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/dataInicial'
      - $ref: '#/components/parameters/dataFinal'
      - $ref: '#/components/parameters/filtrarDataPor'
      - $ref: '#/components/parameters/situacao'
      - $ref: '#/components/parameters/nome'
      - $ref: '#/components/parameters/email'
      - $ref: '#/components/parameters/cpfCnpj'
      - $ref: '#/components/parameters/itensPorPagina'
      - $ref: '#/components/parameters/paginaAtual'
      - $ref: '#/components/parameters/ordenarPor'
      - $ref: '#/components/parameters/tipoOrdenacao'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletosPageResponse'
              examples:
                exemplo1:
                  $ref: '#/components/examples/consultaBoletosResponseExample'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v2
      description: Servidor de Produção
  /boletos/sumario:
    get:
      summary: Recuperar sumário de boletos
      description: 'Utilizado para recuperar o sumário de uma coleção de Boletos por um período

        específico, de acordo com os parâmetros informados.


        * Escopo requerido: boleto-cobranca.read

        * rate limit: 120 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v2/boletos/sumario'
      tags:
      - Boletos
      operationId: consultarSumario
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/dataInicial'
      - $ref: '#/components/parameters/dataFinal'
      - $ref: '#/components/parameters/filtrarDataPor'
      - $ref: '#/components/parameters/situacao'
      - $ref: '#/components/parameters/nome'
      - $ref: '#/components/parameters/email'
      - $ref: '#/components/parameters/cpfCnpj'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sumarioResponse'
              examples:
                exemplo1:
                  $ref: '#/components/examples/consultaSumarioResponseExample'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v2
      description: Servidor de Produção
  /boletos/{nossoNumero}:
    get:
      summary: Recuperar boleto detalhado
      description: 'Recupera um boleto detalhado de acordo com o parâmetro nossoNumero informado.


        * Escopo requerido: boleto-cobranca.read

        * rate limit: 120 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v2/boletos/{nossoNumero}'
      tags:
      - Boletos
      operationId: consultarBoleto
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/nossoNumero'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/boletoResponse'
              examples:
                exemplo1:
                  $ref: '#/components/examples/consultaBoletoResponseExample'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v2
      description: Servidor de Produção
  /boletos/{nossoNumero}/pdf:
    get:
      summary: Recuperar boleto em PDF
      description: 'Recupera um boleto em pdf de acordo com o parâmetro nossoNumero informado.


        * Escopo requerido: boleto-cobranca.read

        * rate limit: 120 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v2/boletos/{nossoNumero}/pdf'
      tags:
      - Boletos
      operationId: descarregarPdfBoleto
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/nossoNumero'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v2
      description: Servidor de Produção
  /boletos/{nossoNumero}/cancelar:
    post:
      summary: Cancelar boleto
      description: 'Realiza o cancelamento de um boleto.


        * Escopo requerido: boleto-cobranca.write

        * rate limit: 120 chamadas por minuto


        Exemplos de código


        https://cdpj.partners.bancointer.com.br/cobranca/v2/boletos/{nossoNumero}/cancelar'
      tags:
      - Boletos
      operationId: baixarBoleto
      parameters:
      - $ref: '#/components/parameters/xContaCorrente'
      - $ref: '#/components/parameters/nossoNumero'
      requestBody:
        description: Corpo do boleto
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/baixaBoletoRequest'
        required: true
      responses:
        '204':
          description: Sucesso
          content: {}
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel'
      x-codegen-request-body-name: body
    servers:
    - url: https://cdpj.partners.bancointer.com.br/cobranca/v2
      description: Servidor de Produção
components:
  schemas:
    Problema:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI de referência que identifica o tipo de problema. De acordo com a RFC 7807.
          example: https://boleto.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: Descrição resumida do problema.
          example: Not found
        status:
          type: integer
          description: Código HTTP do status retornado.
          example: 404
        detail:
          type: string
          description: Descrição completa do problema.
    baixaBoletoRequest:
      type: object
      required:
      - motivoCancelamento
      properties:
        motivoCancelamento:
          type: string
          description: 'Domínio que descreve o tipo de cancelamento sendo solicitado.

            * `ACERTOS` (cancelado por acertos)

            * `APEDIDODOCLIENTE` (cancelado a pedido do cliente)

            * `PAGODIRETOAOCLIENTE` (cancelado por ter sido pago direto ao cliente)

            * `SUBSTITUICAO` (cancelado por substituição)

            '
          example: ACERTOS
    enumUF:
      type: string
      enum:
      - AC
      - AL
      - AP
      - AM
      - BA
      - CE
      - DF
      - ES
      - GO
      - MA
      - MT
      - MS
      - MG
      - PA
      - PB
      - PR
      - PE
      - PI
      - RJ
      - RN
      - RS
      - RO
      - RR
      - SC
      - SP
      - SE
      - TO
      description: UF
      example: MG
    boletoResponse:
      type: object
      properties:
        nomeBeneficiario:
          type: string
          description: 'Nome do beneficiário.

            '
        cnpjCpfBeneficiario:
          type: string
          description: 'CNPJ do beneficiário.

            '
        tipoPessoaBeneficiario:
          type: string
          description: 'Tipo do beneficiário.

            '
        contaCorrente:
          type: string
          description: 'Conta corrente do boleto emitido

            '
        nossoNumero:
          type: string
          description: 'Identificador único do boleto emitido.

            '
        seuNumero:
          type: string
          description: 'Campo seuNumero do boleto emitido.

            '
        pagador:
          $ref: '#/components/schemas/pagador'
        motivoCancelamento:
          type: string
          description: 'Motivo do Cancelamento.

            '
        situacao:
          type: string
          description: 'Situacao do boleto.

            '
        dataHoraSituacao:
          type: string
          description: 'Data referente à situação do boleto.

            Formato aceito: YYYY-MM-DD

            '
        dataVencimento:
          type: string
          description: 'Data referente ao vencimento do boleto.

            Formato aceito: YYYY-MM-DD

            '
        valorNominal:
          type: number
          description: 'Valor Nominal do boleto.

            '
        valorTotalRecebimento:
          type: number
          description: 'Valor Total Recebimento.

            '
        dataEmissao:
          type: string
          description: 'Data referente à emissão do boleto.

            Formato aceito: YYYY-MM-DD

            '
        dataLimite:
          type: string
          description: 'Data referente ao limite de pagamento do boleto.

            Formato aceito: YYYY-MM-DD

            '
        codigoEspecie:
          type: string
          description: 'Codigo de Espécie do boleto.

            '
        codigoBarras:
          type: string
          description: 'Codigo de barras do boleto.

            '
        linhaDigitavel:
          type: string
          description: 'Linha digitável do boleto.

            '
        origem:
          type: string
          description: 'Origem da requisição que gerou o boleto.

            '
        mensagem:
          $ref: '#/components/schemas/mensagem'
        desconto1:
          $ref: '#/components/schemas/descontoResponse'
        desconto2:
          $ref: '#/components/schemas/descontoResponse'
        desconto3:
          $ref: '#/components/schemas/descontoResponse'
        multa:
          $ref: '#/components/schemas/multaResponse'
        mora:
          $ref: '#/components/schemas/moraResponse'
    mensagem:
      properties:
        linha1:
          type: string
          description: Linha 1 do campo de texto do título
          maxLength: 78
        linha2:
          type: string
          description: Linha 2 do campo de texto do título
          maxLength: 78
        linha3:
          type: string
          description: Linha 3 do campo de texto do título
          maxLength: 78
        linha4:
          type: string
          description: Linha 4 do campo de texto do título
          maxLength: 78
        linha5:
          type: string
          description: Linha 5 do campo de texto do título
          maxLength: 78
    mora:
      required:
      - codigoMora
      properties:
        codigoMora:
          type: string
          example: ISENTO
          description: 'Código de Mora do título.

            * `VALORDIA` - Valor ao dia

            * `TAXAMENSAL` - Taxa mensal

            * `ISENTO` - Isento

            '
        data:
          type: string
          description: 'Data da Mora do título.


            Obrigatório se informado código de mora VALORDIA, TAXAMENSAL.


            Deve ser maior que o vencimento e marca a data de início de cobrança

            de mora (incluindo essa data)


            Formato aceito: YYYY-MM-DD

            '
          example: '2018-07-27'
        taxa:
          type: number
          description: 'Percentual de Mora do título.


            Obrigatória se informado código de mora TAXAMENSAL

            '
          example: 0
        valor:
          type: number
          description: 'Valor de Mora expresso na moeda do título.


            Obrigatório se informado código de mora TAXAMENSAL


            Deve ser 0 para código de mora ISENTO

            '
          example: 0
    incluiBoletoRequest:
      type: object
      required:
      - seuNumero
      - dataVencimento
      - valorNominal
      - pagador
      - numDiasAgenda
      properties:
        seuNumero:
          type: string
          description: Campo Seu Número do título
          example: '123456'
          maxLength: 15
        valorNominal:
          type: number
          description: 'Valor Nominal do título


            O valor nominal deve ser maior ou igual à R$2.50

            '
          minimum: 2.5
          maximum: 99999999.99
        dataVencimento:
          type: string
          description: 'Data de vencimento do título


            Formato aceito: YYYY-MM-DD

            '
          example: '2018-07-27'
        numDiasAgenda:
          type: integer
          description: Número de dias corridos após o vencimento para o cancelamento efetivo automático do boleto. (de 0 até 60)
        pagador:
          $ref: '#/components/schemas/pagador'
        mensagem:
          $ref: '#/components/schemas/mensagem'
        desconto1:
          $ref: '#/components/schemas/desconto'
        desconto2:
          $ref: '#/components/schemas/desconto'
        desconto3:
          $ref: '#/components/schemas/desconto'
        multa:
          $ref: '#/components/schemas/multa'
        mora:
          $ref: '#/components/schemas/mora'
        beneficiarioFinal:
          $ref: '#/components/schemas/beneficiarioFinal'
      xml:
        name: Boleto
    descontoResponse:
      properties:
        codigo:
          type: string
        data:
          type: string
        taxa:
          type: number
        valor:
          type: number
    BoletosPageResponse:
      type: object
      title: Boletos Consultados
      required:
      - content
      properties:
        totalPages:
          $ref: '#/components/schemas/totalPages'
        totalElements:
          $ref: '#/components/schemas/totalElements'
        last:
          $ref: '#/components/schemas/last'
        first:
          $ref: '#/components/schemas/first'
        size:
          $ref: '#/components/schemas/size'
        numberOfElements:
          $ref: '#/components/schemas/numberOfElements'
        content:
          type: array
          title: Lista de Boletos consultados
          items:
            $ref: '#/components/schemas/boletoResponse'
    ProblemaViolacao:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI de referência que identifica o tipo de problema. De acordo com a RFC 7807.
          example: https://boleto.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: Descrição resumida do problema.
          example: Not found
        status:
          type: integer
          description: Código HTTP do status retornado.
          example: 404
        detail:
          type: string
          description: Descrição completa do problema.
        violacoes:
          type: array
          items:
            $ref: '#/components/schemas/Violacao'
    moraResponse:
      properties:
        codigo:
          type: string
        data:
          type: string
        taxa:
          type: number
        valor:
          type: number
    desconto:
      required:
      - codigoDesconto
      - valor
      - taxa
      properties:
        codigoDesconto:
          type: string
          description: 'Código de Desconto do título.

            * `NAOTEMDESCONTO` - Não tem desconto.

            * `VALORFIXODATAINFORMADA` - Valor fixo até a data informada.

            * `PERCENTUALDATAINFORMADA` - Percentual até a data informada.

            '
        data:
          type: string
          description: 'Data de Desconto do título.


            Obrigatório para códigos de desconto VALORFIXODATAINFORMADA e PERCENTUALDATAINFORMADA. Não informar para os

            demais.


            Formato aceito: YYYY-MM-DD

            '
          example: '2018-07-27'
        taxa:
          type: number
          description: 'Taxa Percentual de Desconto do título.


            Obrigatório para o código de desconto PERCENTUALDATAINFORMADA.

            Para os demais informar 0.

            '
        valor:
          type: number
          description: 'Valor de Desconto, expresso na moeda do título.


            Obrigatório para o código de desconto VALORFIXODATAINFORMADA.

            Para os demais informar 0.

            '
    first:
      type: boolean
      description: Primeira página
      example: true
    incluiBoletoResponse:
      type: object
      properties:
        seuNumero:
          type: string
          description: Seu Número, enviado na requisição para inclusão do título.
          maxLength: 11
        nossoNumero:
          type: string
          description: Nosso Número, atribuído automaticamente pelo banco na emissão do título.
          maxLength: 11
        codigoBarras:
          type: string
          description: Representação numérica do código de barras do título emitido. (44 dígitos)
          maxLength: 44
        linhaDigitavel:
          type: string
          description: Contém os mesmos dados do código de barras dispostos em ordem diferente e acrescido de dígitos verificadores. (47 dígitos)
          maxLength: 47
    totalPages:
      type: integer
      title: Quantidade total de páginas
      description: Quantidade total de páginas disponíveis para consulta.
      minimum: 1
      example: 1
    sumarioResponse:
      type: object
      properties:
        pagos:
          $ref: '#/components/schemas/quantidadeValor'
        abertos:
          $ref: '#/components/schemas/quantidadeValor'
        vencidos:
          $ref: '#/components/schemas/quantidadeValor'
        cancelados:
          $ref: '#/components/schemas/quantidadeValor'
        expirados:
          $ref: '#/components/schemas/quantidadeValor'
    size:
      type: integer
      title: Quantidade de itens por página
      description: Quantidade de registros por página, configurado na requisição.
      minimum: 1
      example: 20
    beneficiarioFinal:
      required:
      - nome
      - cpfCnpj
      - tipoPessoa
      - cep
      - endereco
      - bairro
      - cidade
      - uf
      type: object
      properties:
        nome:
          type: string
          description: Nome do beneficiário final
          maxLength: 100
        cpfCnpj:
          type: string
          description: 'CPF/CNPJ do beneficiário final do título

            CNPJ: NNNNNNNNNFFFFCC

            CPF : 0000NNNNNNNNNCC,

            onde

            __NNNNNNNNN__ é a raiz do CNPJ/CPF

            __FFFF__ = filial do CNPJ

            __CC__ = dígitos de controle

            '
        tipoPessoa:
          type: string
          description: 'Tipo do beneficiário final:

            * FISICA - Pessoa Física

            * JURIDICA - Pessoa Jurídica

            '
        cep:
          type: string
          description: CEP do beneficiário final
          example: '30110000'
        endereco:
          type: string
          description: Endereço (logradouro) do beneficiário final
          maxLength: 100
          example: Avenida Brasil
        bairro:
          type: string
          description: Bairro do beneficiário final
          example: Centro
          maxLength: 60
          default: ''
        cidade:
          type: string
          description: Cidade do beneficiário final
          maxLength: 60
          example: Belo Horizonte
        uf:
          $ref: '#/components/schemas/enumUF'
    PdfResponse:
      type: object
      properties:
        pdf:
          type: string
          description: Retorno do pdf base64 para String
    pagador:
      type: object
      required:
      - cpfCnpj
      - nome
      - tipoPessoa
      - cep
      - endereco
      - cidade
      - uf
      properties:
        cpfCnpj:
          type: string
          description: 'CPF/CNPJ do pagador do título


            CNPJ: NNNNNNNNNFFFFCC


            CPF : 0000NNNNNNNNNCC,


            onde


            __NNNNNNNNN__ é a raiz do CNPJ/CPF


            __FFFF__ = filial do CNPJ


            __CC__ = dígitos de controle

            '
          minLength: 11
          maxLength: 14
        tipoPessoa:
          type: string
          description: 'Tipo do pagador:

            * `FISICA` - Pessoa Física

            * `JURIDICA` - Pessoa Jurídica

            '
        nome:
          type: string
          description: Nome do pagador
          maxLength: 100
          minLength: 1
        endereco:
          type: string
          description: Endereço do pagador
          maxLength: 100
          minLength: 1
          example: Avenida Brasil
        numero:
          type: string
          description: Número no logradouro do pagador
          maxLength: 10
          example: '3456'
          default: ''
        complemento:
          type: string
          description: Complemento do endereço do pagador
          maxLength: 30
          example: apartamento 3 bloco 4
          default: ''
        bairro:
          type: string
          description: Bairro do pagador
          maxLength: 60
          example: Centro
          default: ''
        cidade:
