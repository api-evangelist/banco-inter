      - valor
      - horario
      properties:
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        txid:
          $ref: '#/components/schemas/TxId'
        valor:
          type: string
          title: Valor do Pix.
          pattern: \d{1,10}\.\d{2}
          description: Valor do Pix.
        horario:
          type: string
          format: date-time
          title: Horário
          description: Horário em que o Pix foi processado no PSP.
        infoPagador:
          type: string
          title: Informação livre do pagador
          maxLength: 140
        devolucoes:
          type: array
          title: Devoluções
          description: Contendo `id`, `rtrId`, `valor`, `natureza`, `descricao`, `horario`, `status` e `motivo` da devolução.
          items:
            $ref: '#/components/schemas/DevolucaoPixAutomatico'
    CobRAtualizacao:
      type: object
      title: Histórico de Atualização da Cobrança Recorrente
      required:
      - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status
          description: Histórico das mudanças de status das cobranças recorrentes.
          items:
            type: object
            required:
            - status
            - data
            properties:
              status:
                type: string
                title: Status da cobrança
                description: 'Status da cobrança recorrente:

                  - `CRIADA`: A cobrança foi criada pelo usuário recebedor

                  - `ATIVA`: O PSP Pagador recebeu e aceitou a cobrança, agendando o pagamento

                  - `CONCLUIDA`: A cobrança foi paga com sucesso

                  - `EXPIRADA`: A cobrança não foi liquidada após todas as tentativas de pagamento permitidas

                  - `REJEITADA`: A cobrança foi rejeitada pelo PSP Pagador

                  - `CANCELADA`: A cobrança foi cancelada com sucesso

                  '
                enum:
