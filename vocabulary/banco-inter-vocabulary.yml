    definition: Essa seção apresenta os endpoints relacionados ao gerenciamento de recorrências do Pix Automático. Para que as cobranças sejam
      geradas automaticamente para os clientes pagadores, devemos criar uma recorrência que o cliente pagador deverá autorizar. ---
    tags:
    - Resource Group
    source: openapi/banco-inter-pix-automatico-openapi.yml
  - term: Solicitar Recorrência
    definition: Esta seção apresenta os endpoints relacionados ao gerenciamento de solicitações de confirmação de recorrência, que equivalem às
      autorizações necessárias. Para que as recorrências tenham validade e possam gerar cobranças automaticamente, o cliente pagador precisa realizar
      o aceite. Por meio dessa autorização, o cliente confirma que concorda com a recorrência estabelecida. ---
    tags:
    - Resource Group
    source: openapi/banco-inter-pix-automatico-openapi.yml
  - term: Cobrança Recorrente
    definition: Esta seção apresenta os endpoints relacionados ao gerenciamento de cobranças associadas a uma recorrência. As cobranças só poderão
      ser geradas utilizando este endpoint após a recorrência ser autorizada por meio da solicitação de recorrência (autorização). ---
    tags:
    - Resource Group
    source: openapi/banco-inter-pix-automatico-openapi.yml
  - term: Location da Recorrência
