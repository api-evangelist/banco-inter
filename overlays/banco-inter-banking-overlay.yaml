    x-apievangelist-enriched: '2026-10-18'
    x-provider: Banco Inter S.A.
    x-docs: https://developers.inter.co/
- target: $.components
  update:
    securitySchemes:
      interOAuth:
        type: oauth2
        description: 'OAuth 2.0 client credentials (POST /oauth/v2/token, see openapi/banco-inter-token-openapi.yml) over mTLS: every call must
          present the integration certificate and key issued in Internet Banking PJ. Scopes are those named in each operation description.'
        flows:
          clientCredentials:
            tokenUrl: https://cdpj.partners.bancointer.com.br/oauth/v2/token
            scopes:
              extrato.read: Scope named in the operation descriptions
              pagamento-boleto.read: Scope named in the operation descriptions
              pagamento-boleto.write: Scope named in the operation descriptions
              pagamento-darf.write: Scope named in the operation descriptions
              pagamento-lote.read: Scope named in the operation descriptions
              pagamento-lote.write: Scope named in the operation descriptions
              pagamento-pix.read: Scope named in the operation descriptions
              pagamento-pix.write: Scope named in the operation descriptions
              webhook-banking.read: Scope named in the operation descriptions
              webhook-banking.write: Scope named in the operation descriptions
        x-sandbox-tokenUrl: https://cdpj-sandbox.partners.uatinter.co/oauth/v2/token
      interMutualTLS:
        type: mutualTLS
        description: Client certificate + key from the Inter Empresas integration.
