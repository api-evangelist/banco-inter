    x-provider: Banco Inter S.A.
    x-docs: https://developers.inter.co/
- target: $.components
  update:
    securitySchemes:
      interOAuth:
        type: oauth2
        description: 'OAuth 2.0 client credentials (POST /oauth/v2/token, see openapi/banco-inter-token-openapi.yml) over mTLS: every call must
          present the integration certificate and key issued in Internet Banking PJ. Scopes are those named in each operation description.'
        flows:
          clientCredentials:
            tokenUrl: https://cdpj.partners.bancointer.com.br/oauth/v2/token
            scopes:
              cobr.read: Scope named in the operation descriptions
              cobr.write: Scope named in the operation descriptions
              payloadlocationrec.read: Scope named in the operation descriptions
              payloadlocationrec.write: Scope named in the operation descriptions
              pix.write: Scope named in the operation descriptions
              rec.read: Scope named in the operation descriptions
              rec.write: Scope named in the operation descriptions
              solicrec.read: Scope named in the operation descriptions
              solicrec.write: Scope named in the operation descriptions
              webhookcobr.read: Scope named in the operation descriptions
              webhookcobr.write: Scope named in the operation descriptions
              webhookrec.read: Scope named in the operation descriptions
              webhookrec.write: Scope named in the operation descriptions
        x-sandbox-tokenUrl: https://cdpj-sandbox.partners.uatinter.co/oauth/v2/token
      interMutualTLS:
        type: mutualTLS
        description: Client certificate + key from the Inter Empresas integration.
