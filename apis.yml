aid: banco-inter

name: Banco Inter

description: 'Banco Inter (Inter&Co, Nasdaq: INTR) is a Brazilian digital bank and financial super app offering free digital checking accounts,
  payments, Pix, credit, investments, insurance and an international Global Account. Its Inter Empresas developer portal (developers.inter.co)
  documents business banking APIs secured with mTLS certificates and OAuth 2.0: statements (Extrato), balances (Saldos), payments, Pix Cobrança,
  Pix Pagamento, Pix Automático and boleto collection (Cobrança), plus webhooks, a sandbox environment, SDKs (Java, C#, Python, PHP), CNAB file
  tooling and an MCP server.'

